name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Stage 1 baseline
        run: pnpm ci:verify

      - name: Set up Terraform for offline configuration tests
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Verify offline connection-fault Terraform wiring
        env:
          TF_IN_AUTOMATION: true
          TF_INPUT: false
        run: |
          terraform -chdir=infra/deploy/gcp/staging init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/deploy/gcp/staging fmt -check -recursive
          terraform -chdir=infra/deploy/gcp/staging validate
          node .github/scripts/s22-connection-fault-terraform-check.mjs
