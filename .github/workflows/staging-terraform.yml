          sha256sum s22-instagram-verify-access-remove.tfplan > s22-instagram-verify-access-remove.tfplan.sha256
          terraform show -json s22-instagram-verify-access-remove.tfplan > s22-instagram-verify-access-remove.tfplan.json
          jq -e --arg resource "$RESOURCE" --arg member "serviceAccount:$TF_VAR_deployer_service_account_email" '
