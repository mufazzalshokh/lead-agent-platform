name: Staging Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: Plan is always safe; apply requires the explicit owner approval token
        required: true
        type: choice
        options:
          - plan
          - apply
      phase:
        description: Reviewed lifecycle/cost profile
        required: true
        type: choice
        options:
          - bootstrap-iam
          - bootstrap-log-viewer
          - bootstrap-log-viewer-remove
          - foundation
          - foundation-reconcile
          - foundation-reconcile-verify
          - cloud-sql-start
          - cloud-sql-phase-b
          - bootstrap
          - migration
          - migration-resume
          - migration-validate
          - api-image-update
          - api-image-verify
          - migrator-image-update
          - migrator-image-verify
          - migration-diagnose
          - migration-wiring-diagnose
          - migration-error-read
          - runtime-preflight
          - runtime-diagnose
          - auth-callback-diagnose
          - instagram-verify-access
          - instagram-verify
          - instagram-verify-access-remove
          - telegram-verify-access
          - telegram-verify
          - telegram-verify-access-remove
          - owner-workspace-bootstrap
          - owner-workspace-verify
          - full
          - load
          - dormant
      commit_sha:
        description: Exact 40-character commit preserved on the dispatched approved branch
        required: true
        type: string
      deployment_timestamp:
        description: UTC RFC3339 deployment timestamp for runtime phases
        required: false
        type: string
      api_image:
        description: Immutable API image reference by digest
        required: false
        type: string
      api_git_commit_sha:
        description: Exact source commit used to build the immutable API image
        required: false
        type: string
      api_deployment_timestamp:
        description: Exact deployment timestamp currently on the API for isolated migrator update/resume
        required: false
        type: string
      api_migration_head:
        description: Exact migration head packaged in the immutable API image
        required: false
        type: string
      web_image:
        description: Immutable Web image reference by digest
        required: false
        type: string
      worker_image:
        description: Immutable worker image reference by digest (full phase)
        required: false
        type: string
      migrator_image:
        description: Immutable migrator image reference by digest (migration and later phases)
        required: false
        type: string
      migrator_git_commit_sha:
        description: Exact source commit used to build the immutable migrator image
        required: false
        type: string
      migrator_deployment_timestamp:
        description: Exact deployment timestamp currently on the migrator for isolated API updates
        required: false
        type: string
      runtime_git_commit_sha:
        description: Exact commit currently deployed to API, Web, and Worker; required for isolated migrator update/resume
        required: false
        type: string
      runtime_deployment_timestamp:
        description: Exact deployment timestamp currently on API, Web, and Worker; required for isolated migrator update/resume
        required: false
        type: string
      runtime_migration_head:
        description: Exact migration provenance currently on API, Web, and Worker; required for isolated migrator update/resume
        required: false
        type: string
      owner_approval_token:
        description: Leave empty for plan; apply requires S22-APPLY-APPROVED
        required: false
        type: string
      plan_run_id:
        description: GitHub run ID containing the exact reviewed plan; required only for apply
        required: false
        type: string
      approved_plan_sha256:
        description: Exact owner-approved saved-plan SHA256; required only for apply
        required: false
        type: string
      migrator_execution_id:
        description: Exact failed Cloud Run migrator execution for sanitized diagnostic reads
        required: false
        type: string
      auth_callback_request_id:
        description: Public request ID for request-scoped sanitized callback diagnostics
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: staging-terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} / ${{ inputs.phase }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      S22_ACTION: ${{ inputs.action }}
      S22_AUTH_CALLBACK_REQUEST_ID: ${{ inputs.auth_callback_request_id }}
      S22_API_DEPLOYMENT_TIMESTAMP: ${{ inputs.api_deployment_timestamp }}
      S22_API_GIT_COMMIT_SHA: ${{ inputs.api_git_commit_sha }}
      S22_APPROVAL_TOKEN: ${{ inputs.owner_approval_token }}
      S22_APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
      S22_COMMIT_SHA: ${{ inputs.commit_sha }}
      S22_MIGRATOR_GIT_COMMIT_SHA: ${{ inputs.migrator_git_commit_sha }}
      S22_MIGRATOR_DEPLOYMENT_TIMESTAMP: ${{ inputs.migrator_deployment_timestamp }}
      S22_MIGRATOR_EXECUTION_ID: ${{ inputs.migrator_execution_id }}
      S22_PHASE: ${{ inputs.phase }}
      S22_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      S22_RUNTIME_DEPLOYMENT_TIMESTAMP: ${{ inputs.runtime_deployment_timestamp }}
      S22_RUNTIME_GIT_COMMIT_SHA: ${{ inputs.runtime_git_commit_sha }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: me-central1
      TF_VAR_git_commit_sha: ${{ inputs.commit_sha }}
      TF_VAR_deployment_timestamp: ${{ inputs.deployment_timestamp }}
      TF_VAR_api_image: ${{ inputs.api_image }}
      TF_VAR_api_migration_head: ${{ inputs.api_migration_head }}
      TF_VAR_web_image: ${{ inputs.web_image }}
      TF_VAR_worker_image: ${{ inputs.worker_image }}
      TF_VAR_migrator_image: ${{ inputs.migrator_image }}
      TF_VAR_runtime_migration_head: ${{ inputs.runtime_migration_head }}
      TF_VAR_api_public_origin: ${{ vars.STAGING_API_ORIGIN }}
      TF_VAR_web_public_origin: ${{ vars.STAGING_WEB_ORIGIN }}
      TF_VAR_auth0_issuer: ${{ vars.STAGING_AUTH0_ISSUER }}
      TF_VAR_auth0_client_id: ${{ vars.STAGING_AUTH0_CLIENT_ID }}
      TF_VAR_telegram_bot_username: ${{ vars.STAGING_TELEGRAM_BOT_USERNAME }}
      TF_VAR_instagram_app_id: ${{ vars.STAGING_INSTAGRAM_APP_ID }}
      TF_VAR_instagram_graph_api_version: ${{ vars.STAGING_INSTAGRAM_GRAPH_API_VERSION }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_deployer_service_account_email: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_monitoring_notification_channel_ids: ${{ vars.STAGING_MONITORING_NOTIFICATION_CHANNEL_IDS_JSON }}
      TF_VAR_state_bucket_name: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
      TF_VAR_temporary_logging_viewer_enabled: ${{ inputs.phase == 'bootstrap-log-viewer' }}
      TF_VAR_temporary_instagram_verifier_access_enabled: ${{ inputs.phase == 'instagram-verify-access' }}
      TF_VAR_temporary_telegram_verifier_access_enabled: ${{ inputs.phase == 'telegram-verify-access' }}
    steps:
      - name: Validate request boundary
        env:
          ACTION: ${{ env.S22_ACTION }}
          APPROVED_PLAN_SHA256: ${{ env.S22_APPROVED_PLAN_SHA256 }}
          APPROVAL_TOKEN: ${{ env.S22_APPROVAL_TOKEN }}
          DISPATCH_REF: ${{ github.ref }}
          PHASE: ${{ env.S22_PHASE }}
          PLAN_RUN_ID: ${{ env.S22_PLAN_RUN_ID }}
          REQUESTED_SHA: ${{ env.S22_COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DISPATCH_REF" in
            refs/heads/main|refs/heads/verify/s22-staging-recovery-capacity) ;;
            *) echo "Staging Terraform may run only from main or the S22 verification branch." >&2; exit 1 ;;
          esac
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$PHASE" == "migration-error-read" ]]; then
            [[ "$ACTION" == "plan" ]]
            [[ "$S22_MIGRATOR_EXECUTION_ID" =~ ^lead-agent-staging-migrator-[a-z0-9]+$ ]]
          fi
          if [[ "$PHASE" == "migration-validate" ]]; then
            [[ "$ACTION" == "plan" ]]
          fi
          if [[ "$PHASE" == "owner-workspace-bootstrap" ]]; then
            [[ "$ACTION" == "apply" ]]
            [[ "$APPROVAL_TOKEN" == "S22-APPLY-APPROVED" ]]
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ -z "$PLAN_RUN_ID" ]]
            [[ -z "$APPROVED_PLAN_SHA256" ]]
          fi
          if [[ "$PHASE" == "owner-workspace-verify" ]]; then
            [[ "$ACTION" == "plan" ]]
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$S22_MIGRATOR_EXECUTION_ID" =~ ^lead-agent-staging-migrator-[a-z0-9]+$ ]]
            [[ -z "$PLAN_RUN_ID" ]]
            [[ -z "$APPROVED_PLAN_SHA256" ]]
          fi
          if [[ "$PHASE" == "runtime-preflight" ]]; then
            [[ "$ACTION" == "plan" ]]
          fi
          if [[ "$PHASE" == "runtime-diagnose" ]]; then
            [[ "$ACTION" == "plan" ]]
          fi
          if [[ "$PHASE" == "auth-callback-diagnose" ]]; then
            [[ "$ACTION" == "plan" ]]
            [[ "$S22_AUTH_CALLBACK_REQUEST_ID" == "request:latest" || "$S22_AUTH_CALLBACK_REQUEST_ID" =~ ^request:req-[A-Za-z0-9_-]{1,64}$ ]]
          fi
          if [[ "$PHASE" == "api-image-update" || "$PHASE" == "api-image-verify" ]]; then
            [[ "$S22_API_GIT_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$TF_VAR_api_migration_head" == "0031_s22_widget_inbound_route_management" ]]
            [[ "$S22_MIGRATOR_GIT_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$S22_MIGRATOR_DEPLOYMENT_TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
            [[ "$S22_RUNTIME_GIT_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$S22_RUNTIME_DEPLOYMENT_TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
            [[ "$TF_VAR_deployment_timestamp" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
            [[ "$TF_VAR_runtime_migration_head" =~ ^[0-9]{4}_[a-z0-9_]+$ ]]
            [[ "$TF_VAR_api_image" =~ ^me-central1-docker\.pkg\.dev/lead-agent-stg-739284/lead-agent/api@sha256:[0-9a-f]{64}$ ]]
            [[ "$TF_VAR_web_image" =~ ^me-central1-docker\.pkg\.dev/lead-agent-stg-739284/lead-agent/web@sha256:[0-9a-f]{64}$ ]]
            [[ "$TF_VAR_worker_image" =~ ^me-central1-docker\.pkg\.dev/lead-agent-stg-739284/lead-agent/worker@sha256:[0-9a-f]{64}$ ]]
            [[ "$TF_VAR_migrator_image" =~ ^me-central1-docker\.pkg\.dev/lead-agent-stg-739284/lead-agent/migrator@sha256:[0-9a-f]{64}$ ]]
          fi
          if [[ "$PHASE" == "api-image-verify" ]]; then
            [[ "$ACTION" == "plan" ]]
          fi
          if [[ "$PHASE" == "instagram-verify" ]]; then
            [[ "$ACTION" == "plan" ]]
            [[ "$TF_VAR_api_image" =~ ^me-central1-docker\.pkg\.dev/lead-agent-stg-739284/lead-agent/api@sha256:[0-9a-f]{64}$ ]]
          fi
          if [[ "$PHASE" == "telegram-verify" ]]; then
            [[ "$ACTION" == "plan" ]]
            [[ "$TF_VAR_api_image" =~ ^me-central1-docker\.pkg\.dev/lead-agent-stg-739284/lead-agent/api@sha256:[0-9a-f]{64}$ ]]
          fi
          if [[ "$PHASE" == "migration-wiring-diagnose" && -n "$S22_MIGRATOR_EXECUTION_ID" ]]; then
            [[ "$S22_MIGRATOR_EXECUTION_ID" =~ ^lead-agent-staging-migrator-[a-z0-9]+$ ]]
          fi
          if [[ "$PHASE" == "migrator-image-update" || "$PHASE" == "migrator-image-verify" || "$PHASE" == "migration-resume" ]]; then
            [[ "$S22_API_GIT_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$S22_API_DEPLOYMENT_TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
            [[ "$TF_VAR_api_migration_head" =~ ^[0-9]{4}_[a-z0-9_]+$ ]]
            [[ "$S22_MIGRATOR_GIT_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$S22_RUNTIME_GIT_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$S22_RUNTIME_DEPLOYMENT_TIMESTAMP" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]
            [[ "$TF_VAR_runtime_migration_head" =~ ^[0-9]{4}_[a-z0-9_]+$ ]]
            [[ "$TF_VAR_api_image" =~ ^me-central1-docker\.pkg\.dev/lead-agent-stg-739284/lead-agent/api@sha256:[0-9a-f]{64}$ ]]
            [[ "$TF_VAR_web_image" =~ ^me-central1-docker\.pkg\.dev/lead-agent-stg-739284/lead-agent/web@sha256:[0-9a-f]{64}$ ]]
            [[ "$TF_VAR_worker_image" =~ ^me-central1-docker\.pkg\.dev/lead-agent-stg-739284/lead-agent/worker@sha256:[0-9a-f]{64}$ ]]
          fi
          if [[ "$PHASE" == "migrator-image-verify" ]]; then
            [[ "$ACTION" == "plan" ]]
          fi
          if [[ "$ACTION" == "apply" && "$APPROVAL_TOKEN" != "S22-APPLY-APPROVED" ]]; then
            echo "Apply requires the exact owner approval token." >&2
            exit 1
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" != "migration-resume" && "$PHASE" != "owner-workspace-bootstrap" && ! "$PLAN_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Apply requires the exact reviewed plan run ID." >&2
            exit 1
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" == "foundation-reconcile" ]]; then
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "2396fdf797eb4b19252a34c8b45e93945a8f53a3" ]]
            [[ "$PLAN_RUN_ID" == "36226804148" ]]
            [[ "$APPROVED_PLAN_SHA256" == "ddcf63f2b087c14a4dc7c52aee46e8530f97d7fc05b8ab0c8467eb8526c285f0" ]]
          fi
          if [[ "$PHASE" == "foundation-reconcile-verify" ]]; then
            [[ "$ACTION" == "plan" ]]
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "2396fdf797eb4b19252a34c8b45e93945a8f53a3" ]]
            [[ "$PLAN_RUN_ID" == "36226804148" ]]
            [[ "$APPROVED_PLAN_SHA256" == "ddcf63f2b087c14a4dc7c52aee46e8530f97d7fc05b8ab0c8467eb8526c285f0" ]]
          fi
          if [[ "$PHASE" == "cloud-sql-phase-b" ]]; then
            [[ "$ACTION" == "apply" ]]
            [[ "$APPROVAL_TOKEN" == "S22-APPLY-APPROVED" ]]
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "2396fdf797eb4b19252a34c8b45e93945a8f53a3" ]]
            [[ "$PLAN_RUN_ID" == "36230182001" ]]
            [[ "$APPROVED_PLAN_SHA256" == "2e89253d05281e38af1157e6cf3f1a09740db5572f699f36228606fbbd8a987e" ]]
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" == "bootstrap" ]]; then
            [[ "$APPROVAL_TOKEN" == "S22-APPLY-APPROVED" ]]
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "2396fdf797eb4b19252a34c8b45e93945a8f53a3" ]]
            [[ "$PLAN_RUN_ID" == "36234151332" ]]
            [[ "$APPROVED_PLAN_SHA256" == "4a116fd0d9db69ea821b22c04a1666b1d17f402816f74dde298578ed1d99da96" ]]
            [[ "$TF_VAR_deployment_timestamp" == "2026-09-26T09:53:56Z" ]]
            [[ "$TF_VAR_api_image" == "me-central1-docker.pkg.dev/lead-agent-stg-739284/lead-agent/api@sha256:a19da09bda3b113f00d92ef2e245e8622505b340592b72c2dbb465dc05aafdcf" ]]
            [[ "$TF_VAR_web_image" == "me-central1-docker.pkg.dev/lead-agent-stg-739284/lead-agent/web@sha256:79560082659204911e1c306ca41ce72e83b1f6a4b9975e91a84d89a477a4f93d" ]]
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" == "bootstrap-iam" ]]; then
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$REQUESTED_SHA" == "87216fcd8d2047e292c398a459e49e40c4ff2b9a" ]]
            [[ "$PLAN_RUN_ID" == "36179081896" ]]
            [[ "$APPROVED_PLAN_SHA256" == "1408052e615385b4a01651a8b64605d13746ddde10a6950f7ba4d380a18c60e0" ]]
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" == "foundation" ]]; then
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "c4134d2980c7c31653cc6e52dd21173a58297aab" ]]
            [[ "$PLAN_RUN_ID" == "36176635223" ]]
            [[ "$APPROVED_PLAN_SHA256" == "43ebe6df02eb4b693fdc17dfd2dbedf191668e3a1b61ccc4c97fe94d8cf5ad7c" ]]
          fi
          DEPLOY_RUNTIME=false
          BOOTSTRAP_RUNTIME=false
          PREPARE_MIGRATION=false
          SQL_POLICY=NEVER
          SQL_TIER=db-f1-micro
          API_MAX=1
          WEB_MAX=1
          WORKER_COUNT=0
          WORKER_MEMORY=512Mi

          case "$PHASE" in
            bootstrap-iam) ;;
            bootstrap-log-viewer) ;;
            bootstrap-log-viewer-remove) ;;
            foundation) ;;
            foundation-reconcile)
              SQL_POLICY=ALWAYS
              ;;
            foundation-reconcile-verify)
              SQL_POLICY=ALWAYS
              ;;
            cloud-sql-start)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              SQL_POLICY=ALWAYS
              ;;
            cloud-sql-phase-b) ;;
            bootstrap)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              ;;
            migration)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              ;;
            migration-resume)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              WORKER_COUNT=1
              ;;
            migration-validate)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              ;;
            api-image-update)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              WORKER_COUNT=1
              ;;
            api-image-verify)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              WORKER_COUNT=1
              ;;
            migrator-image-update)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              WORKER_COUNT=1
              ;;
            migrator-image-verify)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              WORKER_COUNT=1
              ;;
            migration-diagnose)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              ;;
            migration-wiring-diagnose)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              ;;
            migration-error-read)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              ;;
            runtime-preflight)
              SQL_POLICY=ALWAYS
              ;;
            runtime-diagnose)
              SQL_POLICY=ALWAYS
              ;;
            auth-callback-diagnose) ;;
            instagram-verify-access)
              SQL_POLICY=ALWAYS
              ;;
            instagram-verify)
              SQL_POLICY=ALWAYS
              ;;
            instagram-verify-access-remove)
              SQL_POLICY=ALWAYS
              ;;
            telegram-verify-access)
              SQL_POLICY=ALWAYS
              ;;
            telegram-verify)
              SQL_POLICY=ALWAYS
              ;;
            telegram-verify-access-remove)
              SQL_POLICY=ALWAYS
              ;;
            full)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              WORKER_COUNT=1
              ;;
            load)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              SQL_TIER=db-custom-1-3840
              API_MAX=3
              WEB_MAX=2
              WORKER_COUNT=1
              WORKER_MEMORY=1Gi
              ;;
            dormant)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              ;;
          esac

          {
            echo "TF_VAR_deploy_runtime=$DEPLOY_RUNTIME"
            echo "TF_VAR_bootstrap_runtime=$BOOTSTRAP_RUNTIME"
            echo "TF_VAR_prepare_migration=$PREPARE_MIGRATION"
            echo "TF_VAR_cloud_sql_activation_policy=$SQL_POLICY"
            echo "TF_VAR_cloud_sql_tier=$SQL_TIER"
            echo "TF_VAR_api_max_instance_count=$API_MAX"
            echo "TF_VAR_web_max_instance_count=$WEB_MAX"
            echo "TF_VAR_worker_instance_count=$WORKER_COUNT"
            echo "TF_VAR_worker_memory=$WORKER_MEMORY"
          } >> "$GITHUB_ENV"
          if [[ "$PHASE" == "api-image-update" || "$PHASE" == "api-image-verify" ]]; then
            API_DEPLOYMENT_TIMESTAMP="$TF_VAR_deployment_timestamp"
            echo "TF_VAR_git_commit_sha=$S22_RUNTIME_GIT_COMMIT_SHA" >> "$GITHUB_ENV"
            echo "TF_VAR_deployment_timestamp=$S22_RUNTIME_DEPLOYMENT_TIMESTAMP" >> "$GITHUB_ENV"
            echo "TF_VAR_api_git_commit_sha=$S22_API_GIT_COMMIT_SHA" >> "$GITHUB_ENV"
            echo "TF_VAR_api_deployment_timestamp=$API_DEPLOYMENT_TIMESTAMP" >> "$GITHUB_ENV"
            echo "TF_VAR_migrator_git_commit_sha=$S22_MIGRATOR_GIT_COMMIT_SHA" >> "$GITHUB_ENV"
            echo "TF_VAR_migrator_deployment_timestamp=$S22_MIGRATOR_DEPLOYMENT_TIMESTAMP" >> "$GITHUB_ENV"
          elif [[ "$PHASE" == "migration-resume" || "$PHASE" == "migrator-image-update" || "$PHASE" == "migrator-image-verify" ]]; then
            echo "TF_VAR_git_commit_sha=$S22_RUNTIME_GIT_COMMIT_SHA" >> "$GITHUB_ENV"
            echo "TF_VAR_deployment_timestamp=$S22_RUNTIME_DEPLOYMENT_TIMESTAMP" >> "$GITHUB_ENV"
            echo "TF_VAR_api_git_commit_sha=$S22_API_GIT_COMMIT_SHA" >> "$GITHUB_ENV"
            echo "TF_VAR_api_deployment_timestamp=$S22_API_DEPLOYMENT_TIMESTAMP" >> "$GITHUB_ENV"
          elif [[ "$PHASE" == "cloud-sql-start" || "$PHASE" == "migration" || "$PHASE" == "migration-diagnose" || "$PHASE" == "migration-wiring-diagnose" ]]; then
            echo "TF_VAR_git_commit_sha=2396fdf797eb4b19252a34c8b45e93945a8f53a3" >> "$GITHUB_ENV"
            echo "TF_VAR_deployment_timestamp=2026-09-26T09:53:56Z" >> "$GITHUB_ENV"
          fi
          if [[ "$PHASE" == "migration-resume" || "$PHASE" == "migrator-image-update" || "$PHASE" == "migrator-image-verify" ]]; then
            echo "TF_VAR_migrator_git_commit_sha=$S22_MIGRATOR_GIT_COMMIT_SHA" >> "$GITHUB_ENV"
            echo "TF_VAR_migrator_deployment_timestamp=$TF_VAR_deployment_timestamp" >> "$GITHUB_ENV"
          fi

      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.S22_COMMIT_SHA }}

      - name: Prove commit is preserved on the dispatched branch
        env:
          DISPATCH_BRANCH: ${{ github.ref_name }}
          REQUESTED_SHA: ${{ env.S22_COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch --no-tags origin "$DISPATCH_BRANCH"
          git merge-base --is-ancestor "$REQUESTED_SHA" "origin/$DISPATCH_BRANCH"

      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.7

      - name: Initialize bootstrap Terraform
        if: env.S22_PHASE == 'bootstrap-iam' || env.S22_PHASE == 'bootstrap-log-viewer' || env.S22_PHASE == 'bootstrap-log-viewer-remove'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: terraform init -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}"

      - name: Validate bootstrap Terraform
        if: env.S22_PHASE == 'bootstrap-iam' || env.S22_PHASE == 'bootstrap-log-viewer' || env.S22_PHASE == 'bootstrap-log-viewer-remove'
        working-directory: infra/deploy/gcp/bootstrap
        run: terraform validate

      - name: Verify authoritative bootstrap state
        if: env.S22_PHASE == 'bootstrap-iam' || env.S22_PHASE == 'bootstrap-log-viewer' || env.S22_PHASE == 'bootstrap-log-viewer-remove'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_STATE_ADDRESSES="$(terraform state list)"
          BOOTSTRAP_STATE_COUNT="$(wc -l <<< "$BOOTSTRAP_STATE_ADDRESSES" | tr -d '[:space:]')"
          if [[ "$S22_PHASE" == "bootstrap-log-viewer-remove" ]]; then
            [[ "$BOOTSTRAP_STATE_COUNT" == "35" ]]
            grep -Fqx -- 'google_project_iam_member.deployer_temporary_logging_viewer[0]' <<< "$BOOTSTRAP_STATE_ADDRESSES"
          else
            [[ "$BOOTSTRAP_STATE_COUNT" == "34" ]]
          fi
          echo "Authoritative bootstrap state resources: $BOOTSTRAP_STATE_COUNT"

      - name: Create reviewed bootstrap IAM plan
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          terraform plan \
            -lock-timeout=5m \
            -target=google_project_iam_member.deployer \
            -out=s22-bootstrap-iam.tfplan
          sha256sum s22-bootstrap-iam.tfplan > s22-bootstrap-iam.tfplan.sha256

      - name: Upload exact reviewed bootstrap IAM plan
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-bootstrap-iam-plan-${{ env.S22_COMMIT_SHA }}
          path: |
            infra/deploy/gcp/bootstrap/s22-bootstrap-iam.tfplan
            infra/deploy/gcp/bootstrap/s22-bootstrap-iam.tfplan.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Create reviewed temporary logging viewer plan
        if: env.S22_PHASE == 'bootstrap-log-viewer' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          PLAN=s22-bootstrap-log-viewer.tfplan
          PLAN_JSON=s22-bootstrap-log-viewer.tfplan.json
          terraform plan \
            -lock-timeout=5m \
            -target='google_project_iam_member.deployer_temporary_logging_viewer[0]' \
            -out="$PLAN"
          sha256sum "$PLAN" > "$PLAN.sha256"
          terraform show -json "$PLAN" > "$PLAN_JSON"
          ACTIONS="$(
            jq -c '
              [.resource_changes[]
               | select(.mode == "managed" and .change.actions != ["no-op"])
               | ((.change.actions | join(",")) + ":" + .address)]
              | sort
            ' "$PLAN_JSON"
          )"
          [[ "$ACTIONS" == '["create:google_project_iam_member.deployer_temporary_logging_viewer[0]"]' ]]
          jq -e '
            [.resource_changes[] | select(.change.actions == ["create"])] | length == 1
          ' "$PLAN_JSON" > /dev/null
          jq -e '
            [.resource_changes[] | select(.change.actions == ["delete"])] | length == 0
          ' "$PLAN_JSON" > /dev/null
          jq -e '
            [.resource_changes[]
             | select(.change.actions == ["delete", "create"] or .change.actions == ["create", "delete"])]
            | length == 0
          ' "$PLAN_JSON" > /dev/null
          jq -e '
            [.resource_changes[]
             | select(.change.actions != ["no-op"])
             | select(
                 .type != "google_project_iam_member"
                 or .change.after.role != "roles/logging.viewer"
                 or .change.after.member != "serviceAccount:lead-agent-staging-deploy@lead-agent-stg-739284.iam.gserviceaccount.com"
               )]
            | length == 0
          ' "$PLAN_JSON" > /dev/null
          echo "bootstrap_logging_viewer_plan_actions=$ACTIONS"
          echo "bootstrap_logging_viewer_plan_creates=1"
          echo "bootstrap_logging_viewer_plan_changes=0"
          echo "bootstrap_logging_viewer_plan_destroys=0"
          echo "bootstrap_logging_viewer_plan_replacements=0"
          echo "bootstrap_logging_viewer_plan_sha256=$(awk '{print $1}' "$PLAN.sha256")"
          rm -f "$PLAN_JSON"

      - name: Upload exact temporary logging viewer plan
        if: env.S22_PHASE == 'bootstrap-log-viewer' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-bootstrap-log-viewer-plan-${{ env.S22_COMMIT_SHA }}
          path: |
            infra/deploy/gcp/bootstrap/s22-bootstrap-log-viewer.tfplan
            infra/deploy/gcp/bootstrap/s22-bootstrap-log-viewer.tfplan.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Create reviewed temporary logging viewer removal plan
        if: env.S22_PHASE == 'bootstrap-log-viewer-remove' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          PLAN=s22-bootstrap-log-viewer-remove.tfplan
          PLAN_JSON=s22-bootstrap-log-viewer-remove.tfplan.json
          terraform plan \
            -lock-timeout=5m \
            -target='google_project_iam_member.deployer_temporary_logging_viewer[0]' \
            -out="$PLAN"
          sha256sum "$PLAN" > "$PLAN.sha256"
          terraform show -json "$PLAN" > "$PLAN_JSON"
          ACTIONS="$(
            jq -c '
              [.resource_changes[]
               | select(.mode == "managed" and .change.actions != ["no-op"])
               | ((.change.actions | join(",")) + ":" + .address)]
              | sort
            ' "$PLAN_JSON"
          )"
          [[ "$ACTIONS" == '["delete:google_project_iam_member.deployer_temporary_logging_viewer[0]"]' ]]
          jq -e '
            [.resource_changes[] | select(.change.actions == ["delete"])] | length == 1
          ' "$PLAN_JSON" > /dev/null
          jq -e '
            [.resource_changes[] | select(.change.actions == ["create"])] | length == 0
          ' "$PLAN_JSON" > /dev/null
          jq -e '
            [.resource_changes[]
             | select(.change.actions == ["delete", "create"] or .change.actions == ["create", "delete"])]
            | length == 0
          ' "$PLAN_JSON" > /dev/null
          jq -e '
            [.resource_changes[]
             | select(.change.actions != ["no-op"])
             | select(
                 .type != "google_project_iam_member"
                 or .change.before.role != "roles/logging.viewer"
                 or .change.before.member != "serviceAccount:lead-agent-staging-deploy@lead-agent-stg-739284.iam.gserviceaccount.com"
               )]
            | length == 0
          ' "$PLAN_JSON" > /dev/null
          echo "bootstrap_logging_viewer_removal_plan_actions=$ACTIONS"
          echo "bootstrap_logging_viewer_removal_plan_creates=0"
          echo "bootstrap_logging_viewer_removal_plan_changes=0"
          echo "bootstrap_logging_viewer_removal_plan_destroys=1"
          echo "bootstrap_logging_viewer_removal_plan_replacements=0"
          echo "bootstrap_logging_viewer_removal_plan_sha256=$(awk '{print $1}' "$PLAN.sha256")"
          rm -f "$PLAN_JSON"

      - name: Upload exact temporary logging viewer removal plan
        if: env.S22_PHASE == 'bootstrap-log-viewer-remove' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-bootstrap-log-viewer-remove-plan-${{ env.S22_COMMIT_SHA }}
          path: |
            infra/deploy/gcp/bootstrap/s22-bootstrap-log-viewer-remove.tfplan
            infra/deploy/gcp/bootstrap/s22-bootstrap-log-viewer-remove.tfplan.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Initialize staging Terraform
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_PHASE != 'bootstrap-log-viewer' && env.S22_PHASE != 'bootstrap-log-viewer-remove' && env.S22_PHASE != 'owner-workspace-bootstrap' && env.S22_PHASE != 'owner-workspace-verify'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: terraform init -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}"

      - name: Validate staging Terraform
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_PHASE != 'bootstrap-log-viewer' && env.S22_PHASE != 'bootstrap-log-viewer-remove' && env.S22_PHASE != 'owner-workspace-bootstrap' && env.S22_PHASE != 'owner-workspace-verify'
        working-directory: infra/deploy/gcp/staging
        run: terraform validate

      - name: Set up Google Cloud CLI for reconciliation inspection
        if: env.S22_PHASE == 'foundation-reconcile' || env.S22_PHASE == 'foundation-reconcile-verify' || env.S22_PHASE == 'cloud-sql-start' || env.S22_PHASE == 'cloud-sql-phase-b' || env.S22_PHASE == 'migration' || env.S22_PHASE == 'migration-resume' || env.S22_PHASE == 'migration-validate' || env.S22_PHASE == 'api-image-update' || env.S22_PHASE == 'api-image-verify' || env.S22_PHASE == 'migrator-image-update' || env.S22_PHASE == 'migrator-image-verify' || env.S22_PHASE == 'migration-diagnose' || env.S22_PHASE == 'migration-wiring-diagnose' || env.S22_PHASE == 'migration-error-read' || env.S22_PHASE == 'runtime-preflight' || env.S22_PHASE == 'runtime-diagnose' || env.S22_PHASE == 'auth-callback-diagnose' || env.S22_PHASE == 'instagram-verify' || env.S22_PHASE == 'telegram-verify' || env.S22_PHASE == 'owner-workspace-bootstrap' || env.S22_PHASE == 'owner-workspace-verify' || (env.S22_PHASE == 'bootstrap' && env.S22_ACTION == 'apply')
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify database secret version metadata
        if: env.S22_PHASE == 'migration' || env.S22_PHASE == 'migration-resume' || env.S22_PHASE == 'migration-validate' || env.S22_PHASE == 'migration-diagnose' || env.S22_PHASE == 'migration-wiring-diagnose'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_SECRETS=(
            lead-agent-staging-migration-database-url
            lead-agent-staging-runtime-database-url
            lead-agent-staging-auth-database-url
            lead-agent-staging-ingress-database-url
            lead-agent-staging-queue-database-url
          )
          for secret in "${DATABASE_SECRETS[@]}"; do
            gcloud secrets describe "$secret" --project="$PROJECT_ID" --format='value(name)' > /dev/null
            ENABLED_COUNT="$(
              gcloud secrets versions list "$secret" \
                --project="$PROJECT_ID" \
                --filter='state=ENABLED' \
                --format='value(name)' | sed '/^$/d' | wc -l | tr -d '[:space:]'
            )"
            [[ "$ENABLED_COUNT" == "1" ]]
            echo "$secret: enabled_versions=1"
          done

      - name: Execute bounded first-owner workspace bootstrap
        if: env.S22_PHASE == 'owner-workspace-bootstrap' && env.S22_ACTION == 'apply'
        env:
          AUTH0_ISSUER: ${{ vars.STAGING_AUTH0_ISSUER }}
          OWNER_SUBJECT: ${{ secrets.STAGING_OWNER_AUTH0_SUBJECT }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROJECT_ID" == "lead-agent-stg-739284" ]]
          [[ "$AUTH0_ISSUER" =~ ^https://[^/[:space:]]+/$ ]]
          [[ "$OWNER_SUBJECT" =~ ^google-oauth2\|[0-9]{1,128}$ ]]
          BOOTSTRAP_B64="$(base64 -w0 .github/scripts/s22-staging-owner-bootstrap.mjs)"
          set +e
          gcloud run jobs execute lead-agent-staging-migrator \
            --project="$PROJECT_ID" \
            --region=me-central1 \
            --args='--input-type=module,-e,eval(atob(process.env.S22_OWNER_BOOTSTRAP_B64))' \
            --update-env-vars="S22_OWNER_BOOTSTRAP_B64=$BOOTSTRAP_B64,STAGING_AUTH0_ISSUER=$AUTH0_ISSUER,STAGING_OWNER_AUTH0_SUBJECT=$OWNER_SUBJECT" \
            --wait
          BOOTSTRAP_STATUS=$?
          set -e
          unset BOOTSTRAP_B64 OWNER_SUBJECT
          EXECUTION_ID="$(
            gcloud run jobs executions list \
              --project="$PROJECT_ID" \
              --region=me-central1 \
              --job=lead-agent-staging-migrator \
              --sort-by='~metadata.creationTimestamp' \
              --limit=1 \
              --format='value(metadata.name)'
          )"
          EXECUTION_ID="${EXECUTION_ID##*/}"
          [[ "$EXECUTION_ID" =~ ^lead-agent-staging-migrator-[a-z0-9]+$ ]]
          TASK_EXIT_CODE="$(
            gcloud run jobs executions tasks list \
              --project="$PROJECT_ID" \
              --region=me-central1 \
              --execution="$EXECUTION_ID" \
              --limit=1 \
              --format='value(lastAttemptResult.exitCode)'
          )"
          if [[ -z "$TASK_EXIT_CODE" && "$BOOTSTRAP_STATUS" == "0" ]]; then
            TASK_EXIT_CODE=0
          fi
          case "$TASK_EXIT_CODE" in
            0) FAILURE_STAGE=none ;;
            70) FAILURE_STAGE=bootstrap_entry ;;
            71) FAILURE_STAGE=dependency_load ;;
            72) FAILURE_STAGE=input_validation ;;
            73) FAILURE_STAGE=database_connect ;;
            74) FAILURE_STAGE=transaction_start ;;
            75) FAILURE_STAGE=bootstrap_capability ;;
            76) FAILURE_STAGE=stored_identity_validation ;;
            77) FAILURE_STAGE=replay_protection ;;
            78) FAILURE_STAGE=success_evidence ;;
            *) FAILURE_STAGE=runtime_unclassified ;;
          esac
          if [[ "$BOOTSTRAP_STATUS" == "0" && "$TASK_EXIT_CODE" == "0" ]]; then
            BOOTSTRAP_PROOF=PASS
          else
            BOOTSTRAP_PROOF=NOT_VERIFIED
          fi
          {
            echo "organization_id=01a0ee39-91a9-7293-82c0-5b7046c10115"
            echo "organization_slug=lead-agent-staging"
            echo "organization_display_name=Lead Agent Staging"
            echo "membership_status=active"
            echo "membership_role=owner"
            echo "identity_binding=exact_issuer_subject"
            echo "audit_event_id=01a0ee39-91b0-7cb5-9bb6-bc34d73137f2"
            echo "audit_proof=$BOOTSTRAP_PROOF"
            echo "replay_protection=$BOOTSTRAP_PROOF"
            echo "integration_cards=Website Chat|Telegram Business|Instagram Professional"
            echo "execution_id=$EXECUTION_ID"
            echo "task_exit_code=${TASK_EXIT_CODE:-unavailable}"
            echo "failure_stage=$FAILURE_STAGE"
          } | tee s22-staging-owner-workspace-evidence.txt
          [[ "$BOOTSTRAP_STATUS" == "0" ]]
          [[ "$TASK_EXIT_CODE" == "0" ]]

      - name: Verify existing first-owner workspace read-only
        if: env.S22_PHASE == 'owner-workspace-verify' && env.S22_ACTION == 'plan'
        env:
          AUTH0_ISSUER: ${{ vars.STAGING_AUTH0_ISSUER }}
          OWNER_SUBJECT: ${{ secrets.STAGING_OWNER_AUTH0_SUBJECT }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SOURCE_EXECUTION_ID: ${{ env.S22_MIGRATOR_EXECUTION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROJECT_ID" == "lead-agent-stg-739284" ]]
          [[ "$AUTH0_ISSUER" =~ ^https://[^/[:space:]]+/$ ]]
          [[ "$OWNER_SUBJECT" =~ ^google-oauth2\|[0-9]{1,128}$ ]]
          [[ "$SOURCE_EXECUTION_ID" =~ ^lead-agent-staging-migrator-[a-z0-9]+$ ]]
          SOURCE_TASKS="$(mktemp)"
          CURRENT_TASKS="$(mktemp)"
          trap 'rm -f "$SOURCE_TASKS" "$CURRENT_TASKS"' EXIT
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/me-central1/jobs/lead-agent-staging-migrator/executions/${SOURCE_EXECUTION_ID}/tasks?pageSize=1" \
            > "$SOURCE_TASKS"
          unset ACCESS_TOKEN
          jq -e '
            (.tasks | length) == 1
              and (.tasks[0].completionTime // "") != ""
              and (
                .tasks[0].lastAttemptResult.exitCode == 0
                or (
                  (.tasks[0].lastAttemptResult | has("exitCode") | not)
                  and (.tasks[0].lastAttemptResult.status.code // 0) == 0
                )
              )
          ' "$SOURCE_TASKS" > /dev/null
          VERIFY_B64="$(base64 -w0 .github/scripts/s22-staging-owner-bootstrap.mjs)"
          set +e
          gcloud run jobs execute lead-agent-staging-migrator \
            --project="$PROJECT_ID" \
            --region=me-central1 \
            --args='--input-type=module,-e,eval(atob(process.env.S22_OWNER_BOOTSTRAP_B64))' \
            --update-env-vars="S22_OWNER_BOOTSTRAP_B64=$VERIFY_B64,S22_OWNER_BOOTSTRAP_MODE=verify,STAGING_AUTH0_ISSUER=$AUTH0_ISSUER,STAGING_OWNER_AUTH0_SUBJECT=$OWNER_SUBJECT" \
            --wait
          VERIFY_STATUS=$?
          set -e
          unset VERIFY_B64 OWNER_SUBJECT
          EXECUTION_ID="$(
            gcloud run jobs executions list \
              --project="$PROJECT_ID" \
              --region=me-central1 \
              --job=lead-agent-staging-migrator \
              --sort-by='~metadata.creationTimestamp' \
              --limit=1 \
              --format='value(metadata.name)'
          )"
          EXECUTION_ID="${EXECUTION_ID##*/}"
          [[ "$EXECUTION_ID" =~ ^lead-agent-staging-migrator-[a-z0-9]+$ ]]
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/me-central1/jobs/lead-agent-staging-migrator/executions/${EXECUTION_ID}/tasks?pageSize=1" \
            > "$CURRENT_TASKS"
          unset ACCESS_TOKEN
          TASK_EXIT_CODE="$(
            jq -r '
              .tasks[0].lastAttemptResult.exitCode
                // .tasks[0].status.lastAttemptResult.exitCode
                // empty
            ' "$CURRENT_TASKS"
          )"
          if [[ -z "$TASK_EXIT_CODE" && "$VERIFY_STATUS" == "0" ]]; then
            TASK_EXIT_CODE=0
          fi
          case "$TASK_EXIT_CODE" in
            0) FAILURE_STAGE=none ;;
            70) FAILURE_STAGE=bootstrap_entry ;;
            71) FAILURE_STAGE=dependency_load ;;
            72) FAILURE_STAGE=input_validation ;;
            73) FAILURE_STAGE=database_connect ;;
            74) FAILURE_STAGE=transaction_start ;;
            75) FAILURE_STAGE=bootstrap_capability ;;
            76) FAILURE_STAGE=stored_identity_validation ;;
            77) FAILURE_STAGE=replay_protection ;;
            78) FAILURE_STAGE=success_evidence ;;
            79) FAILURE_STAGE=auth_role_identity_validation ;;
            80) FAILURE_STAGE=identity_row_count ;;
            81) FAILURE_STAGE=issuer_mismatch ;;
            82) FAILURE_STAGE=subject_mismatch ;;
            83) FAILURE_STAGE=issuer_and_subject_mismatch ;;
            84) FAILURE_STAGE=identity_shape ;;
            85) FAILURE_STAGE=owner_membership ;;
            86) FAILURE_STAGE=bootstrap_audit ;;
            87) FAILURE_STAGE=auth_connection_shape ;;
            88) FAILURE_STAGE=auth_identity_unmapped ;;
            89) FAILURE_STAGE=auth_identity_invalid ;;
            *) FAILURE_STAGE=runtime_unclassified ;;
          esac
          if [[ "$VERIFY_STATUS" == "0" && "$TASK_EXIT_CODE" == "0" ]]; then
            VERIFY_PROOF=PASS
          else
            VERIFY_PROOF=FAILED
          fi
          {
            echo "organization_id=01a0ee39-91a9-7293-82c0-5b7046c10115"
            echo "organization_slug=lead-agent-staging"
            echo "organization_display_name=Lead Agent Staging"
            echo "membership_status=active"
            echo "membership_role=owner"
            echo "identity_binding=exact_issuer_subject"
            echo "audit_event_id=01a0ee39-91b0-7cb5-9bb6-bc34d73137f2"
            echo "audit_proof=$VERIFY_PROOF"
            echo "replay_protection=$VERIFY_PROOF"
            echo "database_state_proof=$VERIFY_PROOF"
            echo "bootstrap_source_execution_proof=PASS"
            echo "bootstrap_source_execution_id=$SOURCE_EXECUTION_ID"
            echo "integration_cards=Website Chat|Telegram Business|Instagram Professional"
            echo "execution_id=$EXECUTION_ID"
            echo "task_exit_code=${TASK_EXIT_CODE:-unavailable}"
            echo "failure_stage=$FAILURE_STAGE"
          } | tee s22-staging-owner-workspace-evidence.txt
          [[ "$VERIFY_STATUS" == "0" ]]
          [[ "$TASK_EXIT_CODE" == "0" ]]

      - name: Upload non-secret owner-workspace evidence
        if: always() && ((env.S22_PHASE == 'owner-workspace-bootstrap' && env.S22_ACTION == 'apply') || (env.S22_PHASE == 'owner-workspace-verify' && env.S22_ACTION == 'plan'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-staging-owner-workspace-${{ github.run_id }}
          path: s22-staging-owner-workspace-evidence.txt
          if-no-files-found: error
          retention-days: 7

      - name: Verify full runtime configuration metadata
        if: env.S22_PHASE == 'runtime-preflight'
        env:
          API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}
          AUTH0_CLIENT_ID: ${{ vars.STAGING_AUTH0_CLIENT_ID }}
          AUTH0_ISSUER: ${{ vars.STAGING_AUTH0_ISSUER }}
          INSTAGRAM_APP_ID: ${{ vars.STAGING_INSTAGRAM_APP_ID }}
          INSTAGRAM_GRAPH_API_VERSION: ${{ vars.STAGING_INSTAGRAM_GRAPH_API_VERSION }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          TELEGRAM_BOT_USERNAME: ${{ vars.STAGING_TELEGRAM_BOT_USERNAME }}
          WEB_ORIGIN: ${{ vars.STAGING_WEB_ORIGIN }}
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE=s22-runtime-preflight-evidence.txt
          REQUIRED_SECRETS=(
            lead-agent-staging-auth0-client-secret
            lead-agent-staging-auth-browser-envelope-key
            lead-agent-staging-auth-database-url
            lead-agent-staging-customer-data-encryption-key
            lead-agent-staging-customer-data-lookup-key
            lead-agent-staging-gemini-api-key
            lead-agent-staging-ingress-database-url
            lead-agent-staging-instagram-app-secret
            lead-agent-staging-instagram-webhook-verify-token
            lead-agent-staging-invitation-target-encryption-key
            lead-agent-staging-invitation-target-lookup-key
            lead-agent-staging-migration-database-url
            lead-agent-staging-queue-database-url
            lead-agent-staging-runtime-database-url
            lead-agent-staging-telegram-bot-token
            lead-agent-staging-telegram-webhook-secret
            lead-agent-staging-widget-exchange-encryption-key
            lead-agent-staging-widget-signing-key
          )
          : > "$EVIDENCE"
          for secret in "${REQUIRED_SECRETS[@]}"; do
            gcloud secrets describe "$secret" --project="$PROJECT_ID" --format='value(name)' > /dev/null
            ENABLED_COUNT="$(
              gcloud secrets versions list "$secret" \
                --project="$PROJECT_ID" \
                --filter='state=ENABLED' \
                --format='value(name)' | sed '/^$/d' | wc -l | tr -d '[:space:]'
            )"
            [[ "$ENABLED_COUNT" =~ ^[1-9][0-9]*$ ]]
            echo "$secret: enabled_versions=$ENABLED_COUNT" | tee -a "$EVIDENCE"
          done
          CHANNEL_SECRET=lead-agent-staging-channel-credentials
          gcloud secrets describe "$CHANNEL_SECRET" --project="$PROJECT_ID" --format='value(name)' > /dev/null
          CHANNEL_ENABLED_COUNT="$(
            gcloud secrets versions list "$CHANNEL_SECRET" \
              --project="$PROJECT_ID" \
              --filter='state=ENABLED' \
              --format='value(name)' | sed '/^$/d' | wc -l | tr -d '[:space:]'
          )"
          [[ "$CHANNEL_ENABLED_COUNT" == "0" ]]
          echo "$CHANNEL_SECRET: enabled_versions=0 (application-managed)" | tee -a "$EVIDENCE"

          [[ "$API_ORIGIN" == "https://lead-agent-staging-api-uj7pjzpksq-ww.a.run.app" ]]
          [[ "$WEB_ORIGIN" == "https://lead-agent-staging-web-uj7pjzpksq-ww.a.run.app" ]]
          [[ "$AUTH0_ISSUER" =~ ^https://[^/?#]+/$ ]]
          [[ -n "$AUTH0_CLIENT_ID" && ${#AUTH0_CLIENT_ID} -le 512 && ! "$AUTH0_CLIENT_ID" =~ [[:space:]] ]]
          [[ "$TELEGRAM_BOT_USERNAME" =~ ^[A-Za-z][A-Za-z0-9_]{4,31}$ ]]
          [[ "$INSTAGRAM_APP_ID" =~ ^[1-9][0-9]{3,31}$ ]]
          [[ "$INSTAGRAM_GRAPH_API_VERSION" == "v24.0" ]]
          {
            echo "required_runtime_secrets=${#REQUIRED_SECRETS[@]}"
            echo "required_runtime_secrets_ready=true"
            echo "application_managed_channel_secret_empty=true"
            echo "runtime_nonsecret_configuration_ready=true"
            echo "secret_payloads_read=false"
          } | tee -a "$EVIDENCE"

      - name: Upload full runtime configuration metadata
        if: env.S22_PHASE == 'runtime-preflight'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-runtime-preflight-${{ env.S22_COMMIT_SHA }}
          path: infra/deploy/gcp/staging/s22-runtime-preflight-evidence.txt
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose failed API revision read-only
        if: env.S22_PHASE == 'runtime-diagnose' && env.S22_ACTION == 'plan'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: me-central1
        shell: bash
        run: |
          set -euo pipefail
          DIAGNOSTIC_DIRECTORY="$(mktemp -d)"
          trap 'rm -rf "$DIAGNOSTIC_DIRECTORY"' EXIT
          REVISION_NAME="$(
            gcloud run revisions list \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --service=lead-agent-staging-api \
              --sort-by='~metadata.creationTimestamp' \
              --limit=1 \
              --format='value(metadata.name)'
          )"
          [[ "$REVISION_NAME" =~ ^lead-agent-staging-api-[a-z0-9-]+$ ]]
          gcloud run revisions describe "$REVISION_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json > "$DIAGNOSTIC_DIRECTORY/revision.json"

          set +e
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"lead-agent-staging-api\" AND resource.labels.revision_name=\"$REVISION_NAME\" AND severity>=ERROR" \
            --project="$PROJECT_ID" \
            --freshness=6h \
            --limit=100 \
            --format=json > "$DIAGNOSTIC_DIRECTORY/logs.json" \
            2> "$DIAGNOSTIC_DIRECTORY/logging-error.txt"
          LOGGING_EXIT_CODE=$?
          set -e

          node .github/scripts/s22-runtime-diagnose.mjs \
            "$DIAGNOSTIC_DIRECTORY/revision.json" \
            "$DIAGNOSTIC_DIRECTORY/logs.json" \
            "$LOGGING_EXIT_CODE" \
            | tee s22-runtime-diagnostic-evidence.json

      - name: Upload sanitized runtime diagnostic evidence
        if: always() && env.S22_PHASE == 'runtime-diagnose' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-runtime-diagnostic-${{ env.S22_COMMIT_SHA }}-${{ github.run_id }}
          path: s22-runtime-diagnostic-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Read request-scoped sanitized auth callback failure
        if: env.S22_PHASE == 'auth-callback-diagnose' && env.S22_ACTION == 'plan'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_ID="${S22_AUTH_CALLBACK_REQUEST_ID#request:}"
          RAW_LOGS="$(mktemp)"
          RAW_TIMELINE="$(mktemp)"
          trap 'rm -f "$RAW_LOGS" "$RAW_TIMELINE"' EXIT
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"lead-agent-staging-api\" AND jsonPayload.authCallbackFailure:*" \
            --project="$PROJECT_ID" \
            --freshness=2h \
            --limit=10 \
            --format=json > "$RAW_LOGS"
          gcloud logging read \
            "resource.type=\"cloud_run_revision\" AND (resource.labels.service_name=\"lead-agent-staging-api\" OR resource.labels.service_name=\"lead-agent-staging-web\") AND (httpRequest.requestUrl:\"/v1/staff/auth/login\" OR httpRequest.requestUrl:\"/v1/staff/auth/callback\")" \
            --project="$PROJECT_ID" \
            --freshness=2h \
            --limit=50 \
            --format=json > "$RAW_TIMELINE"
          jq -e --arg request_id "$S22_AUTH_CALLBACK_REQUEST_ID" '
            def allowed:
              . == "transaction_cookie_missing"
              or . == "transaction_envelope_invalid_or_expired"
              or . == "provider_authorization_error"
              or . == "state_mismatch"
              or . == "authorization_code_missing"
              or . == "state_replay"
              or . == "token_exchange_or_oidc_response_validation"
              or . == "token_endpoint_invalid_client"
              or . == "token_endpoint_invalid_grant"
              or . == "token_endpoint_invalid_request"
              or . == "token_endpoint_invalid_scope"
              or . == "token_endpoint_rejected"
              or . == "token_endpoint_unauthorized_client"
              or . == "token_endpoint_unsupported_grant_type"
              or . == "oidc_claim_validation_failed"
              or . == "oidc_timestamp_validation_failed"
              or . == "oidc_response_invalid"
              or . == "callback_authentication_methods_invalid"
              or . == "callback_authentication_time_invalid"
              or . == "callback_id_token_invalid"
              or . == "oidc_provider_unavailable"
              or . == "mfa_required"
              or . == "id_token_validation"
              or . == "external_identity_resolution"
              or . == "external_identity_unmapped"
              or . == "external_identity_denied"
              or . == "session_issuance"
              or . == "session_issuance_rejected";
            [
              .[]
              | {
                  auth_callback_failure: .jsonPayload.authCallbackFailure,
                  request_id: ("request:" + .jsonPayload.requestId),
                  revision: .resource.labels.revision_name,
                  timestamp
                }
            ] as $entries
            | (($request_id == "request:latest" and ($entries | length) > 0)
                or any($entries[]; .request_id == $request_id))
              and all($entries[]; .auth_callback_failure | allowed)
          ' "$RAW_LOGS" > /dev/null
          jq -n \
            --slurpfile failures "$RAW_LOGS" \
            --slurpfile timeline "$RAW_TIMELINE" '
              {
                failure_entries: [
                  $failures[0][]
                  | {
                      auth_callback_failure: .jsonPayload.authCallbackFailure,
                      request_id: ("request:" + .jsonPayload.requestId),
                      revision: .resource.labels.revision_name,
                      timestamp
                    }
                ],
                request_timeline: [
                  $timeline[0][]
                  | select((.httpRequest.requestUrl // "") | test("/v1/staff/auth/(login|callback)"))
                  | {
                      method: .httpRequest.requestMethod,
                      path: ((.httpRequest.requestUrl | split("?")[0]) | sub("^https?://[^/]+"; "")),
                      revision: .resource.labels.revision_name,
                      service: .resource.labels.service_name,
                      status: .httpRequest.status,
                      timestamp
                    }
                ] | sort_by(.timestamp)
              }
            ' > s22-auth-callback-diagnostic-evidence.json

      - name: Upload sanitized auth callback diagnostic evidence
        if: always() && env.S22_PHASE == 'auth-callback-diagnose' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
