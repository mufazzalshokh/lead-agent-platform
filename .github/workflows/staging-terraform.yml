          APPROVED_PLAN_SHA256: ${{ env.S22_APPROVED_PLAN_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          PLAN=s22-bootstrap-iam.tfplan
          PLAN_JSON=s22-bootstrap-iam.tfplan.json
          RECORDED_SHA256="$(awk '{print $1}' s22-bootstrap-iam.tfplan.sha256)"
          ACTUAL_SHA256="$(sha256sum "$PLAN" | awk '{print $1}')"
          [[ "$ACTUAL_SHA256" == "$RECORDED_SHA256" ]]
          [[ "$ACTUAL_SHA256" == "$APPROVED_PLAN_SHA256" ]]

          terraform show -json "$PLAN" > "$PLAN_JSON"
          jq -e --arg project "$TF_VAR_project_id" '.variables.project_id.value == $project' "$PLAN_JSON"

          ACTUAL_ACTIONS="$(
            jq -c '
              [.resource_changes[]
               | select(.change.actions != ["no-op"])
               | ((.change.actions | join(",")) + ":" + .address)]
              | sort
            ' "$PLAN_JSON"
          )"
          EXPECTED_ACTIONS='["create:google_project_iam_member.deployer[\"roles/monitoring.alertPolicyEditor\"]","create:google_project_iam_member.deployer[\"roles/monitoring.notificationChannelViewer\"]","create:google_project_iam_member.deployer[\"roles/servicenetworking.networksAdmin\"]","create:google_project_iam_member.deployer[\"roles/serviceusage.serviceUsageConsumer\"]","delete:google_project_iam_member.deployer[\"roles/iam.serviceAccountUser\"]","delete:google_project_iam_member.deployer[\"roles/logging.configWriter\"]","delete:google_project_iam_member.deployer[\"roles/monitoring.admin\"]","delete:google_project_iam_member.deployer[\"roles/serviceusage.serviceUsageAdmin\"]"]'
          [[ "$ACTUAL_ACTIONS" == "$EXPECTED_ACTIONS" ]]
          jq -e '
            [.resource_changes[] | select(.change.actions == ["create"])] | length == 4
          ' "$PLAN_JSON"
          jq -e '
            [.resource_changes[] | select(.change.actions == ["delete"])] | length == 4
          ' "$PLAN_JSON"
          jq -e '
            [.resource_changes[]
             | select(.change.actions != ["no-op"])
             | select(.type != "google_project_iam_member")]
            | length == 0
          ' "$PLAN_JSON"
          rm -f "$PLAN_JSON"

      - name: Apply exact reviewed bootstrap IAM plan
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/bootstrap
        run: terraform apply -lock-timeout=5m -auto-approve s22-bootstrap-iam.tfplan

      - name: Verify bootstrap IAM convergence
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          STATE_ADDRESSES="$(terraform state list)"
          STATE_COUNT="$(printf '%s\n' "$STATE_ADDRESSES" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          [[ "$STATE_COUNT" == "34" ]]

          for address in \
            'google_service_account.deployer' \
            'google_iam_workload_identity_pool.github' \
            'google_iam_workload_identity_pool_provider.github' \
            'google_storage_bucket.terraform_state' \
            'google_storage_bucket_iam_member.deployer_state' \
            'google_billing_account_iam_member.deployer_budget'
          do
            grep -Fqx -- "$address" <<< "$STATE_ADDRESSES"
          done

          for address in \
            'google_project_iam_member.deployer["roles/monitoring.alertPolicyEditor"]' \
            'google_project_iam_member.deployer["roles/monitoring.notificationChannelViewer"]' \
            'google_project_iam_member.deployer["roles/servicenetworking.networksAdmin"]' \
            'google_project_iam_member.deployer["roles/serviceusage.serviceUsageConsumer"]'
          do
            grep -Fqx -- "$address" <<< "$STATE_ADDRESSES"
          done

          for address in \
            'google_project_iam_member.deployer["roles/iam.serviceAccountUser"]' \
            'google_project_iam_member.deployer["roles/logging.configWriter"]' \
            'google_project_iam_member.deployer["roles/monitoring.admin"]' \
            'google_project_iam_member.deployer["roles/serviceusage.serviceUsageAdmin"]'
          do
            if grep -Fqx -- "$address" <<< "$STATE_ADDRESSES"; then
              echo "Removed IAM role remains in authoritative state: $address" >&2
              exit 1
            fi
          done

          set +e
          terraform plan \
            -target=google_project_iam_member.deployer \
            -detailed-exitcode \
            -lock-timeout=5m
          POST_APPLY_IAM_PLAN_EXIT_CODE=$?
          set -e
          [[ "$POST_APPLY_IAM_PLAN_EXIT_CODE" == "0" ]]

          set +e
          terraform plan -refresh=false -detailed-exitcode -lock-timeout=5m
          POST_APPLY_PLAN_EXIT_CODE=$?
          set -e
          [[ "$POST_APPLY_PLAN_EXIT_CODE" == "0" ]]
          echo "Post-apply bootstrap managed resources: $STATE_COUNT"
          echo "Post-apply live IAM plan exit code: $POST_APPLY_IAM_PLAN_EXIT_CODE"
          echo "Post-apply bootstrap plan exit code: $POST_APPLY_PLAN_EXIT_CODE"

      - name: Set up Google Cloud CLI
        if: env.S22_ACTION == 'apply' && (env.S22_PHASE == 'foundation' || env.S22_PHASE == 'migration')
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify actual foundation resources
        if: env.S22_PHASE == 'foundation' && env.S22_ACTION == 'apply'
        env:
          BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          MONITORING_CHANNELS_JSON: ${{ vars.STAGING_MONITORING_NOTIFICATION_CHANNEL_IDS_JSON }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: me-central1
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT

          gcloud compute networks describe lead-agent-staging-vpc \
            --project="$PROJECT_ID" --format=json > "$VERIFY_DIR/network.json"
          jq -e '.name == "lead-agent-staging-vpc" and .autoCreateSubnetworks == false' \
            "$VERIFY_DIR/network.json"

          gcloud compute networks subnets describe lead-agent-staging-cloud-run \
            --project="$PROJECT_ID" --region="$REGION" --format=json > "$VERIFY_DIR/subnet.json"
          jq -e '
            .name == "lead-agent-staging-cloud-run"
            and (.region | endswith("/me-central1"))
          ' "$VERIFY_DIR/subnet.json"
          jq -e '.ipCidrRange == "10.22.0.0/24" and .privateIpGoogleAccess == true' \
            "$VERIFY_DIR/subnet.json"

          gcloud compute addresses describe lead-agent-staging-private-services \
            --global --project="$PROJECT_ID" --format=json > "$VERIFY_DIR/private-range.json"
          jq -e '.addressType == "INTERNAL" and .purpose == "VPC_PEERING"' \
            "$VERIFY_DIR/private-range.json"

          gcloud services vpc-peerings list \
            --project="$PROJECT_ID" \
            --network=lead-agent-staging-vpc \
            --service=servicenetworking.googleapis.com \
            --format=json > "$VERIFY_DIR/peerings.json"
          jq -e 'length >= 1' "$VERIFY_DIR/peerings.json"

          gcloud sql instances describe lead-agent-staging-postgres17 \
            --project="$PROJECT_ID" --format=json > "$VERIFY_DIR/sql.json"
          jq -e '
            .databaseVersion == "POSTGRES_17"
            and .settings.edition == "ENTERPRISE"
            and .settings.tier == "db-f1-micro"
            and .settings.availabilityType == "ZONAL"
            and .settings.dataDiskType == "PD_SSD"
            and (.settings.dataDiskSizeGb | tonumber) == 10
            and (.settings.storageAutoResizeLimit | tonumber) == 20
            and .settings.activationPolicy == "NEVER"
            and .settings.ipConfiguration.ipv4Enabled == false
            and .settings.ipConfiguration.sslMode == "ENCRYPTED_ONLY"
            and .settings.backupConfiguration.enabled == true
            and .settings.backupConfiguration.pointInTimeRecoveryEnabled == true
            and .settings.backupConfiguration.transactionLogRetentionDays == 7
            and ((.settings.deletionProtectionEnabled // .deletionProtectionEnabled) == true)
            and ([.ipAddresses[] | select(.type == "PRIVATE")] | length) >= 1
            and ([.ipAddresses[] | select(.type != "PRIVATE")] | length) == 0
          ' "$VERIFY_DIR/sql.json"

          gcloud artifacts repositories describe lead-agent \
            --project="$PROJECT_ID" --location="$REGION" --format=json > "$VERIFY_DIR/artifact.json"
          jq -e '.format == "DOCKER" and (.name | endswith("/repositories/lead-agent"))' \
            "$VERIFY_DIR/artifact.json"
          gcloud artifacts docker images list \
            "$REGION-docker.pkg.dev/$PROJECT_ID/lead-agent" \
            --format=json > "$VERIFY_DIR/images.json"
          jq -e 'length == 0' "$VERIFY_DIR/images.json"

          SECRETS=(
            lead-agent-staging-auth0-client-secret
            lead-agent-staging-auth-browser-envelope-key
            lead-agent-staging-auth-database-url
            lead-agent-staging-channel-credentials
            lead-agent-staging-customer-data-encryption-key
            lead-agent-staging-customer-data-lookup-key
            lead-agent-staging-gemini-api-key
            lead-agent-staging-ingress-database-url
            lead-agent-staging-instagram-app-secret
            lead-agent-staging-instagram-webhook-verify-token
            lead-agent-staging-invitation-target-encryption-key
            lead-agent-staging-invitation-target-lookup-key
            lead-agent-staging-migration-database-url
            lead-agent-staging-queue-database-url
            lead-agent-staging-runtime-database-url
            lead-agent-staging-telegram-bot-token
            lead-agent-staging-telegram-webhook-secret
            lead-agent-staging-widget-exchange-encryption-key
            lead-agent-staging-widget-signing-key
          )
          SECRET_VERSION_COUNT=0
          for secret in "${SECRETS[@]}"; do
            gcloud secrets describe "$secret" --project="$PROJECT_ID" --format=json > /dev/null
            VERSION_COUNT="$(
              gcloud secrets versions list "$secret" \
                --project="$PROJECT_ID" --format=json \
                | jq 'length'
            )"
            SECRET_VERSION_COUNT=$((SECRET_VERSION_COUNT + VERSION_COUNT))
          done
          [[ "${#SECRETS[@]}" == "19" ]]
          [[ "$SECRET_VERSION_COUNT" == "0" ]]

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://monitoring.googleapis.com/v3/projects/$PROJECT_ID/alertPolicies?pageSize=100" \
            > "$VERIFY_DIR/alerts.json"
          jq -e '
            [.alertPolicies[]
             | select(.displayName == "Lead Agent staging API server errors"
                      or .displayName == "Lead Agent staging Cloud SQL CPU saturation")]
            | length == 2
          ' "$VERIFY_DIR/alerts.json"
          while IFS= read -r channel; do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              "https://monitoring.googleapis.com/v3/$channel" > /dev/null
          done < <(jq -r '.[]' <<< "$MONITORING_CHANNELS_JSON")

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://billingbudgets.googleapis.com/v1/billingAccounts/$BILLING_ACCOUNT_ID/budgets?pageSize=100" \
            > "$VERIFY_DIR/budgets.json"
          jq -e '
            [.budgets[]
             | select(.displayName == "Lead Agent S22 staging USD 25 target"
                      or .displayName == "Lead Agent S22 staging USD 50 hard ceiling")]
            | length == 2
          ' "$VERIFY_DIR/budgets.json"

          PROJECT_POLICY="$VERIFY_DIR/project-policy.json"
          gcloud projects get-iam-policy "$PROJECT_ID" --format=json > "$PROJECT_POLICY"
          jq -e --arg member "serviceAccount:$DEPLOYER_SERVICE_ACCOUNT" '
            [.bindings[]
             | select(.role == "roles/iam.serviceAccountUser")
             | .members[]?
             | select(. == $member)]
            | length == 0
          ' "$PROJECT_POLICY"

          RUNTIME_IDENTITIES=(
            lead-agent-staging-api
            lead-agent-staging-web
            lead-agent-staging-worker
            lead-agent-staging-migrator
          )
          for identity in "${RUNTIME_IDENTITIES[@]}"; do
            email="$identity@$PROJECT_ID.iam.gserviceaccount.com"
            gcloud iam service-accounts describe "$email" \
              --project="$PROJECT_ID" --format=json > /dev/null
            gcloud iam service-accounts get-iam-policy "$email" \
              --project="$PROJECT_ID" --format=json > "$VERIFY_DIR/$identity-policy.json"
            jq -e --arg member "serviceAccount:$DEPLOYER_SERVICE_ACCOUNT" '
              [.bindings[]
               | select(.role == "roles/iam.serviceAccountUser")
               | .members[]?
               | select(. == $member)]
              | length == 1
            ' "$VERIFY_DIR/$identity-policy.json"
          done

          gcloud run services list --project="$PROJECT_ID" --region="$REGION" \
            --platform=managed --format=json > "$VERIFY_DIR/run-services.json"
          gcloud run jobs list --project="$PROJECT_ID" --region="$REGION" \
            --format=json > "$VERIFY_DIR/run-jobs.json"
          jq -e 'length == 0' "$VERIFY_DIR/run-services.json"
          jq -e 'length == 0' "$VERIFY_DIR/run-jobs.json"

          SQL_STATE="$(jq -r '.state' "$VERIFY_DIR/sql.json")"
          SQL_PRIVATE_IP="$(jq -r '[.ipAddresses[] | select(.type == "PRIVATE")][0].ipAddress' "$VERIFY_DIR/sql.json")"
          echo "Verified VPC: lead-agent-staging-vpc"
          echo "Verified subnet: lead-agent-staging-cloud-run"
          echo "Verified Cloud SQL state: $SQL_STATE"
          echo "Verified Cloud SQL private IP assigned: $([[ -n "$SQL_PRIVATE_IP" && "$SQL_PRIVATE_IP" != "null" ]] && echo true || echo false)"
          echo "Verified Artifact Registry repositories: 1; images: 0"
          echo "Verified Secret Manager resources: ${#SECRETS[@]}; versions: $SECRET_VERSION_COUNT"
          echo "Verified alert policies: 2; budgets: 2"
          echo "Verified runtime identities: ${#RUNTIME_IDENTITIES[@]}"
          echo "Verified Cloud Run services: 0; jobs: 0"

      - name: Read sanitized migrator application error
        if: env.S22_PHASE == 'migration-error-read' && env.S22_ACTION == 'plan'
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          EXECUTION_ID: ${{ env.S22_MIGRATOR_EXECUTION_ID }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          LOGS="$(mktemp)"
          trap 'rm -f "$LOGS"' EXIT
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"lead-agent-staging-migrator\" AND labels.\"run.googleapis.com/execution_name\"=\"$EXECUTION_ID\"" \
            --project="$PROJECT_ID" \
            --limit=200 \
            --order=asc \
            --format=json > "$LOGS"
          node - "$LOGS" "$EXECUTION_ID" <<'NODE' | tee s22-migrator-root-error.txt
          const fs = require("node:fs");
          const [logPath, executionId] = process.argv.slice(2);
          const entries = JSON.parse(fs.readFileSync(logPath, "utf8"));

          const asObject = (value) =>
            typeof value === "object" && value !== null && !Array.isArray(value) ? value : undefined;
          const parseJsonObject = (value) => {
            if (typeof value !== "string") return undefined;
            try {
              return asObject(JSON.parse(value));
            } catch {
              return undefined;
            }
          };
          const payloads = entries.flatMap((entry) => {
            const payload = asObject(entry.jsonPayload);
            return [
              payload,
              parseJsonObject(entry.textPayload),
              parseJsonObject(payload?.message),
            ].filter(Boolean);
          });
          const failure = payloads.find(
            (payload) => payload.operation === "database_migration" && payload.outcome === "failed",
          );
          if (!failure) throw new Error("No structured sanitized migrator failure record found");

          const sanitize = (value) =>
            String(value ?? "unavailable")
              .replace(/postgres(?:ql)?:\/\/[^\s\"'<>]+/giu, "postgresql://[REDACTED]")
              .replace(/Bearer\s+[^\s\"'<>]+/giu, "Bearer [REDACTED]")
              .replace(/((?:password|token|secret|authorization)\s*[:=]\s*)[^\s,;\"'<>]+/giu, "$1[REDACTED]")
              .replace(/[\u0000-\u001f\u007f]+/gu, " ")
              .replace(/\s+/gu, " ")
              .trim()
              .slice(0, 1200);
          const optional = (value, pattern) => {
            if (value === null || value === undefined) return null;
            const sanitized = sanitize(value);
            return pattern.test(sanitized) ? sanitized : "unavailable";
          };
          const evidence = {
            error_category: optional(failure.error_category, /^[a-z][a-z0-9_]{0,79}$/u),
            error_code: optional(failure.error_code, /^[0-9A-Z_]{2,32}$/u),
            error_message: sanitize(failure.error_message),
            error_type: optional(failure.error_type, /^[A-Za-z][A-Za-z0-9_.-]{0,79}$/u),
            execution_id: executionId,
            failure_stage: optional(failure.failure_stage, /^(?:load_migrator|apply_migrations)$/u),
            migration_identifier: optional(failure.migration_identifier, /^[0-9]{4}_[a-z0-9_]+$/u),
            operation: "database_migration",
            outcome: "failed",
          };
          console.log(JSON.stringify(evidence));
          NODE

      - name: Upload sanitized migrator application error
        if: always() && env.S22_PHASE == 'migration-error-read' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-migrator-root-error-${{ env.S22_MIGRATOR_EXECUTION_ID }}
          path: s22-migrator-root-error.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run bounded migration failure diagnostics
        if: env.S22_PHASE == 'migration-diagnose' && env.S22_ACTION == 'plan'
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PROBE_DIR="$RUNNER_TEMP/s22-migration-diagnostics"
          mkdir -p "$PROBE_DIR"

          gcloud run jobs describe lead-agent-staging-migrator \
            --project="$PROJECT_ID" \
            --region=me-central1 \
            --format=json > "$PROBE_DIR/migrator-job.json"
          gcloud sql instances describe lead-agent-staging-postgres17 \
            --project="$PROJECT_ID" \
            --format=json > "$PROBE_DIR/cloud-sql.json"

          if jq -e '
            [.. | .network? // empty]
            | any(. == "lead-agent-staging-vpc" or endswith("/networks/lead-agent-staging-vpc"))
          ' "$PROBE_DIR/migrator-job.json" > /dev/null; then
            echo "live_vpc_network=PASS" | tee -a s22-migration-diagnostic-evidence.txt
          else
            echo "live_vpc_network=FAIL" | tee -a s22-migration-diagnostic-evidence.txt
          fi

          if jq -e '
            [.. | .subnetwork? // empty]
            | any(. == "lead-agent-staging-cloud-run" or endswith("/subnetworks/lead-agent-staging-cloud-run"))
          ' "$PROBE_DIR/migrator-job.json" > /dev/null; then
            echo "live_vpc_subnetwork=PASS" | tee -a s22-migration-diagnostic-evidence.txt
          else
            echo "live_vpc_subnetwork=FAIL" | tee -a s22-migration-diagnostic-evidence.txt
          fi

          if jq -e '
            [.. | .egress? // empty] | any(. == "PRIVATE_RANGES_ONLY")
          ' "$PROBE_DIR/migrator-job.json" > /dev/null; then
            echo "live_vpc_egress=PASS" | tee -a s22-migration-diagnostic-evidence.txt
          else
            echo "live_vpc_egress=FAIL" | tee -a s22-migration-diagnostic-evidence.txt
          fi

          if grep -q '^live_vpc_network=PASS$' s22-migration-diagnostic-evidence.txt \
            && grep -q '^live_vpc_subnetwork=PASS$' s22-migration-diagnostic-evidence.txt \
            && grep -q '^live_vpc_egress=PASS$' s22-migration-diagnostic-evidence.txt; then
            echo "live_vpc_configuration=PASS" | tee -a s22-migration-diagnostic-evidence.txt
          else
            echo "live_vpc_configuration=FAIL" | tee -a s22-migration-diagnostic-evidence.txt
          fi

          if jq -e '
            .state == "RUNNABLE"
            and any(.ipAddresses[]?; .type == "PRIVATE" and .ipAddress == "10.125.0.3")
          ' "$PROBE_DIR/cloud-sql.json" > /dev/null; then
            echo "live_cloud_sql_endpoint=PASS" | tee -a s22-migration-diagnostic-evidence.txt
          else
            echo "live_cloud_sql_endpoint=FAIL" | tee -a s22-migration-diagnostic-evidence.txt
          fi

          run_probe() {
            local name="$1"
            local script="$2"
            local script_file="$PROBE_DIR/$name.mjs"
            printf '%s\n' "$script" > "$script_file"
            local script_b64
            script_b64="$(base64 -w0 "$script_file")"
            if gcloud run jobs execute lead-agent-staging-migrator \
              --project="$PROJECT_ID" \
              --region=me-central1 \
              --task-timeout=60s \
              --args='--input-type=module,-e,eval(atob(process.env.S22_DIAGNOSTIC_SCRIPT_B64))' \
              --update-env-vars="S22_DIAGNOSTIC_SCRIPT_B64=$script_b64" \
              --wait > /dev/null 2>&1; then
              printf '%s=PASS\n' "$name" | tee -a s22-migration-diagnostic-evidence.txt
            else
              printf '%s=FAIL\n' "$name" | tee -a s22-migration-diagnostic-evidence.txt
            fi
          }

          run_probe execution_override 'process.exitCode = 0;'

          run_probe secret_protocols '
            import process from "node:process";
            const keys = ["AUTH_DATABASE_URL", "DATABASE_URL", "INGRESS_DATABASE_URL", "MIGRATION_DATABASE_URL", "QUEUE_DATABASE_URL"];
            let valid = true;
            for (const key of keys) {
              try {
                const parsed = new URL(process.env[key]);
                valid &&= ["postgres:", "postgresql:"].includes(parsed.protocol);
              } catch {
                valid = false;
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe secret_roles '
            import process from "node:process";
            const expected = {
              AUTH_DATABASE_URL: "lead_agent_auth",
              DATABASE_URL: "lead_agent_runtime",
              INGRESS_DATABASE_URL: "lead_agent_ingress",
              MIGRATION_DATABASE_URL: "postgres",
              QUEUE_DATABASE_URL: "lead_agent_queue_runtime",
            };
            let valid = true;
            for (const [key, role] of Object.entries(expected)) {
              try {
                const parsed = new URL(process.env[key]);
                valid &&= decodeURIComponent(parsed.username) === role;
              } catch {
                valid = false;
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe secret_password_presence '
            import process from "node:process";
            const keys = ["AUTH_DATABASE_URL", "DATABASE_URL", "INGRESS_DATABASE_URL", "MIGRATION_DATABASE_URL", "QUEUE_DATABASE_URL"];
            let valid = true;
            for (const key of keys) {
              try {
                valid &&= new URL(process.env[key]).password.length > 0;
              } catch {
                valid = false;
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe secret_endpoint '
            import process from "node:process";
            const keys = ["AUTH_DATABASE_URL", "DATABASE_URL", "INGRESS_DATABASE_URL", "MIGRATION_DATABASE_URL", "QUEUE_DATABASE_URL"];
            let valid = true;
            for (const key of keys) {
              try {
                const parsed = new URL(process.env[key]);
                valid &&= parsed.hostname === "10.125.0.3";
                valid &&= parsed.port === "5432";
                valid &&= parsed.pathname === "/lead_agent_staging";
              } catch {
                valid = false;
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe secret_sslmode '
            import process from "node:process";
            const keys = ["AUTH_DATABASE_URL", "DATABASE_URL", "INGRESS_DATABASE_URL", "MIGRATION_DATABASE_URL", "QUEUE_DATABASE_URL"];
            let valid = true;
            for (const key of keys) {
              try {
                valid &&= new URL(process.env[key]).searchParams.get("sslmode") === "require";
              } catch {
                valid = false;
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe secret_shape '
            import process from "node:process";
            const expected = {
              AUTH_DATABASE_URL: "lead_agent_auth",
              DATABASE_URL: "lead_agent_runtime",
              INGRESS_DATABASE_URL: "lead_agent_ingress",
              MIGRATION_DATABASE_URL: "postgres",
              QUEUE_DATABASE_URL: "lead_agent_queue_runtime",
            };
            let valid = true;
            for (const [key, role] of Object.entries(expected)) {
              try {
                const value = process.env[key];
                if (typeof value !== "string" || value.length === 0) throw new Error();
                const parsed = new URL(value);
                valid &&= ["postgres:", "postgresql:"].includes(parsed.protocol);
                valid &&= decodeURIComponent(parsed.username) === role;
                valid &&= parsed.password.length > 0;
                valid &&= parsed.hostname === "10.125.0.3";
                valid &&= parsed.port === "5432";
                valid &&= parsed.pathname === "/lead_agent_staging";
                valid &&= parsed.searchParams.get("sslmode") === "require";
              } catch {
                valid = false;
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe private_tcp_connectivity '
            import net from "node:net";
            const connected = await new Promise((resolve) => {
              const socket = net.createConnection({ host: "10.125.0.3", port: 5432 });
              const finish = (result) => {
                socket.destroy();
                resolve(result);
              };
              socket.setTimeout(10000, () => finish(false));
              socket.once("connect", () => finish(true));
              socket.once("error", () => finish(false));
            });
            process.exitCode = connected ? 0 : 1;
          '

          run_probe migration_secret_shape '
            import process from "node:process";
            let valid = true;
            try {
              const value = process.env.MIGRATION_DATABASE_URL;
              if (typeof value !== "string" || value.length === 0) throw new Error();
              const parsed = new URL(value);
              valid &&= ["postgres:", "postgresql:"].includes(parsed.protocol);
              valid &&= decodeURIComponent(parsed.username) === "postgres";
              valid &&= parsed.password.length > 0;
              valid &&= parsed.hostname === "10.125.0.3";
              valid &&= parsed.port === "5432";
              valid &&= parsed.pathname === "/lead_agent_staging";
              valid &&= parsed.searchParams.get("sslmode") === "require";
            } catch {
              valid = false;
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe application_secret_shape '
            import process from "node:process";
            const expected = {
              AUTH_DATABASE_URL: "lead_agent_auth",
              DATABASE_URL: "lead_agent_runtime",
              INGRESS_DATABASE_URL: "lead_agent_ingress",
              QUEUE_DATABASE_URL: "lead_agent_queue_runtime",
            };
            let valid = true;
            for (const [key, role] of Object.entries(expected)) {
              try {
                const value = process.env[key];
                if (typeof value !== "string" || value.length === 0) throw new Error();
                const parsed = new URL(value);
                valid &&= ["postgres:", "postgresql:"].includes(parsed.protocol);
                valid &&= decodeURIComponent(parsed.username) === role;
                valid &&= parsed.password.length > 0;
                valid &&= parsed.hostname === "10.125.0.3";
                valid &&= parsed.port === "5432";
                valid &&= parsed.pathname === "/lead_agent_staging";
                valid &&= parsed.searchParams.get("sslmode") === "require";
              } catch {
                valid = false;
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe admin_connectivity '
            import process from "node:process";
            import { Pool } from "pg";
            const pool = new Pool({
              application_name: "lead-agent-staging-admin-diagnostic",
              connectionString: process.env.MIGRATION_DATABASE_URL,
              connectionTimeoutMillis: 15000,
              max: 1,
              query_timeout: 15000,
            });
            try {
              const result = await pool.query("select current_database() as database_name, current_setting($$server_version_num$$)::integer as server_version_num");
              process.exitCode = result.rows[0]?.database_name === "lead_agent_staging"
                && result.rows[0]?.server_version_num >= 170000
                && result.rows[0]?.server_version_num < 180000 ? 0 : 1;
            } catch {
              process.exitCode = 1;
            } finally {
              await pool.end().catch(() => {});
            }
          '

          run_probe migration_state '
            import process from "node:process";
            import { Pool } from "pg";
            const pool = new Pool({
              application_name: "lead-agent-staging-schema-diagnostic",
              connectionString: process.env.MIGRATION_DATABASE_URL,
              connectionTimeoutMillis: 15000,
              max: 1,
              query_timeout: 15000,
            });
            try {
              const migrations = await pool.query("select count(*)::integer as count from drizzle.__drizzle_migrations");
              const tables = await pool.query("select count(*)::integer as count from information_schema.tables where table_schema = $$public$$ and table_type = $$BASE TABLE$$");
              process.exitCode = migrations.rows[0]?.count === 30 && tables.rows[0]?.count === 52 ? 0 : 1;
            } catch {
              process.exitCode = 1;
            } finally {
              await pool.end().catch(() => {});
            }
          '

          run_probe application_role_connectivity '
            import process from "node:process";
            import { Pool } from "pg";
            const urls = {
              AUTH_DATABASE_URL: "lead_agent_auth",
              DATABASE_URL: "lead_agent_runtime",
              INGRESS_DATABASE_URL: "lead_agent_ingress",
              QUEUE_DATABASE_URL: "lead_agent_queue_runtime",
            };
            let valid = true;
            for (const [key, role] of Object.entries(urls)) {
              const pool = new Pool({
                application_name: `lead-agent-staging-${role}-diagnostic`,
                connectionString: process.env[key],
                connectionTimeoutMillis: 15000,
                max: 1,
                query_timeout: 15000,
              });
              try {
                const result = await pool.query("select current_user as role_name, current_database() as database_name");
                valid &&= result.rows[0]?.role_name === role;
                valid &&= result.rows[0]?.database_name === "lead_agent_staging";
              } catch {
                valid = false;
              } finally {
                await pool.end().catch(() => {});
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          rm -rf "$PROBE_DIR"

      - name: Diagnose migrator secret and VPC wiring
        if: env.S22_PHASE == 'migration-wiring-diagnose' && env.S22_ACTION == 'plan'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: me-central1
        shell: bash
        run: bash .github/scripts/s22-migration-wiring-diagnose.sh

      - name: Upload migration wiring diagnostic evidence
        if: always() && env.S22_PHASE == 'migration-wiring-diagnose' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-migration-wiring-diagnostic-evidence-${{ github.run_id }}
          path: s22-migration-wiring-diagnostic-evidence.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload migration diagnostic evidence
        if: always() && env.S22_PHASE == 'migration-diagnose' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-migration-diagnostic-evidence-${{ github.run_id }}
          path: s22-migration-diagnostic-evidence.txt
          if-no-files-found: error
          retention-days: 7

      - name: Execute one-shot migrator
        if: github.event_name == 'workflow_dispatch' && env.S22_ACTION == 'apply' && (env.S22_PHASE == 'migration' || env.S22_PHASE == 'migration-resume')
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        run: >-
          gcloud run jobs execute lead-agent-staging-migrator
          --project="${{ vars.GCP_PROJECT_ID }}"
          --region=me-central1
          --wait

      - name: Verify migrated staging database
        if: github.event_name == 'workflow_dispatch' && env.S22_ACTION == 'apply' && (env.S22_PHASE == 'migration' || env.S22_PHASE == 'migration-resume')
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          VALIDATOR="$RUNNER_TEMP/s22-verify-staging-database.mjs"
          cat > "$VALIDATOR" <<'EOF'
          (async () => {
          const process = globalThis.process;
          const { Pool } = await import("pg");
          const {
            readStagingMigrationManifest,
            stagingRolePasswordFromUrl,
          } = await import("./dist/migrate.js");

          const expectedRlsTables = [
            "ai_action_evaluations", "ai_runs", "analytics_events",
            "appointment_confirmation_evidence", "appointment_request_attendance",
            "appointment_request_preferences", "appointment_request_transitions",
            "appointment_requests", "appointment_revenue_attributions", "audit_events",
            "business_policies", "channel_connections", "consent_records",
            "contact_identities", "contacts", "conversations", "faqs",
            "handoff_transitions", "handoffs", "idempotency_keys", "inbound_routes",
            "lead_qualification_evaluations", "lead_qualification_evidence", "leads",
            "legal_holds", "location_business_hours", "location_closures",
            "location_versions", "locations", "membership_invitations",
            "membership_location_scopes", "memberships", "messages",
            "notification_attempts", "notifications", "organizations", "outbox_events",
            "privacy_requests", "retention_policies", "retention_policy_rules",
            "service_locations", "service_prices", "service_versions", "services",
            "thread_automation_controls", "webhook_receipts", "widget_allowed_origins",
            "widget_sessions",
          ].sort();
          const roleUrls = Object.freeze({
            AUTH_DATABASE_URL: "lead_agent_auth",
            DATABASE_URL: "lead_agent_runtime",
            INGRESS_DATABASE_URL: "lead_agent_ingress",
            QUEUE_DATABASE_URL: "lead_agent_queue_runtime",
          });
          const required = (key) => {
            const value = process.env[key];
            if (typeof value !== "string" || value.length === 0) throw new Error(`${key} is unavailable`);
            return value;
          };
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const pools = [];
          try {
            const manifest = await readStagingMigrationManifest();
            assert(manifest.entries.length === 30, "Unexpected migration count");
            assert(manifest.entries.at(-1)?.tag === "0029_s21_thread_automation_controls", "Unexpected migration head");

            const admin = new Pool({
              application_name: "lead-agent-staging-verifier",
              connectionString: required("MIGRATION_DATABASE_URL"),
              max: 1,
            });
            pools.push(admin);
            const database = await admin.query(
              "select current_database() as database_name, current_setting('server_version_num')::integer as server_version_num",
            );
            assert(database.rows[0]?.database_name === "lead_agent_staging", "Unexpected database name");
            assert(database.rows[0]?.server_version_num >= 170000 && database.rows[0]?.server_version_num < 180000, "Unexpected PostgreSQL major");

            const migrations = await admin.query(
              "select count(*)::integer as count from drizzle.__drizzle_migrations",
            );
            assert(migrations.rows[0]?.count === 30, "Applied migration count mismatch");
            const tables = await admin.query(
              "select count(*)::integer as count from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE'",
            );
            assert(tables.rows[0]?.count === 52, "Production table count mismatch");

            const rls = await admin.query(
              "select relname from pg_catalog.pg_class where relnamespace = 'public'::regnamespace and relkind = 'r' and relrowsecurity and relforcerowsecurity order by relname",
            );
            const actualRlsTables = rls.rows.map(({ relname }) => relname).sort();
            assert(JSON.stringify(actualRlsTables) === JSON.stringify(expectedRlsTables), "FORCE RLS manifest mismatch");

            const roleNames = Object.values(roleUrls).sort();
            const roles = await admin.query(
              "select rolname, rolcanlogin, rolsuper, rolcreatedb, rolcreaterole, rolbypassrls from pg_catalog.pg_roles where rolname = any($1::text[]) order by rolname",
              [roleNames],
            );
            assert(roles.rows.length === roleNames.length, "Application role manifest mismatch");
            for (const role of roles.rows) {
              assert(role.rolcanlogin === true, `Role ${role.rolname} cannot log in`);
              assert(role.rolsuper === false, `Role ${role.rolname} is superuser`);
              assert(role.rolcreatedb === false, `Role ${role.rolname} can create databases`);
              assert(role.rolcreaterole === false, `Role ${role.rolname} can create roles`);
              assert(role.rolbypassrls === false, `Role ${role.rolname} bypasses RLS`);
            }

            for (const [key, expectedRole] of Object.entries(roleUrls)) {
              const connectionString = required(key);
              stagingRolePasswordFromUrl(connectionString, expectedRole);
              const pool = new Pool({
                application_name: `lead-agent-staging-${expectedRole}-connectivity`,
                connectionString,
                max: 1,
              });
              pools.push(pool);
              const identity = await pool.query(
                "select current_user as role_name, current_database() as database_name",
              );
              assert(identity.rows[0]?.role_name === expectedRole, `Unexpected connected role for ${key}`);
              assert(identity.rows[0]?.database_name === "lead_agent_staging", `Unexpected connected database for ${key}`);
            }

            console.info(JSON.stringify({
              application_roles_verified: 4,
              database: "lead_agent_staging",
              force_rls_tables: actualRlsTables.length,
              migration_count: 30,
              migration_head: "0029_s21_thread_automation_controls",
              operation: "staging_database_validation",
              outcome: "succeeded",
              postgresql_major: 17,
              production_tables: 52,
            }));
          } catch (error) {
            console.error(JSON.stringify({
              error_name: error instanceof Error ? error.name : "UnknownError",
              operation: "staging_database_validation",
              outcome: "failed",
            }));
            process.exitCode = 1;
          } finally {
            await Promise.all(pools.map(async (pool) => pool.end().catch(() => {})));
          }
          })().catch((error) => {
            console.error(JSON.stringify({
              error_name: error instanceof Error ? error.name : "UnknownError",
              operation: "staging_database_validation",
              outcome: "failed",
            }));
            process.exitCode = 1;
          });
          EOF
          VALIDATOR_B64="$(base64 -w0 "$VALIDATOR")"
          gcloud run jobs execute lead-agent-staging-migrator \
            --project="$PROJECT_ID" \
            --region=me-central1 \
            --args='--input-type=module,-e,eval(atob(process.env.S22_VALIDATOR_B64))' \
            --update-env-vars="S22_VALIDATOR_B64=$VALIDATOR_B64" \
            --wait
          rm -f "$VALIDATOR"
          unset VALIDATOR_B64

      - name: Verify migration Terraform convergence
        if: github.event_name == 'workflow_dispatch' && env.S22_ACTION == 'apply' && (env.S22_PHASE == 'migration' || env.S22_PHASE == 'migration-resume')
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          STATE_COUNT="$(terraform state list | wc -l | tr -d '[:space:]')"
          [[ "$STATE_COUNT" == "88" ]]
          set +e
          terraform plan -detailed-exitcode -lock-timeout=5m
          PLAN_EXIT_CODE=$?
          set -e
          [[ "$PLAN_EXIT_CODE" == "0" ]]
          {
            echo "migration_state_count=$STATE_COUNT"
            echo "migration_convergence_exit_code=$PLAN_EXIT_CODE"
            echo "migration_head=0029_s21_thread_automation_controls"
            echo "migration_count=30"
            echo "production_table_count=52"
            echo "force_rls_table_count=48"
            echo "application_role_connectivity=PASS"
          } | tee -a s22-migration-apply-evidence.txt

      - name: Upload migration apply evidence
        if: always() && env.S22_ACTION == 'apply' && (env.S22_PHASE == 'migration' || env.S22_PHASE == 'migration-resume')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-migration-apply-evidence-${{ github.run_id }}
          path: infra/deploy/gcp/staging/s22-migration-apply-evidence.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Record deployment provenance
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_PHASE != 'bootstrap-log-viewer' && env.S22_PHASE != 'foundation' && env.S22_PHASE != 'cloud-sql-start' && env.S22_PHASE != 'cloud-sql-phase-b' && env.S22_ACTION == 'apply'
        env:
          API_IMAGE: ${{ inputs.api_image }}
          DEPLOYED_AT: ${{ inputs.deployment_timestamp }}
          MIGRATOR_IMAGE: ${{ inputs.migrator_image }}
          PHASE: ${{ env.S22_PHASE }}
          REQUESTED_SHA: ${{ env.S22_COMMIT_SHA }}
          WEB_IMAGE: ${{ inputs.web_image }}
          WORKER_IMAGE: ${{ inputs.worker_image }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## S22 staging deployment"
            echo "- Environment: staging"
            echo "- Region: me-central1"
            echo "- Phase: $PHASE"
            echo "- Commit: \`$REQUESTED_SHA\`"
            echo "- Migration head: \`0029_s21_thread_automation_controls\`"
            echo "- Timestamp: \`$DEPLOYED_AT\`"
            [[ -z "$API_IMAGE" ]] || echo "- API: \`$API_IMAGE\`"
            [[ -z "$WEB_IMAGE" ]] || echo "- Web: \`$WEB_IMAGE\`"
            [[ -z "$WORKER_IMAGE" ]] || echo "- Worker: \`$WORKER_IMAGE\`"
            [[ -z "$MIGRATOR_IMAGE" ]] || echo "- Migrator: \`$MIGRATOR_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
