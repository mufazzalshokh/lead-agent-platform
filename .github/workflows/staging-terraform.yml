name: Staging Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: Plan is always safe; apply requires the explicit owner approval token
        required: true
        type: choice
        options:
          - plan
          - apply
      phase:
        description: Reviewed lifecycle/cost profile
        required: true
        type: choice
        options:
          - bootstrap-iam
          - foundation
          - foundation-reconcile
          - bootstrap
          - migration
          - full
          - load
          - dormant
      commit_sha:
        description: Exact 40-character commit preserved on the dispatched approved branch
        required: true
        type: string
      deployment_timestamp:
        description: UTC RFC3339 deployment timestamp for runtime phases
        required: false
        type: string
      api_image:
        description: Immutable API image reference by digest
        required: false
        type: string
      web_image:
        description: Immutable Web image reference by digest
        required: false
        type: string
      worker_image:
        description: Immutable worker image reference by digest (full phase)
        required: false
        type: string
      migrator_image:
        description: Immutable migrator image reference by digest (migration and later phases)
        required: false
        type: string
      owner_approval_token:
        description: Leave empty for plan; apply requires S22-APPLY-APPROVED
        required: false
        type: string
      plan_run_id:
        description: GitHub run ID containing the exact reviewed plan; required only for apply
        required: false
        type: string
      approved_plan_sha256:
        description: Exact owner-approved saved-plan SHA256; required only for apply
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: staging-terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} / ${{ inputs.phase }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      S22_ACTION: ${{ inputs.action }}
      S22_APPROVAL_TOKEN: ${{ inputs.owner_approval_token }}
      S22_APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
      S22_COMMIT_SHA: ${{ inputs.commit_sha }}
      S22_PHASE: ${{ inputs.phase }}
      S22_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: me-central1
      TF_VAR_git_commit_sha: ${{ inputs.commit_sha }}
      TF_VAR_deployment_timestamp: ${{ inputs.deployment_timestamp }}
      TF_VAR_api_image: ${{ inputs.api_image }}
      TF_VAR_web_image: ${{ inputs.web_image }}
      TF_VAR_worker_image: ${{ inputs.worker_image }}
      TF_VAR_migrator_image: ${{ inputs.migrator_image }}
      TF_VAR_api_public_origin: ${{ vars.STAGING_API_ORIGIN }}
      TF_VAR_web_public_origin: ${{ vars.STAGING_WEB_ORIGIN }}
      TF_VAR_auth0_issuer: ${{ vars.STAGING_AUTH0_ISSUER }}
      TF_VAR_auth0_client_id: ${{ vars.STAGING_AUTH0_CLIENT_ID }}
      TF_VAR_telegram_bot_username: ${{ vars.STAGING_TELEGRAM_BOT_USERNAME }}
      TF_VAR_instagram_app_id: ${{ vars.STAGING_INSTAGRAM_APP_ID }}
      TF_VAR_instagram_graph_api_version: ${{ vars.STAGING_INSTAGRAM_GRAPH_API_VERSION }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_deployer_service_account_email: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_monitoring_notification_channel_ids: ${{ vars.STAGING_MONITORING_NOTIFICATION_CHANNEL_IDS_JSON }}
      TF_VAR_state_bucket_name: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
    steps:
      - name: Validate request boundary
        env:
          ACTION: ${{ env.S22_ACTION }}
          APPROVED_PLAN_SHA256: ${{ env.S22_APPROVED_PLAN_SHA256 }}
          APPROVAL_TOKEN: ${{ env.S22_APPROVAL_TOKEN }}
          DISPATCH_REF: ${{ github.ref }}
          PHASE: ${{ env.S22_PHASE }}
          PLAN_RUN_ID: ${{ env.S22_PLAN_RUN_ID }}
          REQUESTED_SHA: ${{ env.S22_COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DISPATCH_REF" in
            refs/heads/main|refs/heads/verify/s22-staging-recovery-capacity) ;;
            *) echo "Staging Terraform may run only from main or the S22 verification branch." >&2; exit 1 ;;
          esac
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$ACTION" == "apply" && "$APPROVAL_TOKEN" != "S22-APPLY-APPROVED" ]]; then
            echo "Apply requires the exact owner approval token." >&2
            exit 1
          fi
          if [[ "$ACTION" == "apply" && ! "$PLAN_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Apply requires the exact reviewed plan run ID." >&2
            exit 1
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" == "foundation-reconcile" ]]; then
            echo "Foundation reconciliation is plan-only until the saved plan receives separate owner approval." >&2
            exit 1
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" == "bootstrap-iam" ]]; then
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$REQUESTED_SHA" == "87216fcd8d2047e292c398a459e49e40c4ff2b9a" ]]
            [[ "$PLAN_RUN_ID" == "36179081896" ]]
            [[ "$APPROVED_PLAN_SHA256" == "1408052e615385b4a01651a8b64605d13746ddde10a6950f7ba4d380a18c60e0" ]]
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" == "foundation" ]]; then
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "c4134d2980c7c31653cc6e52dd21173a58297aab" ]]
            [[ "$PLAN_RUN_ID" == "36176635223" ]]
            [[ "$APPROVED_PLAN_SHA256" == "43ebe6df02eb4b693fdc17dfd2dbedf191668e3a1b61ccc4c97fe94d8cf5ad7c" ]]
          fi
          DEPLOY_RUNTIME=false
          BOOTSTRAP_RUNTIME=false
          PREPARE_MIGRATION=false
          SQL_POLICY=NEVER
          SQL_TIER=db-f1-micro
          API_MAX=1
          WEB_MAX=1
          WORKER_COUNT=0
          WORKER_MEMORY=512Mi

          case "$PHASE" in
            bootstrap-iam) ;;
            foundation) ;;
            foundation-reconcile)
              SQL_POLICY=ALWAYS
              ;;
            bootstrap)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              ;;
            migration)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              ;;
            full)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              WORKER_COUNT=1
              ;;
            load)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              SQL_TIER=db-custom-1-3840
              API_MAX=3
              WEB_MAX=2
              WORKER_COUNT=1
              WORKER_MEMORY=1Gi
              ;;
            dormant)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              ;;
          esac

          {
            echo "TF_VAR_deploy_runtime=$DEPLOY_RUNTIME"
            echo "TF_VAR_bootstrap_runtime=$BOOTSTRAP_RUNTIME"
            echo "TF_VAR_prepare_migration=$PREPARE_MIGRATION"
            echo "TF_VAR_cloud_sql_activation_policy=$SQL_POLICY"
            echo "TF_VAR_cloud_sql_tier=$SQL_TIER"
            echo "TF_VAR_api_max_instance_count=$API_MAX"
            echo "TF_VAR_web_max_instance_count=$WEB_MAX"
            echo "TF_VAR_worker_instance_count=$WORKER_COUNT"
            echo "TF_VAR_worker_memory=$WORKER_MEMORY"
          } >> "$GITHUB_ENV"

      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.S22_COMMIT_SHA }}

      - name: Prove commit is preserved on the dispatched branch
        env:
          DISPATCH_BRANCH: ${{ github.ref_name }}
          REQUESTED_SHA: ${{ env.S22_COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch --no-tags origin "$DISPATCH_BRANCH"
          git merge-base --is-ancestor "$REQUESTED_SHA" "origin/$DISPATCH_BRANCH"

      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.7

      - name: Initialize bootstrap Terraform
        if: env.S22_PHASE == 'bootstrap-iam'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: terraform init -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}"

      - name: Validate bootstrap Terraform
        if: env.S22_PHASE == 'bootstrap-iam'
        working-directory: infra/deploy/gcp/bootstrap
        run: terraform validate

      - name: Verify authoritative bootstrap state
        if: env.S22_PHASE == 'bootstrap-iam'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_STATE_COUNT="$(terraform state list | wc -l | tr -d '[:space:]')"
          [[ "$BOOTSTRAP_STATE_COUNT" == "34" ]]
          echo "Authoritative bootstrap state resources: $BOOTSTRAP_STATE_COUNT"

      - name: Create reviewed bootstrap IAM plan
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          terraform plan \
            -lock-timeout=5m \
            -target=google_project_iam_member.deployer \
            -out=s22-bootstrap-iam.tfplan
          sha256sum s22-bootstrap-iam.tfplan > s22-bootstrap-iam.tfplan.sha256

      - name: Upload exact reviewed bootstrap IAM plan
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-bootstrap-iam-plan-${{ env.S22_COMMIT_SHA }}
          path: |
            infra/deploy/gcp/bootstrap/s22-bootstrap-iam.tfplan
            infra/deploy/gcp/bootstrap/s22-bootstrap-iam.tfplan.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Initialize staging Terraform
        if: env.S22_PHASE != 'bootstrap-iam'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: terraform init -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}"

      - name: Validate staging Terraform
        if: env.S22_PHASE != 'bootstrap-iam'
        working-directory: infra/deploy/gcp/staging
        run: terraform validate

      - name: Set up Google Cloud CLI for reconciliation inspection
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'plan'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Inspect partial foundation state and Google Cloud resources
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: me-central1
        shell: bash
        run: |
          set -euo pipefail
          INSPECT_DIR="$(mktemp -d)"
          trap 'rm -rf "$INSPECT_DIR"' EXIT
          EVIDENCE=s22-foundation-reconciliation-evidence.txt
          SQL_INSTANCE=lead-agent-staging-postgres17

          STATE_ADDRESSES="$(terraform state list | sort)"
          STATE_COUNT="$(printf '%s\n' "$STATE_ADDRESSES" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          STATE_HAS_SQL=false
          STATE_HAS_DATABASE_ALERT=false
          grep -Fqx 'google_sql_database_instance.staging' <<< "$STATE_ADDRESSES" && STATE_HAS_SQL=true
          grep -Fqx 'google_monitoring_alert_policy.database_cpu' <<< "$STATE_ADDRESSES" && STATE_HAS_DATABASE_ALERT=true

          gcloud sql instances list --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/sql-instances.json"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://sqladmin.googleapis.com/v1/projects/$PROJECT_ID/operations?maxResults=100" \
            > "$INSPECT_DIR/sql-operations-response.json"
          jq '.items // []' "$INSPECT_DIR/sql-operations-response.json" \
            > "$INSPECT_DIR/sql-operations.json"
          gcloud sql tiers list --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/sql-tiers.json"
          gcloud sql flags list --database-version=POSTGRES_17 --format=json > "$INSPECT_DIR/postgres17-flags.json"

          SQL_INSTANCE_COUNT="$(
            jq --arg instance "$SQL_INSTANCE" '[.[] | select(.name == $instance)] | length' \
              "$INSPECT_DIR/sql-instances.json"
          )"
          SQL_PENDING_COUNT="$(
            jq --arg instance "$SQL_INSTANCE" \
              '[.[] | select(.targetId == $instance) | select(.status == "PENDING" or .status == "RUNNING")] | length' \
              "$INSPECT_DIR/sql-operations.json"
          )"
          LATEST_SQL_OPERATION="$(
            jq -c --arg instance "$SQL_INSTANCE" \
              '[.[] | select(.targetId == $instance)] | sort_by(.insertTime) | last
               | if . == null then null else {
                   name,
                   operationType,
                   status,
                   targetId,
                   insertTime,
                   startTime,
                   endTime,
                   error
                 } end' \
              "$INSPECT_DIR/sql-operations.json"
          )"

          jq -e --arg region "$REGION" '
            [.[] | select(.tier == "db-f1-micro")] as $tiers
            | ($tiers | length) > 0
              and ([$tiers[] | (.region // .regions // [])[]? | select(. == $region)] | length) > 0
          ' "$INSPECT_DIR/sql-tiers.json" > /dev/null
          jq -e 'length > 0' "$INSPECT_DIR/postgres17-flags.json" > /dev/null

          gcloud compute networks describe lead-agent-staging-vpc \
            --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/network.json"
          gcloud compute addresses describe lead-agent-staging-private-services \
            --global --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/private-range.json"
          gcloud services vpc-peerings list \
            --project="$PROJECT_ID" \
            --network=lead-agent-staging-vpc \
            --service=servicenetworking.googleapis.com \
            --format=json > "$INSPECT_DIR/peerings.json"
          jq -e '.autoCreateSubnetworks == false' "$INSPECT_DIR/network.json" > /dev/null
          jq -e '.addressType == "INTERNAL" and .purpose == "VPC_PEERING"' \
            "$INSPECT_DIR/private-range.json" > /dev/null
          jq -e 'length >= 1' "$INSPECT_DIR/peerings.json" > /dev/null

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://monitoring.googleapis.com/v3/projects/$PROJECT_ID/alertPolicies?pageSize=100" \
            > "$INSPECT_DIR/alerts.json"
          DATABASE_ALERT_COUNT="$(
            jq '[.alertPolicies[]? | select(.displayName == "Lead Agent staging Cloud SQL CPU saturation")] | length' \
              "$INSPECT_DIR/alerts.json"
          )"
          unset ACCESS_TOKEN

          {
            echo "project=$PROJECT_ID"
            echo "region=$REGION"
            echo "terraform_backend=gcs"
            echo "terraform_state_prefix=lead-agent-platform/staging"
            echo "terraform_managed_resource_count=$STATE_COUNT"
            echo "terraform_state_has_cloud_sql=$STATE_HAS_SQL"
            echo "terraform_state_has_database_cpu_alert=$STATE_HAS_DATABASE_ALERT"
            echo "gcp_cloud_sql_instance_count=$SQL_INSTANCE_COUNT"
            echo "gcp_database_cpu_alert_count=$DATABASE_ALERT_COUNT"
            echo "cloud_sql_pending_operation_count=$SQL_PENDING_COUNT"
            echo "cloud_sql_latest_operation=$LATEST_SQL_OPERATION"
            echo "cloud_sql_tier_region_supported=true"
            echo "postgresql_17_api_supported=true"
            echo "private_service_access_present=true"
            echo "terraform_state_addresses:"
            printf '%s\n' "$STATE_ADDRESSES"
          } | tee "$EVIDENCE"

          if [[ "$STATE_HAS_SQL" != "false" || "$SQL_INSTANCE_COUNT" != "0" ]]; then
            echo "Cloud SQL exists in state or GCP; automatic import/reconciliation is not authorized." >&2
            exit 1
          fi
          if [[ "$STATE_HAS_DATABASE_ALERT" != "false" || "$DATABASE_ALERT_COUNT" != "0" ]]; then
            echo "The dependent CPU alert exists outside the expected partial state; automatic import is not authorized." >&2
            exit 1
          fi
          if [[ "$SQL_PENDING_COUNT" != "0" ]]; then
            echo "A Cloud SQL operation is still pending; a reconciliation plan is unsafe." >&2
            exit 1
          fi

      - name: Verify authoritative foundation state before apply
        if: env.S22_PHASE == 'foundation' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          FOUNDATION_STATE_COUNT="$(terraform state list | wc -l | tr -d '[:space:]')"
          [[ "$FOUNDATION_STATE_COUNT" == "0" ]]
          echo "Authoritative foundation state resources before apply: $FOUNDATION_STATE_COUNT"

      - name: Create reviewed plan
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          terraform plan -lock-timeout=5m -out=s22.tfplan
          sha256sum s22.tfplan > s22.tfplan.sha256

      - name: Verify foundation reconciliation plan safety
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          PLAN_JSON="$(mktemp)"
          trap 'rm -f "$PLAN_JSON"' EXIT
          terraform show -json s22.tfplan > "$PLAN_JSON"

          jq -e --arg project "$TF_VAR_project_id" '.variables.project_id.value == $project' "$PLAN_JSON" > /dev/null
          jq -e --arg region "$TF_VAR_region" '.variables.region.value == $region' "$PLAN_JSON" > /dev/null
          jq -e '.variables.cloud_sql_activation_policy.value == "ALWAYS"' "$PLAN_JSON" > /dev/null
          jq -e '
            [.resource_changes[] | select(.change.actions != ["no-op"])] as $changes
            | ([$changes[] | select(.change.actions != ["create"])] | length) == 0
              and ([$changes[]
                    | select(.address != "google_sql_database_instance.staging"
                             and .address != "google_monitoring_alert_policy.database_cpu")]
                   | length) == 0
              and ([$changes[] | select(.address == "google_sql_database_instance.staging")]
                   | length) == 1
          ' "$PLAN_JSON" > /dev/null

          jq -e '
            [.resource_changes[]
             | select(.address == "google_sql_database_instance.staging")
             | .change.after]
            | length == 1
              and .[0].name == "lead-agent-staging-postgres17"
              and .[0].database_version == "POSTGRES_17"
              and .[0].deletion_protection == true
              and .[0].settings[0].edition == "ENTERPRISE"
              and .[0].settings[0].tier == "db-f1-micro"
              and .[0].settings[0].availability_type == "ZONAL"
              and .[0].settings[0].activation_policy == "ALWAYS"
              and .[0].settings[0].disk_type == "PD_SSD"
              and .[0].settings[0].disk_size == 10
              and .[0].settings[0].disk_autoresize == true
              and .[0].settings[0].disk_autoresize_limit == 20
              and .[0].settings[0].deletion_protection_enabled == true
              and .[0].settings[0].backup_configuration[0].enabled == true
              and .[0].settings[0].backup_configuration[0].start_time == "01:00"
              and .[0].settings[0].backup_configuration[0].point_in_time_recovery_enabled == true
              and .[0].settings[0].backup_configuration[0].transaction_log_retention_days == 7
              and .[0].settings[0].backup_configuration[0].backup_retention_settings[0].retained_backups == 7
              and .[0].settings[0].ip_configuration[0].ipv4_enabled == false
              and .[0].settings[0].ip_configuration[0].enable_private_path_for_google_cloud_services == true
              and .[0].settings[0].ip_configuration[0].ssl_mode == "ENCRYPTED_ONLY"
              and (.[0].settings[0].ip_configuration[0].private_network
                   | endswith("/global/networks/lead-agent-staging-vpc"))
          ' "$PLAN_JSON" > /dev/null

          CREATE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["create"])] | length' "$PLAN_JSON")"
          CHANGE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["update"])] | length' "$PLAN_JSON")"
          DESTROY_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["delete"])] | length' "$PLAN_JSON")"
          REPLACE_COUNT="$(
            jq '[.resource_changes[]
                 | select(.change.actions == ["delete", "create"]
                          or .change.actions == ["create", "delete"])] | length' "$PLAN_JSON"
          )"
          {
            echo "reconciliation_plan_sha256=$(awk '{print $1}' s22.tfplan.sha256)"
            echo "reconciliation_plan_creates=$CREATE_COUNT"
            echo "reconciliation_plan_changes=$CHANGE_COUNT"
            echo "reconciliation_plan_destroys=$DESTROY_COUNT"
            echo "reconciliation_plan_replacements=$REPLACE_COUNT"
            echo "reconciliation_plan_actions:"
            jq -r '.resource_changes[]
                   | select(.change.actions != ["no-op"])
                   | "\(.change.actions | join(",")):\(.address)"' "$PLAN_JSON"
          } | tee -a s22-foundation-reconciliation-evidence.txt

          [[ "$CHANGE_COUNT" == "0" ]]
          [[ "$DESTROY_COUNT" == "0" ]]
          [[ "$REPLACE_COUNT" == "0" ]]

      - name: Upload exact reviewed plan
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_PHASE != 'foundation-reconcile' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-terraform-plan-${{ env.S22_PHASE }}-${{ env.S22_COMMIT_SHA }}
          path: |
            infra/deploy/gcp/staging/s22.tfplan
            infra/deploy/gcp/staging/s22.tfplan.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload exact foundation reconciliation plan
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-terraform-plan-${{ env.S22_PHASE }}-${{ env.S22_COMMIT_SHA }}
          path: |
            infra/deploy/gcp/staging/s22.tfplan
            infra/deploy/gcp/staging/s22.tfplan.sha256
            infra/deploy/gcp/staging/s22-foundation-reconciliation-evidence.txt
          if-no-files-found: error
          retention-days: 7

      - name: Download exact owner-reviewed plan
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_ACTION == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ env.S22_PLAN_RUN_ID }}
        shell: bash
        run: >-
          gh run download "$PLAN_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "s22-terraform-plan-${{ env.S22_PHASE }}-${{ env.S22_COMMIT_SHA }}"
          --dir infra/deploy/gcp/staging

      - name: Verify reviewed plan integrity
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        run: sha256sum --check s22.tfplan.sha256

      - name: Verify exact foundation plan approval boundary
        if: env.S22_PHASE == 'foundation' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        env:
          APPROVED_PLAN_SHA256: ${{ env.S22_APPROVED_PLAN_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          PLAN=s22.tfplan
          PLAN_JSON=s22.tfplan.json
          RECORDED_SHA256="$(awk '{print $1}' s22.tfplan.sha256)"
          ACTUAL_SHA256="$(sha256sum "$PLAN" | awk '{print $1}')"
          [[ "$ACTUAL_SHA256" == "$RECORDED_SHA256" ]]
          [[ "$ACTUAL_SHA256" == "$APPROVED_PLAN_SHA256" ]]

          terraform show -json "$PLAN" > "$PLAN_JSON"
          jq -e --arg project "$TF_VAR_project_id" '.variables.project_id.value == $project' "$PLAN_JSON"
          jq -e --arg region "$TF_VAR_region" '.variables.region.value == $region' "$PLAN_JSON"
          jq -e '
            [.resource_changes[] | select(.change.actions != ["no-op"])] as $changes
            | ($changes | length) == 81
              and ([$changes[] | select(.change.actions != ["create"])] | length) == 0
          ' "$PLAN_JSON"

          ACTUAL_TYPE_COUNTS="$(
            jq -c '
              [.resource_changes[]
               | select(.change.actions != ["no-op"])
               | .type]
              | sort
              | group_by(.)
              | map({(.[0]): length})
              | add
            ' "$PLAN_JSON"
          )"
          EXPECTED_TYPE_COUNTS='{"google_artifact_registry_repository":1,"google_billing_budget":2,"google_compute_global_address":1,"google_compute_network":1,"google_compute_subnetwork":1,"google_monitoring_alert_policy":2,"google_project_iam_member":11,"google_secret_manager_secret":19,"google_secret_manager_secret_iam_member":33,"google_service_account":4,"google_service_account_iam_member":4,"google_service_networking_connection":1,"google_sql_database_instance":1}'
          [[ "$ACTUAL_TYPE_COUNTS" == "$EXPECTED_TYPE_COUNTS" ]]

          jq -e '
            [.resource_changes[]
             | select(.type == "google_sql_database_instance")
             | .change.after]
            | length == 1
              and .[0].name == "lead-agent-staging-postgres17"
              and .[0].database_version == "POSTGRES_17"
              and .[0].deletion_protection == true
              and .[0].settings[0].edition == "ENTERPRISE"
              and .[0].settings[0].tier == "db-f1-micro"
              and .[0].settings[0].availability_type == "ZONAL"
              and .[0].settings[0].disk_type == "PD_SSD"
              and .[0].settings[0].disk_size == 10
              and .[0].settings[0].disk_autoresize_limit == 20
              and .[0].settings[0].activation_policy == "NEVER"
              and .[0].settings[0].ip_configuration[0].ipv4_enabled == false
              and .[0].settings[0].ip_configuration[0].ssl_mode == "ENCRYPTED_ONLY"
              and .[0].settings[0].backup_configuration[0].enabled == true
              and .[0].settings[0].backup_configuration[0].point_in_time_recovery_enabled == true
              and .[0].settings[0].backup_configuration[0].transaction_log_retention_days == 7
          ' "$PLAN_JSON"
          jq -e '
            [.resource_changes[]
             | select(.type == "google_sql_database_instance")
             | .change.after_unknown.settings[0].ip_configuration[0].private_network]
            | length == 1 and .[0] == true
          ' "$PLAN_JSON"
          jq -e '
            [.resource_changes[]
             | select(.type == "google_project_iam_member")
             | select(.change.after.role == "roles/iam.serviceAccountUser")]
            | length == 0
          ' "$PLAN_JSON"
          jq -e '
            [.resource_changes[]
             | select(.type == "google_service_account_iam_member")
             | select(.change.after.role == "roles/iam.serviceAccountUser")]
            | length == 4
          ' "$PLAN_JSON"
          rm -f "$PLAN_JSON"

      - name: Apply exact reviewed plan
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        run: terraform apply -lock-timeout=5m -auto-approve s22.tfplan

      - name: Verify foundation Terraform convergence
        if: env.S22_PHASE == 'foundation' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          FOUNDATION_STATE_COUNT="$(terraform state list | wc -l | tr -d '[:space:]')"
          [[ "$FOUNDATION_STATE_COUNT" == "81" ]]

          set +e
          terraform plan -detailed-exitcode -lock-timeout=5m
          POST_APPLY_PLAN_EXIT_CODE=$?
          set -e
          [[ "$POST_APPLY_PLAN_EXIT_CODE" == "0" ]]
          echo "Post-apply foundation managed resources: $FOUNDATION_STATE_COUNT"
          echo "Post-apply foundation plan exit code: $POST_APPLY_PLAN_EXIT_CODE"

      - name: Download exact owner-reviewed bootstrap IAM plan
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ env.S22_PLAN_RUN_ID }}
        shell: bash
        run: >-
          gh run download "$PLAN_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "s22-bootstrap-iam-plan-${{ env.S22_COMMIT_SHA }}"
          --dir infra/deploy/gcp/bootstrap

      - name: Verify exact bootstrap IAM plan approval boundary
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/bootstrap
        env:
          APPROVED_PLAN_SHA256: ${{ env.S22_APPROVED_PLAN_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          PLAN=s22-bootstrap-iam.tfplan
          PLAN_JSON=s22-bootstrap-iam.tfplan.json
          RECORDED_SHA256="$(awk '{print $1}' s22-bootstrap-iam.tfplan.sha256)"
          ACTUAL_SHA256="$(sha256sum "$PLAN" | awk '{print $1}')"
          [[ "$ACTUAL_SHA256" == "$RECORDED_SHA256" ]]
          [[ "$ACTUAL_SHA256" == "$APPROVED_PLAN_SHA256" ]]

          terraform show -json "$PLAN" > "$PLAN_JSON"
          jq -e --arg project "$TF_VAR_project_id" '.variables.project_id.value == $project' "$PLAN_JSON"

          ACTUAL_ACTIONS="$(
            jq -c '
              [.resource_changes[]
               | select(.change.actions != ["no-op"])
               | ((.change.actions | join(",")) + ":" + .address)]
              | sort
            ' "$PLAN_JSON"
          )"
          EXPECTED_ACTIONS='["create:google_project_iam_member.deployer[\"roles/monitoring.alertPolicyEditor\"]","create:google_project_iam_member.deployer[\"roles/monitoring.notificationChannelViewer\"]","create:google_project_iam_member.deployer[\"roles/servicenetworking.networksAdmin\"]","create:google_project_iam_member.deployer[\"roles/serviceusage.serviceUsageConsumer\"]","delete:google_project_iam_member.deployer[\"roles/iam.serviceAccountUser\"]","delete:google_project_iam_member.deployer[\"roles/logging.configWriter\"]","delete:google_project_iam_member.deployer[\"roles/monitoring.admin\"]","delete:google_project_iam_member.deployer[\"roles/serviceusage.serviceUsageAdmin\"]"]'
          [[ "$ACTUAL_ACTIONS" == "$EXPECTED_ACTIONS" ]]
          jq -e '
            [.resource_changes[] | select(.change.actions == ["create"])] | length == 4
          ' "$PLAN_JSON"
          jq -e '
            [.resource_changes[] | select(.change.actions == ["delete"])] | length == 4
          ' "$PLAN_JSON"
          jq -e '
            [.resource_changes[]
             | select(.change.actions != ["no-op"])
             | select(.type != "google_project_iam_member")]
            | length == 0
          ' "$PLAN_JSON"
          rm -f "$PLAN_JSON"

      - name: Apply exact reviewed bootstrap IAM plan
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/bootstrap
        run: terraform apply -lock-timeout=5m -auto-approve s22-bootstrap-iam.tfplan

      - name: Verify bootstrap IAM convergence
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          STATE_ADDRESSES="$(terraform state list)"
          STATE_COUNT="$(printf '%s\n' "$STATE_ADDRESSES" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          [[ "$STATE_COUNT" == "34" ]]

          for address in \
            'google_service_account.deployer' \
            'google_iam_workload_identity_pool.github' \
            'google_iam_workload_identity_pool_provider.github' \
            'google_storage_bucket.terraform_state' \
            'google_storage_bucket_iam_member.deployer_state' \
            'google_billing_account_iam_member.deployer_budget'
          do
            grep -Fqx -- "$address" <<< "$STATE_ADDRESSES"
          done

          for address in \
            'google_project_iam_member.deployer["roles/monitoring.alertPolicyEditor"]' \
            'google_project_iam_member.deployer["roles/monitoring.notificationChannelViewer"]' \
            'google_project_iam_member.deployer["roles/servicenetworking.networksAdmin"]' \
            'google_project_iam_member.deployer["roles/serviceusage.serviceUsageConsumer"]'
          do
            grep -Fqx -- "$address" <<< "$STATE_ADDRESSES"
          done

          for address in \
            'google_project_iam_member.deployer["roles/iam.serviceAccountUser"]' \
            'google_project_iam_member.deployer["roles/logging.configWriter"]' \
            'google_project_iam_member.deployer["roles/monitoring.admin"]' \
            'google_project_iam_member.deployer["roles/serviceusage.serviceUsageAdmin"]'
          do
            if grep -Fqx -- "$address" <<< "$STATE_ADDRESSES"; then
              echo "Removed IAM role remains in authoritative state: $address" >&2
              exit 1
            fi
          done

          set +e
          terraform plan \
            -target=google_project_iam_member.deployer \
            -detailed-exitcode \
            -lock-timeout=5m
          POST_APPLY_IAM_PLAN_EXIT_CODE=$?
          set -e
          [[ "$POST_APPLY_IAM_PLAN_EXIT_CODE" == "0" ]]

          set +e
          terraform plan -refresh=false -detailed-exitcode -lock-timeout=5m
          POST_APPLY_PLAN_EXIT_CODE=$?
          set -e
          [[ "$POST_APPLY_PLAN_EXIT_CODE" == "0" ]]
          echo "Post-apply bootstrap managed resources: $STATE_COUNT"
          echo "Post-apply live IAM plan exit code: $POST_APPLY_IAM_PLAN_EXIT_CODE"
          echo "Post-apply bootstrap plan exit code: $POST_APPLY_PLAN_EXIT_CODE"

      - name: Set up Google Cloud CLI
        if: env.S22_ACTION == 'apply' && (env.S22_PHASE == 'foundation' || env.S22_PHASE == 'migration')
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify actual foundation resources
        if: env.S22_PHASE == 'foundation' && env.S22_ACTION == 'apply'
        env:
          BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          MONITORING_CHANNELS_JSON: ${{ vars.STAGING_MONITORING_NOTIFICATION_CHANNEL_IDS_JSON }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: me-central1
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT

          gcloud compute networks describe lead-agent-staging-vpc \
            --project="$PROJECT_ID" --format=json > "$VERIFY_DIR/network.json"
          jq -e '.name == "lead-agent-staging-vpc" and .autoCreateSubnetworks == false' \
            "$VERIFY_DIR/network.json"

          gcloud compute networks subnets describe lead-agent-staging-cloud-run \
            --project="$PROJECT_ID" --region="$REGION" --format=json > "$VERIFY_DIR/subnet.json"
          jq -e '
            .name == "lead-agent-staging-cloud-run"
            and (.region | endswith("/me-central1"))
          ' "$VERIFY_DIR/subnet.json"
          jq -e '.ipCidrRange == "10.22.0.0/24" and .privateIpGoogleAccess == true' \
            "$VERIFY_DIR/subnet.json"

          gcloud compute addresses describe lead-agent-staging-private-services \
            --global --project="$PROJECT_ID" --format=json > "$VERIFY_DIR/private-range.json"
          jq -e '.addressType == "INTERNAL" and .purpose == "VPC_PEERING"' \
            "$VERIFY_DIR/private-range.json"

          gcloud services vpc-peerings list \
            --project="$PROJECT_ID" \
            --network=lead-agent-staging-vpc \
            --service=servicenetworking.googleapis.com \
            --format=json > "$VERIFY_DIR/peerings.json"
          jq -e 'length >= 1' "$VERIFY_DIR/peerings.json"

          gcloud sql instances describe lead-agent-staging-postgres17 \
            --project="$PROJECT_ID" --format=json > "$VERIFY_DIR/sql.json"
          jq -e '
            .databaseVersion == "POSTGRES_17"
            and .settings.edition == "ENTERPRISE"
            and .settings.tier == "db-f1-micro"
            and .settings.availabilityType == "ZONAL"
            and .settings.dataDiskType == "PD_SSD"
            and (.settings.dataDiskSizeGb | tonumber) == 10
            and (.settings.storageAutoResizeLimit | tonumber) == 20
            and .settings.activationPolicy == "NEVER"
            and .settings.ipConfiguration.ipv4Enabled == false
            and .settings.ipConfiguration.sslMode == "ENCRYPTED_ONLY"
            and .settings.backupConfiguration.enabled == true
            and .settings.backupConfiguration.pointInTimeRecoveryEnabled == true
            and .settings.backupConfiguration.transactionLogRetentionDays == 7
            and ((.settings.deletionProtectionEnabled // .deletionProtectionEnabled) == true)
            and ([.ipAddresses[] | select(.type == "PRIVATE")] | length) >= 1
            and ([.ipAddresses[] | select(.type != "PRIVATE")] | length) == 0
          ' "$VERIFY_DIR/sql.json"

          gcloud artifacts repositories describe lead-agent \
            --project="$PROJECT_ID" --location="$REGION" --format=json > "$VERIFY_DIR/artifact.json"
          jq -e '.format == "DOCKER" and (.name | endswith("/repositories/lead-agent"))' \
            "$VERIFY_DIR/artifact.json"
          gcloud artifacts docker images list \
            "$REGION-docker.pkg.dev/$PROJECT_ID/lead-agent" \
            --format=json > "$VERIFY_DIR/images.json"
          jq -e 'length == 0' "$VERIFY_DIR/images.json"

          SECRETS=(
            lead-agent-staging-auth0-client-secret
            lead-agent-staging-auth-browser-envelope-key
            lead-agent-staging-auth-database-url
            lead-agent-staging-channel-credentials
            lead-agent-staging-customer-data-encryption-key
            lead-agent-staging-customer-data-lookup-key
            lead-agent-staging-gemini-api-key
            lead-agent-staging-ingress-database-url
            lead-agent-staging-instagram-app-secret
            lead-agent-staging-instagram-webhook-verify-token
            lead-agent-staging-invitation-target-encryption-key
            lead-agent-staging-invitation-target-lookup-key
            lead-agent-staging-migration-database-url
            lead-agent-staging-queue-database-url
            lead-agent-staging-runtime-database-url
            lead-agent-staging-telegram-bot-token
            lead-agent-staging-telegram-webhook-secret
            lead-agent-staging-widget-exchange-encryption-key
            lead-agent-staging-widget-signing-key
          )
          SECRET_VERSION_COUNT=0
          for secret in "${SECRETS[@]}"; do
            gcloud secrets describe "$secret" --project="$PROJECT_ID" --format=json > /dev/null
            VERSION_COUNT="$(
              gcloud secrets versions list "$secret" \
                --project="$PROJECT_ID" --format=json \
                | jq 'length'
            )"
            SECRET_VERSION_COUNT=$((SECRET_VERSION_COUNT + VERSION_COUNT))
          done
          [[ "${#SECRETS[@]}" == "19" ]]
          [[ "$SECRET_VERSION_COUNT" == "0" ]]

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://monitoring.googleapis.com/v3/projects/$PROJECT_ID/alertPolicies?pageSize=100" \
            > "$VERIFY_DIR/alerts.json"
          jq -e '
            [.alertPolicies[]
             | select(.displayName == "Lead Agent staging API server errors"
                      or .displayName == "Lead Agent staging Cloud SQL CPU saturation")]
            | length == 2
          ' "$VERIFY_DIR/alerts.json"
          while IFS= read -r channel; do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              "https://monitoring.googleapis.com/v3/$channel" > /dev/null
          done < <(jq -r '.[]' <<< "$MONITORING_CHANNELS_JSON")

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://billingbudgets.googleapis.com/v1/billingAccounts/$BILLING_ACCOUNT_ID/budgets?pageSize=100" \
            > "$VERIFY_DIR/budgets.json"
          jq -e '
            [.budgets[]
             | select(.displayName == "Lead Agent S22 staging USD 25 target"
                      or .displayName == "Lead Agent S22 staging USD 50 hard ceiling")]
            | length == 2
          ' "$VERIFY_DIR/budgets.json"

          PROJECT_POLICY="$VERIFY_DIR/project-policy.json"
          gcloud projects get-iam-policy "$PROJECT_ID" --format=json > "$PROJECT_POLICY"
          jq -e --arg member "serviceAccount:$DEPLOYER_SERVICE_ACCOUNT" '
            [.bindings[]
             | select(.role == "roles/iam.serviceAccountUser")
             | .members[]?
             | select(. == $member)]
            | length == 0
          ' "$PROJECT_POLICY"

          RUNTIME_IDENTITIES=(
            lead-agent-staging-api
            lead-agent-staging-web
            lead-agent-staging-worker
            lead-agent-staging-migrator
          )
          for identity in "${RUNTIME_IDENTITIES[@]}"; do
            email="$identity@$PROJECT_ID.iam.gserviceaccount.com"
            gcloud iam service-accounts describe "$email" \
              --project="$PROJECT_ID" --format=json > /dev/null
            gcloud iam service-accounts get-iam-policy "$email" \
              --project="$PROJECT_ID" --format=json > "$VERIFY_DIR/$identity-policy.json"
            jq -e --arg member "serviceAccount:$DEPLOYER_SERVICE_ACCOUNT" '
              [.bindings[]
               | select(.role == "roles/iam.serviceAccountUser")
               | .members[]?
               | select(. == $member)]
              | length == 1
            ' "$VERIFY_DIR/$identity-policy.json"
          done

          gcloud run services list --project="$PROJECT_ID" --region="$REGION" \
            --platform=managed --format=json > "$VERIFY_DIR/run-services.json"
          gcloud run jobs list --project="$PROJECT_ID" --region="$REGION" \
            --format=json > "$VERIFY_DIR/run-jobs.json"
          jq -e 'length == 0' "$VERIFY_DIR/run-services.json"
          jq -e 'length == 0' "$VERIFY_DIR/run-jobs.json"

          SQL_STATE="$(jq -r '.state' "$VERIFY_DIR/sql.json")"
          SQL_PRIVATE_IP="$(jq -r '[.ipAddresses[] | select(.type == "PRIVATE")][0].ipAddress' "$VERIFY_DIR/sql.json")"
          echo "Verified VPC: lead-agent-staging-vpc"
          echo "Verified subnet: lead-agent-staging-cloud-run"
          echo "Verified Cloud SQL state: $SQL_STATE"
          echo "Verified Cloud SQL private IP assigned: $([[ -n "$SQL_PRIVATE_IP" && "$SQL_PRIVATE_IP" != "null" ]] && echo true || echo false)"
          echo "Verified Artifact Registry repositories: 1; images: 0"
          echo "Verified Secret Manager resources: ${#SECRETS[@]}; versions: $SECRET_VERSION_COUNT"
          echo "Verified alert policies: 2; budgets: 2"
          echo "Verified runtime identities: ${#RUNTIME_IDENTITIES[@]}"
          echo "Verified Cloud Run services: 0; jobs: 0"

      - name: Execute one-shot migrator
        if: github.event_name == 'workflow_dispatch' && env.S22_ACTION == 'apply' && env.S22_PHASE == 'migration'
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        run: >-
          gcloud run jobs execute lead-agent-staging-migrator
          --project="${{ vars.GCP_PROJECT_ID }}"
          --region=me-central1
          --wait

      - name: Record deployment provenance
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_PHASE != 'foundation' && env.S22_ACTION == 'apply'
        env:
          API_IMAGE: ${{ inputs.api_image }}
          DEPLOYED_AT: ${{ inputs.deployment_timestamp }}
          MIGRATOR_IMAGE: ${{ inputs.migrator_image }}
          PHASE: ${{ env.S22_PHASE }}
          REQUESTED_SHA: ${{ env.S22_COMMIT_SHA }}
          WEB_IMAGE: ${{ inputs.web_image }}
          WORKER_IMAGE: ${{ inputs.worker_image }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## S22 staging deployment"
            echo "- Environment: staging"
            echo "- Region: me-central1"
            echo "- Phase: $PHASE"
            echo "- Commit: \`$REQUESTED_SHA\`"
            echo "- Migration head: \`0029_s21_thread_automation_controls\`"
            echo "- Timestamp: \`$DEPLOYED_AT\`"
            [[ -z "$API_IMAGE" ]] || echo "- API: \`$API_IMAGE\`"
            [[ -z "$WEB_IMAGE" ]] || echo "- Web: \`$WEB_IMAGE\`"
            [[ -z "$WORKER_IMAGE" ]] || echo "- Worker: \`$WORKER_IMAGE\`"
            [[ -z "$MIGRATOR_IMAGE" ]] || echo "- Migrator: \`$MIGRATOR_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
