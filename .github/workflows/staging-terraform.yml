                and (.change.before.secret_id == "projects/lead-agent-stg-739284/secrets/lead-agent-staging-telegram-bot-token"
                  or .change.before.secret_id == "projects/lead-agent-stg-739284/secrets/lead-agent-staging-telegram-webhook-secret")
                and .change.before.role == "roles/secretmanager.secretAccessor"
                and .change.before.member == $member)
          ' s22-telegram-verify-access-remove.tfplan.json > /dev/null
          {
            echo "telegram_verify_access_removal_plan_sha256=$(awk '{print $1}' s22-telegram-verify-access-remove.tfplan.sha256)"
            echo "telegram_verify_access_removal_plan_creates=0"
            echo "telegram_verify_access_removal_plan_changes=0"
            echo "telegram_verify_access_removal_plan_destroys=2"
            echo "telegram_verify_access_removal_plan_replacements=0"
            echo "telegram_verify_access_removal_scope=two_telegram_secrets_only"
          } | tee s22-telegram-verify-access-remove-plan-evidence.txt
          rm -f s22-telegram-verify-access-remove.tfplan.json

      - name: Upload exact Telegram verifier access removal plan
        if: env.S22_PHASE == 'telegram-verify-access-remove' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-telegram-verify-access-remove-plan-${{ env.S22_COMMIT_SHA }}
          path: |
            infra/deploy/gcp/staging/s22-telegram-verify-access-remove.tfplan
            infra/deploy/gcp/staging/s22-telegram-verify-access-remove.tfplan.sha256
            infra/deploy/gcp/staging/s22-telegram-verify-access-remove-plan-evidence.txt
          if-no-files-found: error
          retention-days: 1

      - name: Verify Telegram webhook without exposing credentials
        if: env.S22_PHASE == 'telegram-verify' && env.S22_ACTION == 'plan'
        env:
          API_IMAGE: ${{ inputs.api_image }}
          API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}
          BOT_USERNAME: ${{ vars.STAGING_TELEGRAM_BOT_USERNAME }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          API_REVISION="$(
            gcloud run services describe lead-agent-staging-api \
              --project="$PROJECT_ID" \
              --region=me-central1 \
              --format='value(status.latestReadyRevisionName)'
          )"
          [[ "$API_REVISION" =~ ^lead-agent-staging-api-[a-z0-9-]+$ ]]
          LIVE_IMAGE="$(
            gcloud run revisions describe "$API_REVISION" \
              --project="$PROJECT_ID" \
              --region=me-central1 \
              --format='value(spec.containers[0].image)'
          )"
          if [[ "$LIVE_IMAGE" != "$API_IMAGE" ]]; then
            echo "::error title=Telegram verifier preflight::S22T102_API_IMAGE_MISMATCH live=$LIVE_IMAGE expected=$API_IMAGE" >&2
            exit 1
          fi
          BOT_TOKEN="$(gcloud secrets versions access latest --secret=lead-agent-staging-telegram-bot-token --project="$PROJECT_ID" 2>/dev/null)" || {
            echo "::error title=Telegram verifier preflight::S22T103_BOT_TOKEN_ACCESS_FAILED" >&2
            exit 1
          }
          WEBHOOK_SECRET="$(gcloud secrets versions access latest --secret=lead-agent-staging-telegram-webhook-secret --project="$PROJECT_ID" 2>/dev/null)" || {
            echo "::error title=Telegram verifier preflight::S22T104_WEBHOOK_SECRET_ACCESS_FAILED" >&2
            exit 1
          }
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$WEBHOOK_SECRET"
          trap 'unset BOT_TOKEN WEBHOOK_SECRET' EXIT
          S22_API_ORIGIN="$API_ORIGIN" \
          S22_API_REVISION="$API_REVISION" \
          S22_API_IMAGE="$LIVE_IMAGE" \
          TELEGRAM_BOT_TOKEN="$BOT_TOKEN" \
          TELEGRAM_BOT_USERNAME="$BOT_USERNAME" \
          TELEGRAM_WEBHOOK_SECRET="$WEBHOOK_SECRET" \
          TELEGRAM_WEBHOOK_URL="$API_ORIGIN/v1/webhooks/telegram" \
            node .github/scripts/s22-telegram-webhook-verify.mjs \
            | tee s22-telegram-webhook-verification-evidence.json

      - name: Upload sanitized Telegram webhook verification evidence
        if: env.S22_PHASE == 'telegram-verify' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-telegram-webhook-verification-${{ env.S22_COMMIT_SHA }}-${{ github.run_id }}
          path: s22-telegram-webhook-verification-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Inspect partial foundation state and Google Cloud resources
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: me-central1
        shell: bash
        run: |
          set -euo pipefail
          INSPECT_DIR="$(mktemp -d)"
          trap 'rm -rf "$INSPECT_DIR"' EXIT
          EVIDENCE=s22-foundation-reconciliation-evidence.txt
          SQL_INSTANCE=lead-agent-staging-postgres17

          STATE_ADDRESSES="$(terraform state list | sort)"
          STATE_COUNT="$(printf '%s\n' "$STATE_ADDRESSES" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          STATE_HAS_SQL=false
          STATE_HAS_DATABASE_ALERT=false
          grep -Fqx 'google_sql_database_instance.staging' <<< "$STATE_ADDRESSES" && STATE_HAS_SQL=true
          grep -Fqx 'google_monitoring_alert_policy.database_cpu' <<< "$STATE_ADDRESSES" && STATE_HAS_DATABASE_ALERT=true

          gcloud sql instances list --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/sql-instances.json"
          gh run view 36224692606 --repo "$GITHUB_REPOSITORY" --log > "$INSPECT_DIR/failed-apply.log"
          grep -Fq 'This operation is not valid for this instance.' "$INSPECT_DIR/failed-apply.log"
          grep -Fq 'invalidOperation' "$INSPECT_DIR/failed-apply.log"
          gcloud sql tiers list --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/sql-tiers.json"
          gcloud sql flags list --database-version=POSTGRES_17 --format=json > "$INSPECT_DIR/postgres17-flags.json"

          SQL_INSTANCE_COUNT="$(
            jq --arg instance "$SQL_INSTANCE" '[.[] | select(.name == $instance)] | length' \
              "$INSPECT_DIR/sql-instances.json"
          )"
          jq -e --arg region "$REGION" '
            [.[] | select(.tier == "db-f1-micro")] as $tiers
            | ($tiers | length) > 0
              and ([$tiers[] | (.region // .regions // [])[]? | select(. == $region)] | length) > 0
          ' "$INSPECT_DIR/sql-tiers.json" > /dev/null
          jq -e 'length > 0' "$INSPECT_DIR/postgres17-flags.json" > /dev/null

          gcloud compute networks describe lead-agent-staging-vpc \
            --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/network.json"
          gcloud compute addresses describe lead-agent-staging-private-services \
            --global --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/private-range.json"
          gcloud services vpc-peerings list \
            --project="$PROJECT_ID" \
            --network=lead-agent-staging-vpc \
            --service=servicenetworking.googleapis.com \
            --format=json > "$INSPECT_DIR/peerings.json"
          jq -e '.autoCreateSubnetworks == false' "$INSPECT_DIR/network.json" > /dev/null
          jq -e '.addressType == "INTERNAL" and .purpose == "VPC_PEERING"' \
            "$INSPECT_DIR/private-range.json" > /dev/null
          jq -e 'length >= 1' "$INSPECT_DIR/peerings.json" > /dev/null

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://monitoring.googleapis.com/v3/projects/$PROJECT_ID/alertPolicies?pageSize=100" \
            > "$INSPECT_DIR/alerts.json"
          DATABASE_ALERT_COUNT="$(
            jq '[.alertPolicies[]? | select(.displayName == "Lead Agent staging Cloud SQL CPU saturation")] | length' \
              "$INSPECT_DIR/alerts.json"
          )"
          unset ACCESS_TOKEN

          {
            echo "project=$PROJECT_ID"
            echo "region=$REGION"
            echo "terraform_backend=gcs"
            echo "terraform_state_prefix=lead-agent-platform/staging"
            echo "terraform_managed_resource_count=$STATE_COUNT"
            echo "terraform_state_has_cloud_sql=$STATE_HAS_SQL"
            echo "terraform_state_has_database_cpu_alert=$STATE_HAS_DATABASE_ALERT"
            echo "gcp_cloud_sql_instance_count=$SQL_INSTANCE_COUNT"
            echo "gcp_database_cpu_alert_count=$DATABASE_ALERT_COUNT"
            echo "cloud_sql_failed_operation_source=github_run_36224692606"
            echo "cloud_sql_failed_operation_status=terminal_error"
            echo "cloud_sql_failed_operation_code=invalidOperation"
            echo "cloud_sql_pending_operation_observation=none; terminal failure recorded and no instance exists"
            echo "cloud_sql_tier_region_supported=true"
            echo "postgresql_17_api_supported=true"
            echo "private_service_access_present=true"
            echo "terraform_state_addresses:"
            printf '%s\n' "$STATE_ADDRESSES"
          } | tee "$EVIDENCE"

          if [[ "$STATE_HAS_SQL" != "false" || "$SQL_INSTANCE_COUNT" != "0" ]]; then
            echo "Cloud SQL exists in state or GCP; automatic import/reconciliation is not authorized." >&2
            exit 1
          fi
          if [[ "$STATE_HAS_DATABASE_ALERT" != "false" || "$DATABASE_ALERT_COUNT" != "0" ]]; then
            echo "The dependent CPU alert exists outside the expected partial state; automatic import is not authorized." >&2
            exit 1
          fi

      - name: Verify authoritative foundation state before apply
        if: env.S22_PHASE == 'foundation' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          FOUNDATION_STATE_COUNT="$(terraform state list | wc -l | tr -d '[:space:]')"
          [[ "$FOUNDATION_STATE_COUNT" == "0" ]]
          echo "Authoritative foundation state resources before apply: $FOUNDATION_STATE_COUNT"

      - name: Create reviewed plan
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_PHASE != 'bootstrap-log-viewer' && env.S22_PHASE != 'bootstrap-log-viewer-remove' && env.S22_PHASE != 'foundation-reconcile-verify' && env.S22_PHASE != 'migration-diagnose' && env.S22_PHASE != 'migration-wiring-diagnose' && env.S22_PHASE != 'migration-error-read' && env.S22_PHASE != 'migration-validate' && env.S22_PHASE != 'api-image-verify' && env.S22_PHASE != 'migrator-image-verify' && env.S22_PHASE != 'runtime-preflight' && env.S22_PHASE != 'runtime-diagnose' && env.S22_PHASE != 'auth-callback-diagnose' && env.S22_PHASE != 'instagram-verify-access' && env.S22_PHASE != 'instagram-verify' && env.S22_PHASE != 'instagram-verify-access-remove' && env.S22_PHASE != 'telegram-verify-access' && env.S22_PHASE != 'telegram-verify' && env.S22_PHASE != 'telegram-verify-access-remove' && env.S22_PHASE != 'owner-workspace-verify' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          terraform plan -lock-timeout=5m -out=s22.tfplan
          sha256sum s22.tfplan > s22.tfplan.sha256

      - name: Verify migration plan safety
        if: env.S22_PHASE == 'migration' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          PLAN_JSON="$(mktemp)"
          trap 'rm -f "$PLAN_JSON"' EXIT
          terraform show -json s22.tfplan > "$PLAN_JSON"

          jq -e --arg project "$TF_VAR_project_id" '.variables.project_id.value == $project' "$PLAN_JSON" > /dev/null
          jq -e --arg region "$TF_VAR_region" '.variables.region.value == $region' "$PLAN_JSON" > /dev/null
          jq -e '
            .variables.git_commit_sha.value == "2396fdf797eb4b19252a34c8b45e93945a8f53a3"
              and .variables.deploy_runtime.value == "true"
              and .variables.bootstrap_runtime.value == "true"
              and .variables.prepare_migration.value == "true"
              and .variables.cloud_sql_activation_policy.value == "ALWAYS"
              and .variables.cloud_sql_tier.value == "db-f1-micro"
              and .variables.api_max_instance_count.value == "1"
              and .variables.web_max_instance_count.value == "1"
              and .variables.worker_instance_count.value == "0"
          ' "$PLAN_JSON" > /dev/null

          EXPECTED_ACTIONS='["create:google_cloud_run_v2_job.migrator[0]","create:google_sql_database.application[0]"]'
          ACTUAL_ACTIONS="$(
            jq -c '
              [.resource_changes[]
               | select(.mode == "managed" and .change.actions != ["no-op"])
               | ((.change.actions | join(",")) + ":" + .address)]
              | sort
            ' "$PLAN_JSON"
          )"
          [[ "$ACTUAL_ACTIONS" == "$EXPECTED_ACTIONS" ]]
          jq -e '
            [.resource_changes[]
             | select(.mode == "data" and .change.actions != ["no-op"])]
            | all(.[];
                .address == "data.google_project.staging"
                  and .change.actions == ["read"])
          ' "$PLAN_JSON" > /dev/null

          jq -e '
            [.resource_changes[]
             | select(.address == "google_sql_database.application[0]")
             | .change.after] as $database
            | ($database | length) == 1
              and $database[0].name == "lead_agent_staging"
              and $database[0].charset == "UTF8"
              and $database[0].collation == "en_US.UTF8"
          ' "$PLAN_JSON" > /dev/null
          jq -e --arg image "$TF_VAR_migrator_image" '
            [.resource_changes[]
             | select(.address == "google_cloud_run_v2_job.migrator[0]")
             | .change.after] as $job
            | ($job | length) == 1
              and $job[0].name == "lead-agent-staging-migrator"
              and $job[0].location == "me-central1"
              and $job[0].deletion_protection == true
              and $job[0].template[0].task_count == 1
              and $job[0].template[0].parallelism == 1
              and $job[0].template[0].template[0].service_account == "lead-agent-staging-migrator@lead-agent-stg-739284.iam.gserviceaccount.com"
              and $job[0].template[0].template[0].max_retries == 0
              and $job[0].template[0].template[0].timeout == "900s"
              and $job[0].template[0].template[0].containers[0].image == $image
              and $job[0].template[0].template[0].containers[0].command == ["node"]
              and $job[0].template[0].template[0].containers[0].args == ["dist/index.js"]
              and $job[0].template[0].template[0].vpc_access[0].egress == "PRIVATE_RANGES_ONLY"
          ' "$PLAN_JSON" > /dev/null

          CREATE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["create"])] | length' "$PLAN_JSON")"
          CHANGE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["update"])] | length' "$PLAN_JSON")"
          DESTROY_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["delete"])] | length' "$PLAN_JSON")"
          REPLACE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["delete", "create"] or .change.actions == ["create", "delete"])] | length' "$PLAN_JSON")"
          [[ "$CREATE_COUNT" == "2" ]]
          [[ "$CHANGE_COUNT" == "0" ]]
          [[ "$DESTROY_COUNT" == "0" ]]
          [[ "$REPLACE_COUNT" == "0" ]]

          {
            echo "migration_plan_sha256=$(awk '{print $1}' s22.tfplan.sha256)"
            echo "migration_plan_creates=$CREATE_COUNT"
            echo "migration_plan_changes=$CHANGE_COUNT"
            echo "migration_plan_destroys=$DESTROY_COUNT"
            echo "migration_plan_replacements=$REPLACE_COUNT"
            echo "migration_plan_actions=$ACTUAL_ACTIONS"
            echo "migration_plan_unexpected_actions=NONE"
          } | tee s22-migration-plan-evidence.txt

      - name: Verify full runtime plan safety
        if: env.S22_PHASE == 'full' && env.S22_ACTION == 'plan'
        shell: bash
        run: >-
          bash .github/scripts/s22-full-runtime-plan-check.sh
