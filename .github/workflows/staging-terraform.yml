              and $changes[0].change.before.project == "lead-agent-stg-739284"
              and $changes[0].change.before.secret_id == "projects/lead-agent-stg-739284/secrets/lead-agent-staging-instagram-webhook-verify-token"
              and $changes[0].change.before.role == "roles/secretmanager.secretAccessor"
