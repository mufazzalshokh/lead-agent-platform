          RESOURCE='google_secret_manager_secret_iam_member.deployer_temporary_instagram_verify_access[0]'
          ! terraform state list | grep -Fqx "$RESOURCE"
          terraform plan -lock-timeout=5m -target="$RESOURCE" -out=s22-instagram-verify-access.tfplan
          sha256sum s22-instagram-verify-access.tfplan > s22-instagram-verify-access.tfplan.sha256
          terraform show -json s22-instagram-verify-access.tfplan > s22-instagram-verify-access.tfplan.json
          jq -e --arg resource "$RESOURCE" --arg member "serviceAccount:$TF_VAR_deployer_service_account_email" '
            [.resource_changes[] | select(.change.actions != ["no-op"])] as $changes
            | ($changes | length) == 1
