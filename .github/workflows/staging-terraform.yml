            | tee infra/deploy/gcp/staging/s22-migrator-image-plan-evidence.txt
          echo "migrator_image_plan_sha256=$(awk '{print $1}' infra/deploy/gcp/staging/s22.tfplan.sha256)" \
            | tee -a infra/deploy/gcp/staging/s22-migrator-image-plan-evidence.txt

      - name: Verify API image-only plan safety
        if: env.S22_PHASE == 'api-image-update' && env.S22_ACTION == 'plan'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/s22-api-image-plan-check.sh \
