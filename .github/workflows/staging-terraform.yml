      - name: Set up Google Cloud CLI
        if: env.S22_ACTION == 'apply' && (env.S22_PHASE == 'foundation' || env.S22_PHASE == 'migration')
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify actual foundation resources
        if: env.S22_PHASE == 'foundation' && env.S22_ACTION == 'apply'
        env:
