name: Staging Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: Plan is always safe; apply requires the explicit owner approval token
        required: true
        type: choice
        options:
          - plan
          - apply
      phase:
        description: Reviewed lifecycle/cost profile
        required: true
        type: choice
        options:
          - bootstrap-iam
          - bootstrap-log-viewer
          - foundation
          - foundation-reconcile
          - foundation-reconcile-verify
          - cloud-sql-start
          - cloud-sql-phase-b
          - bootstrap
          - migration
          - migration-resume
          - migrator-image-update
          - migration-diagnose
          - migration-wiring-diagnose
          - migration-error-read
          - full
          - load
          - dormant
      commit_sha:
        description: Exact 40-character commit preserved on the dispatched approved branch
        required: true
        type: string
      deployment_timestamp:
        description: UTC RFC3339 deployment timestamp for runtime phases
        required: false
        type: string
      api_image:
        description: Immutable API image reference by digest
        required: false
        type: string
      web_image:
        description: Immutable Web image reference by digest
        required: false
        type: string
      worker_image:
        description: Immutable worker image reference by digest (full phase)
        required: false
        type: string
      migrator_image:
        description: Immutable migrator image reference by digest (migration and later phases)
        required: false
        type: string
      owner_approval_token:
        description: Leave empty for plan; apply requires S22-APPLY-APPROVED
        required: false
        type: string
      plan_run_id:
        description: GitHub run ID containing the exact reviewed plan; required only for apply
        required: false
        type: string
      approved_plan_sha256:
        description: Exact owner-approved saved-plan SHA256; required only for apply
        required: false
        type: string
      migrator_execution_id:
        description: Exact failed Cloud Run migrator execution for sanitized diagnostic reads
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: staging-terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} / ${{ inputs.phase }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      S22_ACTION: ${{ inputs.action }}
      S22_APPROVAL_TOKEN: ${{ inputs.owner_approval_token }}
      S22_APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
      S22_COMMIT_SHA: ${{ inputs.commit_sha }}
      S22_MIGRATOR_EXECUTION_ID: ${{ inputs.migrator_execution_id }}
      S22_PHASE: ${{ inputs.phase }}
      S22_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: me-central1
      TF_VAR_git_commit_sha: ${{ inputs.commit_sha }}
      TF_VAR_deployment_timestamp: ${{ inputs.deployment_timestamp }}
      TF_VAR_api_image: ${{ inputs.api_image }}
      TF_VAR_web_image: ${{ inputs.web_image }}
      TF_VAR_worker_image: ${{ inputs.worker_image }}
      TF_VAR_migrator_image: ${{ inputs.migrator_image }}
      TF_VAR_api_public_origin: ${{ vars.STAGING_API_ORIGIN }}
      TF_VAR_web_public_origin: ${{ vars.STAGING_WEB_ORIGIN }}
      TF_VAR_auth0_issuer: ${{ vars.STAGING_AUTH0_ISSUER }}
      TF_VAR_auth0_client_id: ${{ vars.STAGING_AUTH0_CLIENT_ID }}
      TF_VAR_telegram_bot_username: ${{ vars.STAGING_TELEGRAM_BOT_USERNAME }}
      TF_VAR_instagram_app_id: ${{ vars.STAGING_INSTAGRAM_APP_ID }}
      TF_VAR_instagram_graph_api_version: ${{ vars.STAGING_INSTAGRAM_GRAPH_API_VERSION }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_deployer_service_account_email: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_monitoring_notification_channel_ids: ${{ vars.STAGING_MONITORING_NOTIFICATION_CHANNEL_IDS_JSON }}
      TF_VAR_state_bucket_name: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
      TF_VAR_temporary_logging_viewer_enabled: ${{ inputs.phase == 'bootstrap-log-viewer' }}
    steps:
      - name: Validate request boundary
        env:
          ACTION: ${{ env.S22_ACTION }}
          APPROVED_PLAN_SHA256: ${{ env.S22_APPROVED_PLAN_SHA256 }}
          APPROVAL_TOKEN: ${{ env.S22_APPROVAL_TOKEN }}
          DISPATCH_REF: ${{ github.ref }}
          PHASE: ${{ env.S22_PHASE }}
          PLAN_RUN_ID: ${{ env.S22_PLAN_RUN_ID }}
          REQUESTED_SHA: ${{ env.S22_COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DISPATCH_REF" in
            refs/heads/main|refs/heads/verify/s22-staging-recovery-capacity) ;;
            *) echo "Staging Terraform may run only from main or the S22 verification branch." >&2; exit 1 ;;
          esac
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$PHASE" == "migration-error-read" ]]; then
            [[ "$ACTION" == "plan" ]]
            [[ "$S22_MIGRATOR_EXECUTION_ID" =~ ^lead-agent-staging-migrator-[a-z0-9]+$ ]]
          fi
          if [[ "$ACTION" == "apply" && "$APPROVAL_TOKEN" != "S22-APPLY-APPROVED" ]]; then
            echo "Apply requires the exact owner approval token." >&2
            exit 1
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" != "migration-resume" && ! "$PLAN_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Apply requires the exact reviewed plan run ID." >&2
            exit 1
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" == "foundation-reconcile" ]]; then
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "2396fdf797eb4b19252a34c8b45e93945a8f53a3" ]]
            [[ "$PLAN_RUN_ID" == "36226804148" ]]
            [[ "$APPROVED_PLAN_SHA256" == "ddcf63f2b087c14a4dc7c52aee46e8530f97d7fc05b8ab0c8467eb8526c285f0" ]]
          fi
          if [[ "$PHASE" == "foundation-reconcile-verify" ]]; then
            [[ "$ACTION" == "plan" ]]
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "2396fdf797eb4b19252a34c8b45e93945a8f53a3" ]]
            [[ "$PLAN_RUN_ID" == "36226804148" ]]
            [[ "$APPROVED_PLAN_SHA256" == "ddcf63f2b087c14a4dc7c52aee46e8530f97d7fc05b8ab0c8467eb8526c285f0" ]]
          fi
          if [[ "$PHASE" == "cloud-sql-phase-b" ]]; then
            [[ "$ACTION" == "apply" ]]
            [[ "$APPROVAL_TOKEN" == "S22-APPLY-APPROVED" ]]
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "2396fdf797eb4b19252a34c8b45e93945a8f53a3" ]]
            [[ "$PLAN_RUN_ID" == "36230182001" ]]
            [[ "$APPROVED_PLAN_SHA256" == "2e89253d05281e38af1157e6cf3f1a09740db5572f699f36228606fbbd8a987e" ]]
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" == "bootstrap" ]]; then
            [[ "$APPROVAL_TOKEN" == "S22-APPLY-APPROVED" ]]
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "2396fdf797eb4b19252a34c8b45e93945a8f53a3" ]]
            [[ "$PLAN_RUN_ID" == "36234151332" ]]
            [[ "$APPROVED_PLAN_SHA256" == "4a116fd0d9db69ea821b22c04a1666b1d17f402816f74dde298578ed1d99da96" ]]
            [[ "$TF_VAR_deployment_timestamp" == "2026-09-26T09:53:56Z" ]]
            [[ "$TF_VAR_api_image" == "me-central1-docker.pkg.dev/lead-agent-stg-739284/lead-agent/api@sha256:a19da09bda3b113f00d92ef2e245e8622505b340592b72c2dbb465dc05aafdcf" ]]
            [[ "$TF_VAR_web_image" == "me-central1-docker.pkg.dev/lead-agent-stg-739284/lead-agent/web@sha256:79560082659204911e1c306ca41ce72e83b1f6a4b9975e91a84d89a477a4f93d" ]]
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" == "bootstrap-iam" ]]; then
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$REQUESTED_SHA" == "87216fcd8d2047e292c398a459e49e40c4ff2b9a" ]]
            [[ "$PLAN_RUN_ID" == "36179081896" ]]
            [[ "$APPROVED_PLAN_SHA256" == "1408052e615385b4a01651a8b64605d13746ddde10a6950f7ba4d380a18c60e0" ]]
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" == "foundation" ]]; then
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "c4134d2980c7c31653cc6e52dd21173a58297aab" ]]
            [[ "$PLAN_RUN_ID" == "36176635223" ]]
            [[ "$APPROVED_PLAN_SHA256" == "43ebe6df02eb4b693fdc17dfd2dbedf191668e3a1b61ccc4c97fe94d8cf5ad7c" ]]
          fi
          DEPLOY_RUNTIME=false
          BOOTSTRAP_RUNTIME=false
          PREPARE_MIGRATION=false
          SQL_POLICY=NEVER
          SQL_TIER=db-f1-micro
          API_MAX=1
          WEB_MAX=1
          WORKER_COUNT=0
          WORKER_MEMORY=512Mi

          case "$PHASE" in
            bootstrap-iam) ;;
            bootstrap-log-viewer) ;;
            foundation) ;;
            foundation-reconcile)
              SQL_POLICY=ALWAYS
              ;;
            foundation-reconcile-verify)
              SQL_POLICY=ALWAYS
              ;;
            cloud-sql-start)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              SQL_POLICY=ALWAYS
              ;;
            cloud-sql-phase-b) ;;
            bootstrap)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              ;;
            migration)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              ;;
            migration-resume)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              ;;
            migrator-image-update)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              ;;
            migration-diagnose)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              ;;
            migration-wiring-diagnose)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              ;;
            migration-error-read)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              ;;
            full)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              WORKER_COUNT=1
              ;;
            load)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              SQL_TIER=db-custom-1-3840
              API_MAX=3
              WEB_MAX=2
              WORKER_COUNT=1
              WORKER_MEMORY=1Gi
              ;;
            dormant)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              ;;
          esac

          {
            echo "TF_VAR_deploy_runtime=$DEPLOY_RUNTIME"
            echo "TF_VAR_bootstrap_runtime=$BOOTSTRAP_RUNTIME"
            echo "TF_VAR_prepare_migration=$PREPARE_MIGRATION"
            echo "TF_VAR_cloud_sql_activation_policy=$SQL_POLICY"
            echo "TF_VAR_cloud_sql_tier=$SQL_TIER"
            echo "TF_VAR_api_max_instance_count=$API_MAX"
            echo "TF_VAR_web_max_instance_count=$WEB_MAX"
            echo "TF_VAR_worker_instance_count=$WORKER_COUNT"
            echo "TF_VAR_worker_memory=$WORKER_MEMORY"
          } >> "$GITHUB_ENV"
          if [[ "$PHASE" == "cloud-sql-start" || "$PHASE" == "migration" || "$PHASE" == "migration-resume" || "$PHASE" == "migrator-image-update" || "$PHASE" == "migration-diagnose" || "$PHASE" == "migration-wiring-diagnose" ]]; then
            echo "TF_VAR_git_commit_sha=2396fdf797eb4b19252a34c8b45e93945a8f53a3" >> "$GITHUB_ENV"
            echo "TF_VAR_deployment_timestamp=2026-09-26T09:53:56Z" >> "$GITHUB_ENV"
          fi
          if [[ "$PHASE" == "migration-resume" || "$PHASE" == "migrator-image-update" ]]; then
            echo "TF_VAR_migrator_git_commit_sha=$REQUESTED_SHA" >> "$GITHUB_ENV"
            echo "TF_VAR_migrator_deployment_timestamp=$TF_VAR_deployment_timestamp" >> "$GITHUB_ENV"
          fi

      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.S22_COMMIT_SHA }}

      - name: Prove commit is preserved on the dispatched branch
        env:
          DISPATCH_BRANCH: ${{ github.ref_name }}
          REQUESTED_SHA: ${{ env.S22_COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch --no-tags origin "$DISPATCH_BRANCH"
          git merge-base --is-ancestor "$REQUESTED_SHA" "origin/$DISPATCH_BRANCH"

      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.7

      - name: Initialize bootstrap Terraform
        if: env.S22_PHASE == 'bootstrap-iam' || env.S22_PHASE == 'bootstrap-log-viewer'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: terraform init -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}"

      - name: Validate bootstrap Terraform
        if: env.S22_PHASE == 'bootstrap-iam' || env.S22_PHASE == 'bootstrap-log-viewer'
        working-directory: infra/deploy/gcp/bootstrap
        run: terraform validate

      - name: Verify authoritative bootstrap state
        if: env.S22_PHASE == 'bootstrap-iam' || env.S22_PHASE == 'bootstrap-log-viewer'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_STATE_COUNT="$(terraform state list | wc -l | tr -d '[:space:]')"
          [[ "$BOOTSTRAP_STATE_COUNT" == "34" ]]
          echo "Authoritative bootstrap state resources: $BOOTSTRAP_STATE_COUNT"

      - name: Create reviewed bootstrap IAM plan
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          terraform plan \
            -lock-timeout=5m \
            -target=google_project_iam_member.deployer \
            -out=s22-bootstrap-iam.tfplan
          sha256sum s22-bootstrap-iam.tfplan > s22-bootstrap-iam.tfplan.sha256

      - name: Upload exact reviewed bootstrap IAM plan
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-bootstrap-iam-plan-${{ env.S22_COMMIT_SHA }}
          path: |
            infra/deploy/gcp/bootstrap/s22-bootstrap-iam.tfplan
            infra/deploy/gcp/bootstrap/s22-bootstrap-iam.tfplan.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Create reviewed temporary logging viewer plan
        if: env.S22_PHASE == 'bootstrap-log-viewer' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          PLAN=s22-bootstrap-log-viewer.tfplan
          PLAN_JSON=s22-bootstrap-log-viewer.tfplan.json
          terraform plan \
            -lock-timeout=5m \
            -target='google_project_iam_member.deployer_temporary_logging_viewer[0]' \
            -out="$PLAN"
          sha256sum "$PLAN" > "$PLAN.sha256"
          terraform show -json "$PLAN" > "$PLAN_JSON"
          ACTIONS="$(
            jq -c '
              [.resource_changes[]
               | select(.mode == "managed" and .change.actions != ["no-op"])
               | ((.change.actions | join(",")) + ":" + .address)]
              | sort
            ' "$PLAN_JSON"
          )"
          [[ "$ACTIONS" == '["create:google_project_iam_member.deployer_temporary_logging_viewer[0]"]' ]]
          jq -e '
            [.resource_changes[] | select(.change.actions == ["create"])] | length == 1
          ' "$PLAN_JSON" > /dev/null
          jq -e '
            [.resource_changes[] | select(.change.actions == ["delete"])] | length == 0
          ' "$PLAN_JSON" > /dev/null
          jq -e '
            [.resource_changes[]
             | select(.change.actions == ["delete", "create"] or .change.actions == ["create", "delete"])]
            | length == 0
          ' "$PLAN_JSON" > /dev/null
          jq -e '
            [.resource_changes[]
             | select(.change.actions != ["no-op"])
             | select(
                 .type != "google_project_iam_member"
                 or .change.after.role != "roles/logging.viewer"
                 or .change.after.member != "serviceAccount:lead-agent-staging-deploy@lead-agent-stg-739284.iam.gserviceaccount.com"
               )]
            | length == 0
          ' "$PLAN_JSON" > /dev/null
          echo "bootstrap_logging_viewer_plan_actions=$ACTIONS"
          echo "bootstrap_logging_viewer_plan_creates=1"
          echo "bootstrap_logging_viewer_plan_changes=0"
          echo "bootstrap_logging_viewer_plan_destroys=0"
          echo "bootstrap_logging_viewer_plan_replacements=0"
          echo "bootstrap_logging_viewer_plan_sha256=$(awk '{print $1}' "$PLAN.sha256")"
          rm -f "$PLAN_JSON"

      - name: Upload exact temporary logging viewer plan
        if: env.S22_PHASE == 'bootstrap-log-viewer' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-bootstrap-log-viewer-plan-${{ env.S22_COMMIT_SHA }}
          path: |
            infra/deploy/gcp/bootstrap/s22-bootstrap-log-viewer.tfplan
            infra/deploy/gcp/bootstrap/s22-bootstrap-log-viewer.tfplan.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Initialize staging Terraform
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_PHASE != 'bootstrap-log-viewer'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: terraform init -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}"

      - name: Validate staging Terraform
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_PHASE != 'bootstrap-log-viewer'
        working-directory: infra/deploy/gcp/staging
        run: terraform validate

      - name: Set up Google Cloud CLI for reconciliation inspection
        if: env.S22_PHASE == 'foundation-reconcile' || env.S22_PHASE == 'foundation-reconcile-verify' || env.S22_PHASE == 'cloud-sql-start' || env.S22_PHASE == 'cloud-sql-phase-b' || env.S22_PHASE == 'migration' || env.S22_PHASE == 'migration-resume' || env.S22_PHASE == 'migrator-image-update' || env.S22_PHASE == 'migration-diagnose' || env.S22_PHASE == 'migration-wiring-diagnose' || env.S22_PHASE == 'migration-error-read' || (env.S22_PHASE == 'bootstrap' && env.S22_ACTION == 'apply')
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify database secret version metadata
        if: env.S22_PHASE == 'migration' || env.S22_PHASE == 'migration-resume' || env.S22_PHASE == 'migration-diagnose' || env.S22_PHASE == 'migration-wiring-diagnose'
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          DATABASE_SECRETS=(
            lead-agent-staging-migration-database-url
            lead-agent-staging-runtime-database-url
            lead-agent-staging-auth-database-url
            lead-agent-staging-ingress-database-url
            lead-agent-staging-queue-database-url
          )
          for secret in "${DATABASE_SECRETS[@]}"; do
            gcloud secrets describe "$secret" --project="$PROJECT_ID" --format='value(name)' > /dev/null
            ENABLED_COUNT="$(
              gcloud secrets versions list "$secret" \
                --project="$PROJECT_ID" \
                --filter='state=ENABLED' \
                --format='value(name)' | sed '/^$/d' | wc -l | tr -d '[:space:]'
            )"
            [[ "$ENABLED_COUNT" == "1" ]]
            echo "$secret: enabled_versions=1"
          done

      - name: Inspect partial foundation state and Google Cloud resources
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: me-central1
        shell: bash
        run: |
          set -euo pipefail
          INSPECT_DIR="$(mktemp -d)"
          trap 'rm -rf "$INSPECT_DIR"' EXIT
          EVIDENCE=s22-foundation-reconciliation-evidence.txt
          SQL_INSTANCE=lead-agent-staging-postgres17

          STATE_ADDRESSES="$(terraform state list | sort)"
          STATE_COUNT="$(printf '%s\n' "$STATE_ADDRESSES" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          STATE_HAS_SQL=false
          STATE_HAS_DATABASE_ALERT=false
          grep -Fqx 'google_sql_database_instance.staging' <<< "$STATE_ADDRESSES" && STATE_HAS_SQL=true
          grep -Fqx 'google_monitoring_alert_policy.database_cpu' <<< "$STATE_ADDRESSES" && STATE_HAS_DATABASE_ALERT=true

          gcloud sql instances list --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/sql-instances.json"
          gh run view 36224692606 --repo "$GITHUB_REPOSITORY" --log > "$INSPECT_DIR/failed-apply.log"
          grep -Fq 'This operation is not valid for this instance.' "$INSPECT_DIR/failed-apply.log"
          grep -Fq 'invalidOperation' "$INSPECT_DIR/failed-apply.log"
          gcloud sql tiers list --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/sql-tiers.json"
          gcloud sql flags list --database-version=POSTGRES_17 --format=json > "$INSPECT_DIR/postgres17-flags.json"

          SQL_INSTANCE_COUNT="$(
            jq --arg instance "$SQL_INSTANCE" '[.[] | select(.name == $instance)] | length' \
              "$INSPECT_DIR/sql-instances.json"
          )"
          jq -e --arg region "$REGION" '
            [.[] | select(.tier == "db-f1-micro")] as $tiers
            | ($tiers | length) > 0
              and ([$tiers[] | (.region // .regions // [])[]? | select(. == $region)] | length) > 0
          ' "$INSPECT_DIR/sql-tiers.json" > /dev/null
          jq -e 'length > 0' "$INSPECT_DIR/postgres17-flags.json" > /dev/null

          gcloud compute networks describe lead-agent-staging-vpc \
            --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/network.json"
          gcloud compute addresses describe lead-agent-staging-private-services \
            --global --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/private-range.json"
          gcloud services vpc-peerings list \
            --project="$PROJECT_ID" \
            --network=lead-agent-staging-vpc \
            --service=servicenetworking.googleapis.com \
            --format=json > "$INSPECT_DIR/peerings.json"
          jq -e '.autoCreateSubnetworks == false' "$INSPECT_DIR/network.json" > /dev/null
          jq -e '.addressType == "INTERNAL" and .purpose == "VPC_PEERING"' \
            "$INSPECT_DIR/private-range.json" > /dev/null
          jq -e 'length >= 1' "$INSPECT_DIR/peerings.json" > /dev/null

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://monitoring.googleapis.com/v3/projects/$PROJECT_ID/alertPolicies?pageSize=100" \
            > "$INSPECT_DIR/alerts.json"
          DATABASE_ALERT_COUNT="$(
            jq '[.alertPolicies[]? | select(.displayName == "Lead Agent staging Cloud SQL CPU saturation")] | length' \
              "$INSPECT_DIR/alerts.json"
          )"
          unset ACCESS_TOKEN

          {
            echo "project=$PROJECT_ID"
            echo "region=$REGION"
            echo "terraform_backend=gcs"
            echo "terraform_state_prefix=lead-agent-platform/staging"
            echo "terraform_managed_resource_count=$STATE_COUNT"
            echo "terraform_state_has_cloud_sql=$STATE_HAS_SQL"
            echo "terraform_state_has_database_cpu_alert=$STATE_HAS_DATABASE_ALERT"
            echo "gcp_cloud_sql_instance_count=$SQL_INSTANCE_COUNT"
            echo "gcp_database_cpu_alert_count=$DATABASE_ALERT_COUNT"
            echo "cloud_sql_failed_operation_source=github_run_36224692606"
            echo "cloud_sql_failed_operation_status=terminal_error"
            echo "cloud_sql_failed_operation_code=invalidOperation"
            echo "cloud_sql_pending_operation_observation=none; terminal failure recorded and no instance exists"
            echo "cloud_sql_tier_region_supported=true"
            echo "postgresql_17_api_supported=true"
            echo "private_service_access_present=true"
            echo "terraform_state_addresses:"
            printf '%s\n' "$STATE_ADDRESSES"
          } | tee "$EVIDENCE"

          if [[ "$STATE_HAS_SQL" != "false" || "$SQL_INSTANCE_COUNT" != "0" ]]; then
            echo "Cloud SQL exists in state or GCP; automatic import/reconciliation is not authorized." >&2
            exit 1
          fi
          if [[ "$STATE_HAS_DATABASE_ALERT" != "false" || "$DATABASE_ALERT_COUNT" != "0" ]]; then
            echo "The dependent CPU alert exists outside the expected partial state; automatic import is not authorized." >&2
            exit 1
