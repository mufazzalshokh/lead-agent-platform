          SQL_STATE="$(jq -r '.state' "$VERIFY_DIR/sql.json")"
          SQL_PRIVATE_IP="$(jq -r '[.ipAddresses[] | select(.type == "PRIVATE")][0].ipAddress' "$VERIFY_DIR/sql.json")"
          echo "Verified VPC: lead-agent-staging-vpc"
          echo "Verified subnet: lead-agent-staging-cloud-run"
          echo "Verified Cloud SQL state: $SQL_STATE"
          echo "Verified Cloud SQL private IP assigned: $([[ -n "$SQL_PRIVATE_IP" && "$SQL_PRIVATE_IP" != "null" ]] && echo true || echo false)"
          echo "Verified Artifact Registry repositories: 1; images: 0"
          echo "Verified Secret Manager resources: ${#SECRETS[@]}; versions: $SECRET_VERSION_COUNT"
          echo "Verified alert policies: 2; budgets: 2"
          echo "Verified runtime identities: ${#RUNTIME_IDENTITIES[@]}"
          echo "Verified Cloud Run services: 0; jobs: 0"

      - name: Read sanitized migrator application error
        if: env.S22_PHASE == 'migration-error-read' && env.S22_ACTION == 'plan'
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          EXECUTION_ID: ${{ env.S22_MIGRATOR_EXECUTION_ID }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          LOGS="$(mktemp)"
          EXECUTION="$(mktemp)"
          TASKS="$(mktemp)"
          trap 'rm -f "$LOGS" "$EXECUTION" "$TASKS"' EXIT
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/me-central1/jobs/lead-agent-staging-migrator/executions/${EXECUTION_ID}/tasks?pageSize=1" \
            > "$TASKS"
          unset ACCESS_TOKEN
          if ! gcloud beta run jobs executions logs read "$EXECUTION_ID" \
            --project="$PROJECT_ID" \
            --region=me-central1 \
            --limit=200 \
            --order=asc \
            --format=json > "$LOGS"; then
            printf '[]\n' > "$LOGS"
          fi
          gcloud run jobs executions describe "$EXECUTION_ID" \
            --project="$PROJECT_ID" \
            --region=me-central1 \
            --format=json > "$EXECUTION"
          node - "$LOGS" "$EXECUTION" "$TASKS" "$EXECUTION_ID" <<'NODE' | tee s22-migrator-root-error.txt
          const fs = require("node:fs");
          const [logPath, executionPath, tasksPath, executionId] = process.argv.slice(2);
          const rawLogs = fs.readFileSync(logPath, "utf8");
          const execution = JSON.parse(fs.readFileSync(executionPath, "utf8"));
          const tasks = JSON.parse(fs.readFileSync(tasksPath, "utf8"));
          let parsedLogs;
          try {
            parsedLogs = JSON.parse(rawLogs);
          } catch {
            parsedLogs = [];
          }
          const entries = Array.isArray(parsedLogs)
            ? parsedLogs
            : Array.isArray(parsedLogs?.entries)
              ? parsedLogs.entries
              : parsedLogs && typeof parsedLogs === "object"
                ? [parsedLogs]
                : [];

          const asObject = (value) =>
            typeof value === "object" && value !== null && !Array.isArray(value) ? value : undefined;
          const parseJsonObject = (value) => {
            if (typeof value !== "string") return undefined;
            try {
              return asObject(JSON.parse(value));
            } catch {
              return undefined;
            }
          };
          const payloads = entries.flatMap((entry) => {
            const payload = asObject(entry.jsonPayload);
            return [
              payload,
              parseJsonObject(entry.textPayload),
              parseJsonObject(payload?.message),
            ].filter(Boolean);
          });
          const failure = payloads.find(
            (payload) => payload.operation === "database_migration" && payload.outcome === "failed",
          );
          const identityVerification = payloads.find(
            (payload) =>
              payload.operation === "staging_owner_workspace_identity_verify"
              && (payload.outcome === "PASS" || payload.outcome === "FAIL"),
          );

          const sanitize = (value) =>
            String(value ?? "unavailable")
              .replace(/postgres(?:ql)?:\/\/[^\s"'<>]+/giu, "postgresql://[REDACTED]")
              .replace(/[a-z][a-z0-9+.-]*:\/\/[^\s"'<>]+/giu, "[REDACTED_URL]")
              .replace(/Bearer\s+[^\s"'<>]+/giu, "Bearer [REDACTED]")
              .replace(/(?:[A-Za-z0-9_-]{16,}\.){2}[A-Za-z0-9_-]{16,}/gu, "[REDACTED_TOKEN]")
              .replace(/((?:password|token|secret|authorization|api[_-]?key|database[_-]?url)\s*[:=]\s*)[^\s,;"'<>]+/giu, "$1[REDACTED]")
              .replace(/\b(?:\d{1,3}\.){3}\d{1,3}\b/gu, "[REDACTED_IP]")
              .replace(/[\u0000-\u001f\u007f]+/gu, " ")
              .replace(/\s+/gu, " ")
              .trim()
              .slice(0, 1200);
          const optional = (value, pattern) => {
            if (value === null || value === undefined) return null;
            const sanitized = sanitize(value);
            return pattern.test(sanitized) ? sanitized : "unavailable";
          };
          const executionStatus = asObject(execution.status) ?? execution;
          const conditions = Array.isArray(executionStatus.conditions) ? executionStatus.conditions : [];
          const completedCondition = conditions.find((condition) => condition.type === "Completed")
            ?? conditions.find((condition) => condition.state === "CONDITION_FAILED" || condition.status === "False");
          const executionFailure = completedCondition && {
            diagnostic_mode: "sanitized_execution_status",
            error_code: optional(completedCondition.reason, /^[A-Z][A-Z0-9_]{1,79}$/u),
            error_message: sanitize(completedCondition.message),
            error_type: optional(completedCondition.type, /^[A-Za-z][A-Za-z0-9_.-]{0,79}$/u),
            execution_id: executionId,
            failed_count: Number(executionStatus.failedCount ?? executionStatus.failed_count ?? 0),
            operation: "database_migration",
            outcome: "failed",
            retried_count: Number(executionStatus.retriedCount ?? executionStatus.retried_count ?? 0),
          };
          const task = Array.isArray(tasks)
            ? tasks[0]
            : Array.isArray(tasks?.tasks)
              ? tasks.tasks[0]
              : undefined;
          const taskExitCode = task?.lastAttemptResult?.exitCode
            ?? task?.status?.lastAttemptResult?.exitCode
            ?? task?.status?.exitCode
            ?? (
              (task?.lastAttemptResult?.status?.code
                ?? task?.status?.lastAttemptResult?.status?.code) === 0
                && typeof task?.completionTime === "string"
                && task.completionTime.length > 0
                ? 0
                : undefined
            );
          const ownerBootstrapStages = new Map([
            [70, "bootstrap_entry"],
            [71, "dependency_load"],
            [72, "input_validation"],
            [73, "database_connect"],
            [74, "transaction_start"],
            [75, "bootstrap_capability"],
            [76, "stored_identity_validation"],
            [77, "replay_protection"],
            [78, "success_evidence"],
            [79, "auth_role_identity_validation"],
            [80, "identity_row_count"],
            [81, "issuer_mismatch"],
            [82, "subject_mismatch"],
            [83, "issuer_and_subject_mismatch"],
            [84, "identity_shape"],
            [85, "owner_membership"],
            [86, "bootstrap_audit"],
            [87, "auth_connection_shape"],
            [88, "auth_identity_unmapped"],
            [89, "auth_identity_invalid"],
          ]);
          const taskFailure = Number.isInteger(taskExitCode) && {
            diagnostic_mode: "cloud_run_task_status",
            execution_id: executionId,
            failure_stage: ownerBootstrapStages.get(taskExitCode) ?? "runtime_unclassified",
            operation: "cloud_run_job_execution",
            outcome: taskExitCode === 0 ? "succeeded" : "failed",
            task_exit_code: taskExitCode,
          };
          const structuredEvidence = failure && {
            diagnostic_mode: "structured_application_error",
            error_category: optional(failure.error_category, /^[a-z][a-z0-9_]{0,79}$/u),
            error_code: optional(failure.error_code, /^[0-9A-Z_]{2,32}$/u),
            error_message: sanitize(failure.error_message),
            error_type: optional(failure.error_type, /^[A-Za-z][A-Za-z0-9_.-]{0,79}$/u),
            execution_id: executionId,
            failure_stage: optional(failure.failure_stage, /^(?:load_migrator|apply_migrations)$/u),
            migration_identifier: optional(failure.migration_identifier, /^[0-9]{4}_[a-z0-9_]+$/u),
            operation: "database_migration",
            outcome: "failed",
          };
          const identityChecks = asObject(identityVerification?.checks);
          const identityEvidence = identityVerification && identityChecks && {
            checks: {
              bootstrap_audit: identityChecks.bootstrap_audit === true,
              exact_identity: identityChecks.exact_identity === true,
              identity_row_count: Number.isInteger(identityChecks.identity_row_count)
                ? identityChecks.identity_row_count
                : -1,
              issuer_match: identityChecks.issuer_match === true,
              subject_match: identityChecks.subject_match === true,
            },
            diagnostic_mode: "staging_owner_identity_validation",
            execution_id: executionId,
            operation: "staging_owner_workspace_identity_verify",
            outcome: identityVerification.outcome,
          };
          const diagnosticLogPattern = /(?:stderr|varlog%2Fsystem)$/u;
          const usefulErrorPattern = /(?:error|failed|failure|exception|cannot|denied|refused|timeout|not found|module_not_found|err_)/iu;
          const fallbackMessages = entries
            .map((entry) => {
              const jsonPayload = asObject(entry.jsonPayload);
              const protoPayload = asObject(entry.protoPayload);
              const status = asObject(protoPayload?.status);
              const message = entry.textPayload ?? jsonPayload?.message ?? status?.message ?? entry.message;
              return {
                error_message: sanitize(message),
                is_diagnostic_log: diagnosticLogPattern.test(String(entry.logName ?? "")),
                log_name: String(entry.logName ?? "").split("/logs/").at(-1) ?? "unavailable",
                severity: optional(entry.severity, /^(?:DEFAULT|DEBUG|INFO|NOTICE|WARNING|ERROR|CRITICAL|ALERT|EMERGENCY)$/u),
              };
            });
          const fallback = fallbackMessages.find(
            ({ error_message, is_diagnostic_log }) => is_diagnostic_log && usefulErrorPattern.test(error_message),
          ) ?? fallbackMessages.find(({ error_message }) => usefulErrorPattern.test(error_message));
          const evidence = structuredEvidence ?? identityEvidence ?? (fallback ? {
            diagnostic_mode: "sanitized_runtime_fallback",
            error_message: fallback.error_message,
            execution_id: executionId,
            log_name: fallback.log_name,
            operation: "database_migration",
            outcome: "failed",
            severity: fallback.severity,
          } : taskFailure ?? executionFailure ?? {
            diagnostic_mode: "sanitized_metadata_only",
            entry_count: entries.length,
            execution_id: executionId,
            operation: "database_migration",
            outcome: "failed",
          });
          console.log(JSON.stringify(evidence));
          NODE

      - name: Upload sanitized migrator application error
        if: always() && env.S22_PHASE == 'migration-error-read' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-migrator-root-error-${{ env.S22_MIGRATOR_EXECUTION_ID }}
          path: s22-migrator-root-error.txt
          if-no-files-found: error
          retention-days: 7

      - name: Run bounded migration failure diagnostics
        if: env.S22_PHASE == 'migration-diagnose' && env.S22_ACTION == 'plan'
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          PROBE_DIR="$RUNNER_TEMP/s22-migration-diagnostics"
          mkdir -p "$PROBE_DIR"

          gcloud run jobs describe lead-agent-staging-migrator \
            --project="$PROJECT_ID" \
            --region=me-central1 \
            --format=json > "$PROBE_DIR/migrator-job.json"
          gcloud sql instances describe lead-agent-staging-postgres17 \
            --project="$PROJECT_ID" \
            --format=json > "$PROBE_DIR/cloud-sql.json"

          if jq -e '
            [.. | .network? // empty]
            | any(. == "lead-agent-staging-vpc" or endswith("/networks/lead-agent-staging-vpc"))
          ' "$PROBE_DIR/migrator-job.json" > /dev/null; then
            echo "live_vpc_network=PASS" | tee -a s22-migration-diagnostic-evidence.txt
          else
            echo "live_vpc_network=FAIL" | tee -a s22-migration-diagnostic-evidence.txt
          fi

          if jq -e '
            [.. | .subnetwork? // empty]
            | any(. == "lead-agent-staging-cloud-run" or endswith("/subnetworks/lead-agent-staging-cloud-run"))
          ' "$PROBE_DIR/migrator-job.json" > /dev/null; then
            echo "live_vpc_subnetwork=PASS" | tee -a s22-migration-diagnostic-evidence.txt
          else
            echo "live_vpc_subnetwork=FAIL" | tee -a s22-migration-diagnostic-evidence.txt
          fi

          if jq -e '
            [.. | .egress? // empty] | any(. == "PRIVATE_RANGES_ONLY")
          ' "$PROBE_DIR/migrator-job.json" > /dev/null; then
            echo "live_vpc_egress=PASS" | tee -a s22-migration-diagnostic-evidence.txt
          else
            echo "live_vpc_egress=FAIL" | tee -a s22-migration-diagnostic-evidence.txt
          fi

          if grep -q '^live_vpc_network=PASS$' s22-migration-diagnostic-evidence.txt \
            && grep -q '^live_vpc_subnetwork=PASS$' s22-migration-diagnostic-evidence.txt \
            && grep -q '^live_vpc_egress=PASS$' s22-migration-diagnostic-evidence.txt; then
            echo "live_vpc_configuration=PASS" | tee -a s22-migration-diagnostic-evidence.txt
          else
            echo "live_vpc_configuration=FAIL" | tee -a s22-migration-diagnostic-evidence.txt
          fi

          if jq -e '
            .state == "RUNNABLE"
            and any(.ipAddresses[]?; .type == "PRIVATE" and .ipAddress == "10.125.0.3")
          ' "$PROBE_DIR/cloud-sql.json" > /dev/null; then
            echo "live_cloud_sql_endpoint=PASS" | tee -a s22-migration-diagnostic-evidence.txt
          else
            echo "live_cloud_sql_endpoint=FAIL" | tee -a s22-migration-diagnostic-evidence.txt
          fi

          run_probe() {
            local name="$1"
            local script="$2"
            local script_file="$PROBE_DIR/$name.mjs"
            printf '%s\n' "$script" > "$script_file"
            local script_b64
            script_b64="$(base64 -w0 "$script_file")"
            if gcloud run jobs execute lead-agent-staging-migrator \
              --project="$PROJECT_ID" \
              --region=me-central1 \
              --task-timeout=60s \
              --args='--input-type=module,-e,eval(atob(process.env.S22_DIAGNOSTIC_SCRIPT_B64))' \
              --update-env-vars="S22_DIAGNOSTIC_SCRIPT_B64=$script_b64" \
              --wait > /dev/null 2>&1; then
              printf '%s=PASS\n' "$name" | tee -a s22-migration-diagnostic-evidence.txt
            else
              printf '%s=FAIL\n' "$name" | tee -a s22-migration-diagnostic-evidence.txt
            fi
          }

          run_probe execution_override 'process.exitCode = 0;'

          run_probe secret_protocols '
            import process from "node:process";
            const keys = ["AUTH_DATABASE_URL", "DATABASE_URL", "INGRESS_DATABASE_URL", "MIGRATION_DATABASE_URL", "QUEUE_DATABASE_URL"];
            let valid = true;
            for (const key of keys) {
              try {
                const parsed = new URL(process.env[key]);
                valid &&= ["postgres:", "postgresql:"].includes(parsed.protocol);
              } catch {
                valid = false;
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe secret_roles '
            import process from "node:process";
            const expected = {
              AUTH_DATABASE_URL: "lead_agent_auth",
              DATABASE_URL: "lead_agent_runtime",
              INGRESS_DATABASE_URL: "lead_agent_ingress",
              MIGRATION_DATABASE_URL: "postgres",
              QUEUE_DATABASE_URL: "lead_agent_queue_runtime",
            };
            let valid = true;
            for (const [key, role] of Object.entries(expected)) {
              try {
                const parsed = new URL(process.env[key]);
                valid &&= decodeURIComponent(parsed.username) === role;
              } catch {
                valid = false;
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe secret_password_presence '
            import process from "node:process";
            const keys = ["AUTH_DATABASE_URL", "DATABASE_URL", "INGRESS_DATABASE_URL", "MIGRATION_DATABASE_URL", "QUEUE_DATABASE_URL"];
            let valid = true;
            for (const key of keys) {
              try {
                valid &&= new URL(process.env[key]).password.length > 0;
              } catch {
                valid = false;
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe secret_endpoint '
            import process from "node:process";
            const keys = ["AUTH_DATABASE_URL", "DATABASE_URL", "INGRESS_DATABASE_URL", "MIGRATION_DATABASE_URL", "QUEUE_DATABASE_URL"];
            let valid = true;
            for (const key of keys) {
              try {
                const parsed = new URL(process.env[key]);
                valid &&= parsed.hostname === "10.125.0.3";
                valid &&= parsed.port === "5432";
                valid &&= parsed.pathname === "/lead_agent_staging";
              } catch {
                valid = false;
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe secret_sslmode '
            import process from "node:process";
            const keys = ["AUTH_DATABASE_URL", "DATABASE_URL", "INGRESS_DATABASE_URL", "MIGRATION_DATABASE_URL", "QUEUE_DATABASE_URL"];
            let valid = true;
            for (const key of keys) {
              try {
                valid &&= new URL(process.env[key]).searchParams.get("sslmode") === "require";
              } catch {
                valid = false;
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe secret_shape '
            import process from "node:process";
            const expected = {
              AUTH_DATABASE_URL: "lead_agent_auth",
              DATABASE_URL: "lead_agent_runtime",
              INGRESS_DATABASE_URL: "lead_agent_ingress",
              MIGRATION_DATABASE_URL: "postgres",
              QUEUE_DATABASE_URL: "lead_agent_queue_runtime",
            };
            let valid = true;
            for (const [key, role] of Object.entries(expected)) {
              try {
                const value = process.env[key];
                if (typeof value !== "string" || value.length === 0) throw new Error();
                const parsed = new URL(value);
                valid &&= ["postgres:", "postgresql:"].includes(parsed.protocol);
                valid &&= decodeURIComponent(parsed.username) === role;
                valid &&= parsed.password.length > 0;
                valid &&= parsed.hostname === "10.125.0.3";
                valid &&= parsed.port === "5432";
                valid &&= parsed.pathname === "/lead_agent_staging";
                valid &&= parsed.searchParams.get("sslmode") === "require";
              } catch {
                valid = false;
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe private_tcp_connectivity '
            import net from "node:net";
            const connected = await new Promise((resolve) => {
              const socket = net.createConnection({ host: "10.125.0.3", port: 5432 });
              const finish = (result) => {
                socket.destroy();
                resolve(result);
              };
              socket.setTimeout(10000, () => finish(false));
              socket.once("connect", () => finish(true));
              socket.once("error", () => finish(false));
            });
            process.exitCode = connected ? 0 : 1;
          '

          run_probe migration_secret_shape '
            import process from "node:process";
            let valid = true;
            try {
              const value = process.env.MIGRATION_DATABASE_URL;
              if (typeof value !== "string" || value.length === 0) throw new Error();
              const parsed = new URL(value);
              valid &&= ["postgres:", "postgresql:"].includes(parsed.protocol);
              valid &&= decodeURIComponent(parsed.username) === "postgres";
              valid &&= parsed.password.length > 0;
              valid &&= parsed.hostname === "10.125.0.3";
              valid &&= parsed.port === "5432";
              valid &&= parsed.pathname === "/lead_agent_staging";
              valid &&= parsed.searchParams.get("sslmode") === "require";
            } catch {
              valid = false;
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe application_secret_shape '
            import process from "node:process";
            const expected = {
              AUTH_DATABASE_URL: "lead_agent_auth",
              DATABASE_URL: "lead_agent_runtime",
              INGRESS_DATABASE_URL: "lead_agent_ingress",
              QUEUE_DATABASE_URL: "lead_agent_queue_runtime",
            };
            let valid = true;
            for (const [key, role] of Object.entries(expected)) {
              try {
                const value = process.env[key];
                if (typeof value !== "string" || value.length === 0) throw new Error();
                const parsed = new URL(value);
                valid &&= ["postgres:", "postgresql:"].includes(parsed.protocol);
                valid &&= decodeURIComponent(parsed.username) === role;
                valid &&= parsed.password.length > 0;
                valid &&= parsed.hostname === "10.125.0.3";
                valid &&= parsed.port === "5432";
                valid &&= parsed.pathname === "/lead_agent_staging";
                valid &&= parsed.searchParams.get("sslmode") === "require";
              } catch {
                valid = false;
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          run_probe admin_connectivity '
            import process from "node:process";
            import { Pool } from "pg";
            const pool = new Pool({
              application_name: "lead-agent-staging-admin-diagnostic",
              connectionString: process.env.MIGRATION_DATABASE_URL,
              connectionTimeoutMillis: 15000,
              max: 1,
              query_timeout: 15000,
            });
            try {
              const result = await pool.query("select current_database() as database_name, current_setting($$server_version_num$$)::integer as server_version_num");
              process.exitCode = result.rows[0]?.database_name === "lead_agent_staging"
                && result.rows[0]?.server_version_num >= 170000
                && result.rows[0]?.server_version_num < 180000 ? 0 : 1;
            } catch {
              process.exitCode = 1;
            } finally {
              await pool.end().catch(() => {});
            }
          '

          run_probe migration_state '
            import process from "node:process";
            import { Pool } from "pg";
            const pool = new Pool({
              application_name: "lead-agent-staging-schema-diagnostic",
              connectionString: process.env.MIGRATION_DATABASE_URL,
              connectionTimeoutMillis: 15000,
              max: 1,
              query_timeout: 15000,
            });
            try {
              const migrations = await pool.query("select count(*)::integer as count from drizzle.__drizzle_migrations");
              const tables = await pool.query("select count(*)::integer as count from information_schema.tables where table_schema = $$public$$ and table_type = $$BASE TABLE$$");
              process.exitCode = migrations.rows[0]?.count === 32 && tables.rows[0]?.count === 52 ? 0 : 1;
            } catch {
              process.exitCode = 1;
            } finally {
              await pool.end().catch(() => {});
            }
          '

          run_probe application_role_connectivity '
            import process from "node:process";
            import { Pool } from "pg";
            const urls = {
              AUTH_DATABASE_URL: "lead_agent_auth",
              DATABASE_URL: "lead_agent_runtime",
              INGRESS_DATABASE_URL: "lead_agent_ingress",
              QUEUE_DATABASE_URL: "lead_agent_queue_runtime",
            };
            let valid = true;
            for (const [key, role] of Object.entries(urls)) {
              const pool = new Pool({
                application_name: `lead-agent-staging-${role}-diagnostic`,
                connectionString: process.env[key],
                connectionTimeoutMillis: 15000,
                max: 1,
                query_timeout: 15000,
              });
              try {
                const result = await pool.query("select current_user as role_name, current_database() as database_name");
                valid &&= result.rows[0]?.role_name === role;
                valid &&= result.rows[0]?.database_name === "lead_agent_staging";
              } catch {
                valid = false;
              } finally {
                await pool.end().catch(() => {});
              }
            }
            process.exitCode = valid ? 0 : 1;
          '

          rm -rf "$PROBE_DIR"

      - name: Diagnose migrator secret and VPC wiring
        if: env.S22_PHASE == 'migration-wiring-diagnose' && env.S22_ACTION == 'plan'
        env:
          FAILED_EXECUTION: ${{ env.S22_MIGRATOR_EXECUTION_ID }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: me-central1
          S22_RUN_SQL_PROBE: true
          S22_SKIP_ACTIVE_PROBES: true
        shell: bash
        run: bash .github/scripts/s22-migration-wiring-diagnose.sh

      - name: Upload migration wiring diagnostic evidence
        if: always() && env.S22_PHASE == 'migration-wiring-diagnose' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-migration-wiring-diagnostic-evidence-${{ github.run_id }}
          path: s22-migration-wiring-diagnostic-evidence.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload migration diagnostic evidence
        if: always() && env.S22_PHASE == 'migration-diagnose' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-migration-diagnostic-evidence-${{ github.run_id }}
          path: s22-migration-diagnostic-evidence.txt
          if-no-files-found: error
          retention-days: 7

      - name: Execute one-shot migrator
        if: github.event_name == 'workflow_dispatch' && env.S22_ACTION == 'apply' && (env.S22_PHASE == 'migration' || env.S22_PHASE == 'migration-resume')
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        run: >-
          gcloud run jobs execute lead-agent-staging-migrator
          --project="${{ vars.GCP_PROJECT_ID }}"
          --region=me-central1
          --wait

      - name: Verify migrated staging database
        if: github.event_name == 'workflow_dispatch' && ((env.S22_ACTION == 'apply' && (env.S22_PHASE == 'migration' || env.S22_PHASE == 'migration-resume')) || (env.S22_ACTION == 'plan' && env.S22_PHASE == 'migration-validate'))
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          VALIDATOR=".github/scripts/s22-staging-database-validator.mjs"
          EVIDENCE="$GITHUB_WORKSPACE/s22-database-validator-evidence.jsonl"
          EXECUTION_JSON="$RUNNER_TEMP/s22-validator-execution.json"
          LOGS="$RUNNER_TEMP/s22-validator-logs.json"
          PARSED="$RUNNER_TEMP/s22-validator-parsed.jsonl"
          rm -f "$EVIDENCE" "$EXECUTION_JSON" "$LOGS" "$PARSED"
          trap 'if [[ ! -s "$EVIDENCE" ]]; then echo '\''{"assertion":"validator_workflow_harness","expected":"structured validator evidence","failure_code":"S22V096_VALIDATOR_HARNESS","observed":"workflow_failed_before_evidence","operation":"staging_database_validation","outcome":"FAIL","summary":true}'\'' > "$EVIDENCE"; fi' EXIT
          VALIDATOR_B64="$(base64 -w0 "$VALIDATOR")"
          set +e
          EXECUTION_ID="$(gcloud run jobs execute lead-agent-staging-migrator \
            --project="$PROJECT_ID" \
            --region=me-central1 \
            --args='--input-type=module,-e,eval(atob(process.env.S22_VALIDATOR_B64))' \
            --update-env-vars="S22_VALIDATOR_B64=$VALIDATOR_B64" \
            --format='value(metadata.name)')"
          LAUNCH_EXIT_CODE=$?
          set -e
          unset VALIDATOR_B64
          if [[ "$LAUNCH_EXIT_CODE" != "0" || ! "$EXECUTION_ID" =~ ^lead-agent-staging-migrator-[a-z0-9]+$ ]]; then
            echo '{"assertion":"validator_execution_launch","expected":"validator execution created","failure_code":"S22V098_VALIDATOR_LAUNCH","observed":"launch_failed","operation":"staging_database_validation","outcome":"FAIL","summary":true}' | tee "$EVIDENCE"
            exit 1
          fi

          TERMINAL_STATE=""
          for ATTEMPT in $(seq 1 60); do
            gcloud run jobs executions describe "$EXECUTION_ID" \
              --project="$PROJECT_ID" \
              --region=me-central1 \
              --format=json > "$EXECUTION_JSON"
            TERMINAL_STATE="$(jq -r '
              (.status // .) as $status
              | [($status.conditions // [])[]
                  | select(.type == "Completed")
                  | (.state // .status // "")]
              | .[0] // ""
            ' "$EXECUTION_JSON")"
            if [[ "$TERMINAL_STATE" == "CONDITION_SUCCEEDED" || "$TERMINAL_STATE" == "CONDITION_FAILED" || "$TERMINAL_STATE" == "True" || "$TERMINAL_STATE" == "False" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$TERMINAL_STATE" || "$TERMINAL_STATE" == "CONDITION_PENDING" || "$TERMINAL_STATE" == "Unknown" ]]; then
            gcloud run jobs executions cancel "$EXECUTION_ID" \
              --project="$PROJECT_ID" \
              --region=me-central1 \
              --quiet || true
            echo '{"assertion":"validator_execution_window","expected":"terminal within 300 seconds","failure_code":"S22V099_VALIDATOR_TIMEOUT","observed":"bounded_timeout_cancelled","operation":"staging_database_validation","outcome":"FAIL","summary":true}' | tee "$EVIDENCE"
            exit 1
          fi

          for ATTEMPT in $(seq 1 12); do
            gcloud logging read \
              "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"lead-agent-staging-migrator\" AND labels.\"run.googleapis.com/execution_name\"=\"${EXECUTION_ID}\"" \
              --project="$PROJECT_ID" \
              --freshness=1h \
              --limit=300 \
              --order=asc \
              --format=json > "$LOGS"
            node - "$LOGS" <<'NODE' > "$PARSED"
          const fs = require("node:fs");
          const [logPath] = process.argv.slice(2);
          const rawText = fs.readFileSync(logPath, "utf8");
          const documents = [];
          const appendDocument = (candidate) => {
            try { documents.push(JSON.parse(candidate)); } catch { /* try the next safe shape */ }
          };
          appendDocument(rawText);
          if (documents.length === 0) {
            const arrayStart = rawText.indexOf("[");
            const arrayEnd = rawText.lastIndexOf("]");
            if (arrayStart >= 0 && arrayEnd > arrayStart) {
              appendDocument(rawText.slice(arrayStart, arrayEnd + 1));
            }
          }
          if (documents.length === 0) {
            for (const line of rawText.split(/\r?\n/u)) {
              const candidate = line.trim();
              if (candidate.startsWith("{") || candidate.startsWith("[")) appendDocument(candidate);
            }
          }
          const entries = documents.flatMap((document) =>
            Array.isArray(document)
              ? document
              : Array.isArray(document?.entries)
                ? document.entries
                : document && typeof document === "object"
                  ? [document]
                  : [],
          );
          const object = (value) =>
            typeof value === "object" && value !== null && !Array.isArray(value) ? value : undefined;
          const parse = (value) => {
            if (typeof value !== "string") return undefined;
            try { return object(JSON.parse(value)); } catch { return undefined; }
          };
          const safeText = (value) => String(value)
            .replace(/postgres(?:ql)?:\/\/[^\s"'<>]+/giu, "postgresql://[REDACTED]")
            .replace(/[a-z][a-z0-9+.-]*:\/\/[^\s"'<>]+/giu, "[REDACTED_URL]")
            .replace(/Bearer\s+[^\s"'<>]+/giu, "Bearer [REDACTED]")
            .replace(/((?:password|token|secret|authorization|api[_-]?key|database[_-]?url)\s*[:=]\s*)[^\s,;"'<>]+/giu, "$1[REDACTED]")
            .replace(/\b(?:\d{1,3}\.){3}\d{1,3}\b/gu, "[REDACTED_IP]")
            .slice(0, 2000);
          const safeValue = (value, depth = 0) => {
            if (depth > 4) return "[TRUNCATED]";
            if (value === null || typeof value === "boolean" || typeof value === "number") return value;
            if (typeof value === "string") return safeText(value);
            if (Array.isArray(value)) return value.slice(0, 100).map((item) => safeValue(item, depth + 1));
            const record = object(value);
            if (!record) return "unavailable";
            return Object.fromEntries(
              Object.entries(record)
                .filter(([key]) => !/(?:password|token|secret|authorization|api[_-]?key|database[_-]?url)/iu.test(key))
                .slice(0, 100)
                .map(([key, item]) => [key, safeValue(item, depth + 1)]),
            );
          };
          const payloads = entries.flatMap((entry) => {
            const payload = object(entry.jsonPayload);
            return [payload, parse(entry.textPayload), parse(payload?.message)].filter(Boolean);
          });
          const seen = new Set();
          for (const payload of payloads) {
            if (payload.operation !== "staging_database_validation") continue;
            if (typeof payload.assertion !== "string" && payload.summary !== true) continue;
            const sanitized = {
              assertion: typeof payload.assertion === "string" ? safeText(payload.assertion) : undefined,
              assertion_count: Number.isInteger(payload.assertion_count) ? payload.assertion_count : undefined,
              expected: safeValue(payload.expected),
              failed_assertions: safeValue(payload.failed_assertions),
              failure_code: typeof payload.failure_code === "string" ? safeText(payload.failure_code) : undefined,
              failure_count: Number.isInteger(payload.failure_count) ? payload.failure_count : undefined,
              observed: safeValue(payload.observed),
              operation: "staging_database_validation",
              outcome: payload.outcome === "PASS" ? "PASS" : "FAIL",
              summary: payload.summary === true ? true : undefined,
            };
            const line = JSON.stringify(sanitized);
            if (!seen.has(line)) {
              seen.add(line);
              console.log(line);
            }
          }
          NODE
            if grep -q '"summary":true' "$PARSED"; then
              break
            fi
            sleep 5
          done

          if ! grep -q '"summary":true' "$PARSED"; then
            echo '{"assertion":"validator_structured_logs","expected":"structured validator summary","failure_code":"S22V097_VALIDATOR_LOGS","observed":"summary_unavailable","operation":"staging_database_validation","outcome":"FAIL","summary":true}' > "$PARSED"
          fi
          cat "$PARSED" | tee "$EVIDENCE"
          if ! grep -q '"outcome":"PASS","summary":true' "$PARSED"; then
            exit 1
          fi

      - name: Upload staging database validator evidence
        if: always() && github.event_name == 'workflow_dispatch' && ((env.S22_ACTION == 'apply' && (env.S22_PHASE == 'migration' || env.S22_PHASE == 'migration-resume')) || (env.S22_ACTION == 'plan' && env.S22_PHASE == 'migration-validate'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-database-validator-evidence-${{ github.run_id }}
          path: s22-database-validator-evidence.jsonl
          if-no-files-found: error
          retention-days: 7

      - name: Verify migration Terraform convergence
        if: github.event_name == 'workflow_dispatch' && env.S22_ACTION == 'apply' && (env.S22_PHASE == 'migration' || env.S22_PHASE == 'migration-resume')
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          STATE_COUNT="$(terraform state list | wc -l | tr -d '[:space:]')"
          [[ "$STATE_COUNT" == "88" ]]
          set +e
          terraform plan -detailed-exitcode -lock-timeout=5m
          PLAN_EXIT_CODE=$?
          set -e
          [[ "$PLAN_EXIT_CODE" == "0" ]]
          {
            echo "migration_state_count=$STATE_COUNT"
            echo "migration_convergence_exit_code=$PLAN_EXIT_CODE"
            echo "migration_head=0031_s22_widget_inbound_route_management"
            echo "migration_count=32"
            echo "production_table_count=52"
            echo "force_rls_table_count=48"
            echo "application_role_connectivity=PASS"
          } | tee -a s22-migration-apply-evidence.txt

      - name: Upload migration apply evidence
        if: always() && env.S22_ACTION == 'apply' && (env.S22_PHASE == 'migration' || env.S22_PHASE == 'migration-resume')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-migration-apply-evidence-${{ github.run_id }}
          path: infra/deploy/gcp/staging/s22-migration-apply-evidence.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Record deployment provenance
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_PHASE != 'bootstrap-log-viewer' && env.S22_PHASE != 'bootstrap-log-viewer-remove' && env.S22_PHASE != 'foundation' && env.S22_PHASE != 'cloud-sql-start' && env.S22_PHASE != 'cloud-sql-phase-b' && env.S22_PHASE != 'instagram-verify-access' && env.S22_PHASE != 'instagram-verify-access-remove' && env.S22_PHASE != 'telegram-verify-access' && env.S22_PHASE != 'telegram-verify-access-remove' && env.S22_PHASE != 'owner-workspace-bootstrap' && env.S22_ACTION == 'apply'
        env:
          API_IMAGE: ${{ inputs.api_image }}
          DEPLOYED_AT: ${{ inputs.deployment_timestamp }}
          MIGRATOR_IMAGE: ${{ inputs.migrator_image }}
          PHASE: ${{ env.S22_PHASE }}
          REQUESTED_SHA: ${{ env.S22_COMMIT_SHA }}
          WEB_IMAGE: ${{ inputs.web_image }}
          WORKER_IMAGE: ${{ inputs.worker_image }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## S22 staging deployment"
            echo "- Environment: staging"
            echo "- Region: me-central1"
            echo "- Phase: $PHASE"
            echo "- Commit: \`$REQUESTED_SHA\`"
            echo "- Migration head: \`0031_s22_widget_inbound_route_management\`"
            echo "- Timestamp: \`$DEPLOYED_AT\`"
            [[ -z "$API_IMAGE" ]] || echo "- API: \`$API_IMAGE\`"
            [[ -z "$WEB_IMAGE" ]] || echo "- Web: \`$WEB_IMAGE\`"
            [[ -z "$WORKER_IMAGE" ]] || echo "- Worker: \`$WORKER_IMAGE\`"
            [[ -z "$MIGRATOR_IMAGE" ]] || echo "- Migrator: \`$MIGRATOR_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
