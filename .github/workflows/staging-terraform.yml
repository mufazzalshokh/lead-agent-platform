            "$(jq -r '(.settings.ipConfiguration.privateNetwork // "") | endswith("/global/networks/lead-agent-staging-vpc")' "$VERIFY_DIR/sql.json")"
          report "phase_b.encrypted_transport" "ENCRYPTED_ONLY" "$(jq -r '.settings.ipConfiguration.sslMode // "missing"' "$VERIFY_DIR/sql.json")"
          report "phase_b.backups_enabled" "true" "$(jq -r '.settings.backupConfiguration.enabled // false' "$VERIFY_DIR/sql.json")"
          report "phase_b.backup_start_time" "01:00" "$(jq -r '.settings.backupConfiguration.startTime // "missing"' "$VERIFY_DIR/sql.json")"
          report "phase_b.retained_backups" "7" "$(jq -r '.settings.backupConfiguration.backupRetentionSettings.retainedBackups // "missing"' "$VERIFY_DIR/sql.json")"
          report "phase_b.pitr_enabled" "true" "$(jq -r '.settings.backupConfiguration.pointInTimeRecoveryEnabled // false' "$VERIFY_DIR/sql.json")"
          report "phase_b.transaction_log_retention_days" "7" "$(jq -r '.settings.backupConfiguration.transactionLogRetentionDays // "missing"' "$VERIFY_DIR/sql.json")"
          report "phase_b.deletion_protection" "true" \
            "$(jq -r '(.settings.deletionProtectionEnabled // .deletionProtectionEnabled // false)' "$VERIFY_DIR/sql.json")"

          STATE_ADDRESSES="$(terraform state list 2> "$VERIFY_DIR/state-error.txt")"
          STATE_EXIT=$?
          report "phase_b.terraform_state_exit_code" "0" "$STATE_EXIT"
          STATE_COUNT="$(printf '%s\n' "$STATE_ADDRESSES" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          report "phase_b.terraform_state_count" "82" "$STATE_COUNT"
          report "phase_b.terraform_state_sql_entry_count" "1" \
            "$(grep -Fxc 'google_sql_database_instance.staging' <<< "$STATE_ADDRESSES" || true)"
          report "phase_b.terraform_state_alert_entry_count" "1" \
            "$(grep -Fxc 'google_monitoring_alert_policy.database_cpu' <<< "$STATE_ADDRESSES" || true)"

          VERIFIED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          VERIFIED_EPOCH="$(date -u +'%s')"
          CREATION_EPOCH="$(date -u -d "$PHASE_A_CREATION_COMPLETE_AT" +'%s')"
          ELAPSED_SECONDS="$((VERIFIED_EPOCH - CREATION_EPOCH))"
          ELAPSED_HOURS="$(awk -v seconds="$ELAPSED_SECONDS" 'BEGIN { printf "%.3f", seconds / 3600 }')"
          ACCRUED_COST="$(awk -v seconds="$ELAPSED_SECONDS" 'BEGIN { printf "%.6f", (seconds / 3600) * 0.01282877 }')"
          {
            echo "phase_b_apply_run_id=$GITHUB_RUN_ID"
            echo "phase_b_apply_verified_at=$VERIFIED_AT"
            echo "phase_b_compute_stopped_by_activation_policy=true"
            echo "phase_a_total_runnable_seconds=$ELAPSED_SECONDS"
            echo "phase_a_total_runnable_hours=$ELAPSED_HOURS"
            echo "phase_a_estimated_list_price_usd=$ACCRUED_COST"
            echo "phase_b_residual_cost=storage_backup_and_pitr_only"
            echo "promotional_credit=excluded_not_relied_upon"
            echo "phase_b_named_assertion_failures=$FAILURES"
          } | tee -a "$EVIDENCE"

          if (( FAILURES > 0 )); then
            echo "Phase B post-apply verification reported $FAILURES failure(s)." >&2
            exit 1
          fi

      - name: Verify Cloud SQL Phase B Terraform convergence
        if: env.S22_PHASE == 'cloud-sql-phase-b' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -uo pipefail
          set +e
          terraform plan -detailed-exitcode -lock-timeout=5m -out=s22-phase-b-convergence.tfplan
          PLAN_EXIT_CODE=$?
          set -e
          echo "phase_b_convergence_exit_code=$PLAN_EXIT_CODE" | tee -a s22-phase-b-apply-evidence.txt
          if [[ "$PLAN_EXIT_CODE" == "2" ]]; then
            terraform show -json s22-phase-b-convergence.tfplan \
              | jq -r '.resource_changes[]?
                       | select(.change.actions != ["no-op"])
                       | "unexpected_action=\(.change.actions | join(",")):\(.address)"' \
              | tee -a s22-phase-b-apply-evidence.txt
            exit 1
          fi
          [[ "$PLAN_EXIT_CODE" == "0" ]]
          rm -f s22-phase-b-convergence.tfplan

      - name: Upload Cloud SQL Phase B apply evidence
        if: env.S22_PHASE == 'cloud-sql-phase-b' && env.S22_ACTION == 'apply'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-cloud-sql-phase-b-apply-evidence-${{ github.run_id }}
          path: infra/deploy/gcp/staging/s22-phase-b-apply-evidence.txt
          if-no-files-found: error
          retention-days: 7

      - name: Verify reconciliation Phase A live state
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        env:
          EXPECTED_CHANNELS_JSON: ${{ vars.STAGING_MONITORING_NOTIFICATION_CHANNEL_IDS_JSON }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: me-central1
        shell: bash
        run: |
          set -euo pipefail
          INSPECT_DIR="$(mktemp -d)"
          trap 'rm -rf "$INSPECT_DIR"' EXIT
          SQL_INSTANCE=lead-agent-staging-postgres17

          STATE_ADDRESSES="$(terraform state list | sort)"
          STATE_COUNT="$(printf '%s\n' "$STATE_ADDRESSES" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          [[ "$STATE_COUNT" == "82" ]]
          grep -Fqx 'google_sql_database_instance.staging' <<< "$STATE_ADDRESSES"
          grep -Fqx 'google_monitoring_alert_policy.database_cpu' <<< "$STATE_ADDRESSES"

          gcloud sql instances describe "$SQL_INSTANCE" \
            --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/sql-instance.json"
          jq -e --arg project "$PROJECT_ID" --arg region "$REGION" '
            .name == "lead-agent-staging-postgres17"
              and .project == $project
              and .region == $region
              and .state == "RUNNABLE"
              and .databaseVersion == "POSTGRES_17"
              and .settings.edition == "ENTERPRISE"
              and .settings.tier == "db-f1-micro"
              and .settings.availabilityType == "ZONAL"
              and .settings.activationPolicy == "ALWAYS"
              and .settings.dataDiskType == "PD_SSD"
              and (.settings.dataDiskSizeGb | tonumber) == 10
              and .settings.storageAutoResize == true
              and (.settings.storageAutoResizeLimit | tonumber) == 20
              and .settings.deletionProtectionEnabled == true
              and .settings.backupConfiguration.enabled == true
              and .settings.backupConfiguration.startTime == "01:00"
              and .settings.backupConfiguration.pointInTimeRecoveryEnabled == true
              and (.settings.backupConfiguration.transactionLogRetentionDays | tonumber) == 7
              and (.settings.backupConfiguration.backupRetentionSettings.retainedBackups | tonumber) == 7
              and .settings.ipConfiguration.ipv4Enabled == false
              and .settings.ipConfiguration.enablePrivatePathForGoogleCloudServices == true
              and .settings.ipConfiguration.sslMode == "ENCRYPTED_ONLY"
              and (.settings.ipConfiguration.privateNetwork
                   | endswith("/global/networks/lead-agent-staging-vpc"))
              and ([.ipAddresses[]? | select(.type == "PRIVATE" and (.ipAddress | length) > 0)] | length) == 1
              and ([.ipAddresses[]? | select(.type == "PRIMARY")] | length) == 0
          ' "$INSPECT_DIR/sql-instance.json" > /dev/null

          gcloud sql instances list --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/sql-instances.json"
          jq -e '[.[] | select(.name == "lead-agent-staging-postgres17")] | length == 1' \
            "$INSPECT_DIR/sql-instances.json" > /dev/null
          gcloud sql operations list --instance="$SQL_INSTANCE" --project="$PROJECT_ID" \
            --filter='status!=DONE' --format=json > "$INSPECT_DIR/pending-operations.json"
          jq -e 'length == 0' "$INSPECT_DIR/pending-operations.json" > /dev/null

          gcloud services vpc-peerings list \
            --project="$PROJECT_ID" \
            --network=lead-agent-staging-vpc \
            --service=servicenetworking.googleapis.com \
            --format=json > "$INSPECT_DIR/peerings.json"
          jq -e 'length >= 1' "$INSPECT_DIR/peerings.json" > /dev/null

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://monitoring.googleapis.com/v3/projects/$PROJECT_ID/alertPolicies?pageSize=100" \
            > "$INSPECT_DIR/alerts.json"
          unset ACCESS_TOKEN
          jq -e --arg instance "$PROJECT_ID:$SQL_INSTANCE" --argjson expected "$EXPECTED_CHANNELS_JSON" '
            [.alertPolicies[]?
             | select(.displayName == "Lead Agent staging Cloud SQL CPU saturation")] as $policies
            | ($policies | length) == 1
              and ($expected | length) > 0
              and (($policies[0].notificationChannels // [] | sort) == ($expected | sort))
              and ([$policies[0].conditions[]?
                    | select(.conditionThreshold.filter
                             | contains("cloudsql.googleapis.com/database/cpu/utilization"))
                    | select(.conditionThreshold.filter | contains($instance))]
                   | length) == 1
          ' "$INSPECT_DIR/alerts.json" > /dev/null

          ELAPSED_SECONDS="$(( $(date -u +'%s') - S22_PHASE_A_STARTED_EPOCH ))"
          ESTIMATED_COST_USD="$(
            awk -v seconds="$ELAPSED_SECONDS" 'BEGIN { printf "%.6f", (seconds / 3600) * 0.01282877 }'
          )"
          {
            echo "project=$PROJECT_ID"
            echo "region=$REGION"
            echo "phase_a_started_at=$S22_PHASE_A_STARTED_AT"
            echo "phase_a_elapsed_seconds=$ELAPSED_SECONDS"
            echo "phase_a_estimated_list_price_usd=$ESTIMATED_COST_USD"
            echo "terraform_state_count=$STATE_COUNT"
            echo "cloud_sql_instance=$SQL_INSTANCE"
            echo "cloud_sql_status=RUNNABLE"
            echo "cloud_sql_private_ip_assigned=true"
            echo "cloud_sql_public_ipv4_enabled=false"
            echo "database_cpu_alert_present=true"
            echo "notification_channel_resolved=true"
            echo "private_service_access_present=true"
          } | tee s22-phase-a-evidence.txt

      - name: Verify reconciliation Phase A Terraform convergence
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          set +e
          terraform plan -detailed-exitcode -lock-timeout=5m
          POST_APPLY_PLAN_EXIT_CODE=$?
          set -e
          [[ "$POST_APPLY_PLAN_EXIT_CODE" == "0" ]]
          echo "phase_a_post_apply_plan_exit_code=$POST_APPLY_PLAN_EXIT_CODE" \
            | tee -a s22-phase-a-evidence.txt

      - name: Create and verify Cloud SQL Phase B dormant plan
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          PHASE_B_PLAN=s22-cloud-sql-phase-b.tfplan
          PHASE_B_JSON=s22-cloud-sql-phase-b.tfplan.json
          TF_VAR_cloud_sql_activation_policy=NEVER terraform plan \
            -lock-timeout=5m \
            -out="$PHASE_B_PLAN"
          sha256sum "$PHASE_B_PLAN" > "$PHASE_B_PLAN.sha256"
          terraform show -json "$PHASE_B_PLAN" > "$PHASE_B_JSON"

          jq -e --arg project "$TF_VAR_project_id" '.variables.project_id.value == $project' "$PHASE_B_JSON" > /dev/null
          jq -e --arg region "$TF_VAR_region" '.variables.region.value == $region' "$PHASE_B_JSON" > /dev/null
          jq -e '.variables.cloud_sql_activation_policy.value == "NEVER"' "$PHASE_B_JSON" > /dev/null
          jq -e '
            [.resource_changes[] | select(.change.actions != ["no-op"])] as $changes
            | ($changes | length) == 1
              and $changes[0].address == "google_sql_database_instance.staging"
              and $changes[0].change.actions == ["update"]
              and ($changes[0].change.replace_paths | length) == 0
              and $changes[0].change.before.settings[0].activation_policy == "ALWAYS"
              and $changes[0].change.after.settings[0].activation_policy == "NEVER"
              and (($changes[0].change.before
                    | .settings[0].activation_policy = "NEVER")
                   == $changes[0].change.after)
          ' "$PHASE_B_JSON" > /dev/null

          CREATE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["create"])] | length' "$PHASE_B_JSON")"
          CHANGE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["update"])] | length' "$PHASE_B_JSON")"
          DESTROY_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["delete"])] | length' "$PHASE_B_JSON")"
          REPLACE_COUNT="$(
            jq '[.resource_changes[]
                 | select(.change.actions == ["delete", "create"]
                          or .change.actions == ["create", "delete"])] | length' "$PHASE_B_JSON"
          )"
          [[ "$CREATE_COUNT" == "0" ]]
          [[ "$CHANGE_COUNT" == "1" ]]
          [[ "$DESTROY_COUNT" == "0" ]]
          [[ "$REPLACE_COUNT" == "0" ]]

          {
            echo "phase_b_source_commit=$S22_COMMIT_SHA"
            echo "phase_b_plan_sha256=$(awk '{print $1}' "$PHASE_B_PLAN.sha256")"
            echo "phase_b_plan_creates=$CREATE_COUNT"
            echo "phase_b_plan_changes=$CHANGE_COUNT"
            echo "phase_b_plan_destroys=$DESTROY_COUNT"
            echo "phase_b_plan_replacements=$REPLACE_COUNT"
            echo "phase_b_plan_action=update:google_sql_database_instance.staging"
            echo "phase_b_only_change=activation_policy_ALWAYS_to_NEVER"
          } | tee s22-phase-b-evidence.txt
          rm -f "$PHASE_B_JSON"

      - name: Upload exact Cloud SQL Phase B plan
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'apply'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-cloud-sql-phase-b-plan-${{ env.S22_COMMIT_SHA }}
          path: |
            infra/deploy/gcp/staging/s22-cloud-sql-phase-b.tfplan
            infra/deploy/gcp/staging/s22-cloud-sql-phase-b.tfplan.sha256
            infra/deploy/gcp/staging/s22-phase-a-evidence.txt
            infra/deploy/gcp/staging/s22-phase-b-evidence.txt
          if-no-files-found: error
          retention-days: 7

      - name: Verify foundation Terraform convergence
        if: env.S22_PHASE == 'foundation' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          FOUNDATION_STATE_COUNT="$(terraform state list | wc -l | tr -d '[:space:]')"
          [[ "$FOUNDATION_STATE_COUNT" == "81" ]]

          set +e
          terraform plan -detailed-exitcode -lock-timeout=5m
          POST_APPLY_PLAN_EXIT_CODE=$?
          set -e
          [[ "$POST_APPLY_PLAN_EXIT_CODE" == "0" ]]
          echo "Post-apply foundation managed resources: $FOUNDATION_STATE_COUNT"
          echo "Post-apply foundation plan exit code: $POST_APPLY_PLAN_EXIT_CODE"

      - name: Download exact owner-reviewed bootstrap IAM plan
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ env.S22_PLAN_RUN_ID }}
        shell: bash
        run: >-
          gh run download "$PLAN_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "s22-bootstrap-iam-plan-${{ env.S22_COMMIT_SHA }}"
          --dir infra/deploy/gcp/bootstrap

      - name: Verify exact bootstrap IAM plan approval boundary
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/bootstrap
        env:
          APPROVED_PLAN_SHA256: ${{ env.S22_APPROVED_PLAN_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          PLAN=s22-bootstrap-iam.tfplan
          PLAN_JSON=s22-bootstrap-iam.tfplan.json
          RECORDED_SHA256="$(awk '{print $1}' s22-bootstrap-iam.tfplan.sha256)"
          ACTUAL_SHA256="$(sha256sum "$PLAN" | awk '{print $1}')"
          [[ "$ACTUAL_SHA256" == "$RECORDED_SHA256" ]]
          [[ "$ACTUAL_SHA256" == "$APPROVED_PLAN_SHA256" ]]

          terraform show -json "$PLAN" > "$PLAN_JSON"
          jq -e --arg project "$TF_VAR_project_id" '.variables.project_id.value == $project' "$PLAN_JSON"

          ACTUAL_ACTIONS="$(
            jq -c '
              [.resource_changes[]
               | select(.change.actions != ["no-op"])
               | ((.change.actions | join(",")) + ":" + .address)]
              | sort
            ' "$PLAN_JSON"
          )"
          EXPECTED_ACTIONS='["create:google_project_iam_member.deployer[\"roles/monitoring.alertPolicyEditor\"]","create:google_project_iam_member.deployer[\"roles/monitoring.notificationChannelViewer\"]","create:google_project_iam_member.deployer[\"roles/servicenetworking.networksAdmin\"]","create:google_project_iam_member.deployer[\"roles/serviceusage.serviceUsageConsumer\"]","delete:google_project_iam_member.deployer[\"roles/iam.serviceAccountUser\"]","delete:google_project_iam_member.deployer[\"roles/logging.configWriter\"]","delete:google_project_iam_member.deployer[\"roles/monitoring.admin\"]","delete:google_project_iam_member.deployer[\"roles/serviceusage.serviceUsageAdmin\"]"]'
          [[ "$ACTUAL_ACTIONS" == "$EXPECTED_ACTIONS" ]]
          jq -e '
            [.resource_changes[] | select(.change.actions == ["create"])] | length == 4
          ' "$PLAN_JSON"
          jq -e '
            [.resource_changes[] | select(.change.actions == ["delete"])] | length == 4
          ' "$PLAN_JSON"
          jq -e '
            [.resource_changes[]
             | select(.change.actions != ["no-op"])
             | select(.type != "google_project_iam_member")]
            | length == 0
          ' "$PLAN_JSON"
          rm -f "$PLAN_JSON"

      - name: Apply exact reviewed bootstrap IAM plan
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/bootstrap
        run: terraform apply -lock-timeout=5m -auto-approve s22-bootstrap-iam.tfplan

      - name: Verify bootstrap IAM convergence
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          STATE_ADDRESSES="$(terraform state list)"
          STATE_COUNT="$(printf '%s\n' "$STATE_ADDRESSES" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          [[ "$STATE_COUNT" == "34" ]]

          for address in \
            'google_service_account.deployer' \
            'google_iam_workload_identity_pool.github' \
            'google_iam_workload_identity_pool_provider.github' \
            'google_storage_bucket.terraform_state' \
            'google_storage_bucket_iam_member.deployer_state' \
            'google_billing_account_iam_member.deployer_budget'
          do
            grep -Fqx -- "$address" <<< "$STATE_ADDRESSES"
          done

          for address in \
            'google_project_iam_member.deployer["roles/monitoring.alertPolicyEditor"]' \
            'google_project_iam_member.deployer["roles/monitoring.notificationChannelViewer"]' \
            'google_project_iam_member.deployer["roles/servicenetworking.networksAdmin"]' \
            'google_project_iam_member.deployer["roles/serviceusage.serviceUsageConsumer"]'
          do
            grep -Fqx -- "$address" <<< "$STATE_ADDRESSES"
          done

          for address in \
            'google_project_iam_member.deployer["roles/iam.serviceAccountUser"]' \
            'google_project_iam_member.deployer["roles/logging.configWriter"]' \
            'google_project_iam_member.deployer["roles/monitoring.admin"]' \
            'google_project_iam_member.deployer["roles/serviceusage.serviceUsageAdmin"]'
          do
            if grep -Fqx -- "$address" <<< "$STATE_ADDRESSES"; then
              echo "Removed IAM role remains in authoritative state: $address" >&2
              exit 1
            fi
          done

          set +e
          terraform plan \
            -target=google_project_iam_member.deployer \
            -detailed-exitcode \
            -lock-timeout=5m
          POST_APPLY_IAM_PLAN_EXIT_CODE=$?
          set -e
          [[ "$POST_APPLY_IAM_PLAN_EXIT_CODE" == "0" ]]

          set +e
          terraform plan -refresh=false -detailed-exitcode -lock-timeout=5m
          POST_APPLY_PLAN_EXIT_CODE=$?
          set -e
          [[ "$POST_APPLY_PLAN_EXIT_CODE" == "0" ]]
          echo "Post-apply bootstrap managed resources: $STATE_COUNT"
          echo "Post-apply live IAM plan exit code: $POST_APPLY_IAM_PLAN_EXIT_CODE"
          echo "Post-apply bootstrap plan exit code: $POST_APPLY_PLAN_EXIT_CODE"

      - name: Set up Google Cloud CLI
        if: env.S22_ACTION == 'apply' && (env.S22_PHASE == 'foundation' || env.S22_PHASE == 'migration')
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify actual foundation resources
        if: env.S22_PHASE == 'foundation' && env.S22_ACTION == 'apply'
        env:
          BILLING_ACCOUNT_ID: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          MONITORING_CHANNELS_JSON: ${{ vars.STAGING_MONITORING_NOTIFICATION_CHANNEL_IDS_JSON }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: me-central1
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT

          gcloud compute networks describe lead-agent-staging-vpc \
            --project="$PROJECT_ID" --format=json > "$VERIFY_DIR/network.json"
          jq -e '.name == "lead-agent-staging-vpc" and .autoCreateSubnetworks == false' \
            "$VERIFY_DIR/network.json"

          gcloud compute networks subnets describe lead-agent-staging-cloud-run \
            --project="$PROJECT_ID" --region="$REGION" --format=json > "$VERIFY_DIR/subnet.json"
          jq -e '
            .name == "lead-agent-staging-cloud-run"
            and (.region | endswith("/me-central1"))
          ' "$VERIFY_DIR/subnet.json"
          jq -e '.ipCidrRange == "10.22.0.0/24" and .privateIpGoogleAccess == true' \
            "$VERIFY_DIR/subnet.json"

          gcloud compute addresses describe lead-agent-staging-private-services \
            --global --project="$PROJECT_ID" --format=json > "$VERIFY_DIR/private-range.json"
          jq -e '.addressType == "INTERNAL" and .purpose == "VPC_PEERING"' \
            "$VERIFY_DIR/private-range.json"

          gcloud services vpc-peerings list \
            --project="$PROJECT_ID" \
            --network=lead-agent-staging-vpc \
            --service=servicenetworking.googleapis.com \
            --format=json > "$VERIFY_DIR/peerings.json"
          jq -e 'length >= 1' "$VERIFY_DIR/peerings.json"

          gcloud sql instances describe lead-agent-staging-postgres17 \
            --project="$PROJECT_ID" --format=json > "$VERIFY_DIR/sql.json"
          jq -e '
            .databaseVersion == "POSTGRES_17"
            and .settings.edition == "ENTERPRISE"
            and .settings.tier == "db-f1-micro"
            and .settings.availabilityType == "ZONAL"
            and .settings.dataDiskType == "PD_SSD"
            and (.settings.dataDiskSizeGb | tonumber) == 10
            and (.settings.storageAutoResizeLimit | tonumber) == 20
            and .settings.activationPolicy == "NEVER"
            and .settings.ipConfiguration.ipv4Enabled == false
            and .settings.ipConfiguration.sslMode == "ENCRYPTED_ONLY"
            and .settings.backupConfiguration.enabled == true
            and .settings.backupConfiguration.pointInTimeRecoveryEnabled == true
            and .settings.backupConfiguration.transactionLogRetentionDays == 7
            and ((.settings.deletionProtectionEnabled // .deletionProtectionEnabled) == true)
            and ([.ipAddresses[] | select(.type == "PRIVATE")] | length) >= 1
            and ([.ipAddresses[] | select(.type != "PRIVATE")] | length) == 0
          ' "$VERIFY_DIR/sql.json"

          gcloud artifacts repositories describe lead-agent \
            --project="$PROJECT_ID" --location="$REGION" --format=json > "$VERIFY_DIR/artifact.json"
          jq -e '.format == "DOCKER" and (.name | endswith("/repositories/lead-agent"))' \
            "$VERIFY_DIR/artifact.json"
          gcloud artifacts docker images list \
            "$REGION-docker.pkg.dev/$PROJECT_ID/lead-agent" \
            --format=json > "$VERIFY_DIR/images.json"
          jq -e 'length == 0' "$VERIFY_DIR/images.json"

          SECRETS=(
            lead-agent-staging-auth0-client-secret
            lead-agent-staging-auth-browser-envelope-key
            lead-agent-staging-auth-database-url
            lead-agent-staging-channel-credentials
            lead-agent-staging-customer-data-encryption-key
            lead-agent-staging-customer-data-lookup-key
            lead-agent-staging-gemini-api-key
            lead-agent-staging-ingress-database-url
            lead-agent-staging-instagram-app-secret
            lead-agent-staging-instagram-webhook-verify-token
            lead-agent-staging-invitation-target-encryption-key
            lead-agent-staging-invitation-target-lookup-key
            lead-agent-staging-migration-database-url
            lead-agent-staging-queue-database-url
            lead-agent-staging-runtime-database-url
            lead-agent-staging-telegram-bot-token
            lead-agent-staging-telegram-webhook-secret
            lead-agent-staging-widget-exchange-encryption-key
            lead-agent-staging-widget-signing-key
          )
          SECRET_VERSION_COUNT=0
          for secret in "${SECRETS[@]}"; do
            gcloud secrets describe "$secret" --project="$PROJECT_ID" --format=json > /dev/null
            VERSION_COUNT="$(
              gcloud secrets versions list "$secret" \
                --project="$PROJECT_ID" --format=json \
                | jq 'length'
            )"
            SECRET_VERSION_COUNT=$((SECRET_VERSION_COUNT + VERSION_COUNT))
          done
          [[ "${#SECRETS[@]}" == "19" ]]
          [[ "$SECRET_VERSION_COUNT" == "0" ]]

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://monitoring.googleapis.com/v3/projects/$PROJECT_ID/alertPolicies?pageSize=100" \
            > "$VERIFY_DIR/alerts.json"
          jq -e '
            [.alertPolicies[]
             | select(.displayName == "Lead Agent staging API server errors"
                      or .displayName == "Lead Agent staging Cloud SQL CPU saturation")]
            | length == 2
          ' "$VERIFY_DIR/alerts.json"
          while IFS= read -r channel; do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              "https://monitoring.googleapis.com/v3/$channel" > /dev/null
          done < <(jq -r '.[]' <<< "$MONITORING_CHANNELS_JSON")

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://billingbudgets.googleapis.com/v1/billingAccounts/$BILLING_ACCOUNT_ID/budgets?pageSize=100" \
            > "$VERIFY_DIR/budgets.json"
          jq -e '
            [.budgets[]
             | select(.displayName == "Lead Agent S22 staging USD 25 target"
                      or .displayName == "Lead Agent S22 staging USD 50 hard ceiling")]
            | length == 2
          ' "$VERIFY_DIR/budgets.json"

          PROJECT_POLICY="$VERIFY_DIR/project-policy.json"
          gcloud projects get-iam-policy "$PROJECT_ID" --format=json > "$PROJECT_POLICY"
          jq -e --arg member "serviceAccount:$DEPLOYER_SERVICE_ACCOUNT" '
            [.bindings[]
             | select(.role == "roles/iam.serviceAccountUser")
             | .members[]?
             | select(. == $member)]
            | length == 0
          ' "$PROJECT_POLICY"

          RUNTIME_IDENTITIES=(
            lead-agent-staging-api
            lead-agent-staging-web
            lead-agent-staging-worker
            lead-agent-staging-migrator
          )
          for identity in "${RUNTIME_IDENTITIES[@]}"; do
            email="$identity@$PROJECT_ID.iam.gserviceaccount.com"
            gcloud iam service-accounts describe "$email" \
              --project="$PROJECT_ID" --format=json > /dev/null
            gcloud iam service-accounts get-iam-policy "$email" \
              --project="$PROJECT_ID" --format=json > "$VERIFY_DIR/$identity-policy.json"
            jq -e --arg member "serviceAccount:$DEPLOYER_SERVICE_ACCOUNT" '
              [.bindings[]
               | select(.role == "roles/iam.serviceAccountUser")
               | .members[]?
               | select(. == $member)]
              | length == 1
            ' "$VERIFY_DIR/$identity-policy.json"
          done

          gcloud run services list --project="$PROJECT_ID" --region="$REGION" \
            --platform=managed --format=json > "$VERIFY_DIR/run-services.json"
          gcloud run jobs list --project="$PROJECT_ID" --region="$REGION" \
            --format=json > "$VERIFY_DIR/run-jobs.json"
          jq -e 'length == 0' "$VERIFY_DIR/run-services.json"
          jq -e 'length == 0' "$VERIFY_DIR/run-jobs.json"

          SQL_STATE="$(jq -r '.state' "$VERIFY_DIR/sql.json")"
          SQL_PRIVATE_IP="$(jq -r '[.ipAddresses[] | select(.type == "PRIVATE")][0].ipAddress' "$VERIFY_DIR/sql.json")"
          echo "Verified VPC: lead-agent-staging-vpc"
          echo "Verified subnet: lead-agent-staging-cloud-run"
          echo "Verified Cloud SQL state: $SQL_STATE"
          echo "Verified Cloud SQL private IP assigned: $([[ -n "$SQL_PRIVATE_IP" && "$SQL_PRIVATE_IP" != "null" ]] && echo true || echo false)"
          echo "Verified Artifact Registry repositories: 1; images: 0"
          echo "Verified Secret Manager resources: ${#SECRETS[@]}; versions: $SECRET_VERSION_COUNT"
          echo "Verified alert policies: 2; budgets: 2"
          echo "Verified runtime identities: ${#RUNTIME_IDENTITIES[@]}"
          echo "Verified Cloud Run services: 0; jobs: 0"

      - name: Execute one-shot migrator
        if: github.event_name == 'workflow_dispatch' && env.S22_ACTION == 'apply' && env.S22_PHASE == 'migration'
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        run: >-
          gcloud run jobs execute lead-agent-staging-migrator
          --project="${{ vars.GCP_PROJECT_ID }}"
          --region=me-central1
          --wait

      - name: Record deployment provenance
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_PHASE != 'foundation' && env.S22_PHASE != 'cloud-sql-phase-b' && env.S22_ACTION == 'apply'
        env:
          API_IMAGE: ${{ inputs.api_image }}
          DEPLOYED_AT: ${{ inputs.deployment_timestamp }}
          MIGRATOR_IMAGE: ${{ inputs.migrator_image }}
          PHASE: ${{ env.S22_PHASE }}
          REQUESTED_SHA: ${{ env.S22_COMMIT_SHA }}
          WEB_IMAGE: ${{ inputs.web_image }}
          WORKER_IMAGE: ${{ inputs.worker_image }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## S22 staging deployment"
            echo "- Environment: staging"
            echo "- Region: me-central1"
            echo "- Phase: $PHASE"
            echo "- Commit: \`$REQUESTED_SHA\`"
            echo "- Migration head: \`0029_s21_thread_automation_controls\`"
            echo "- Timestamp: \`$DEPLOYED_AT\`"
            [[ -z "$API_IMAGE" ]] || echo "- API: \`$API_IMAGE\`"
            [[ -z "$WEB_IMAGE" ]] || echo "- Web: \`$WEB_IMAGE\`"
            [[ -z "$WORKER_IMAGE" ]] || echo "- Worker: \`$WORKER_IMAGE\`"
            [[ -z "$MIGRATOR_IMAGE" ]] || echo "- Migrator: \`$MIGRATOR_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
