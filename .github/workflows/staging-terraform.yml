                   | endswith("/global/networks/lead-agent-staging-vpc"))
          ' "$PLAN_JSON" > /dev/null
          rm -f "$PLAN_JSON"

      - name: Verify authoritative reconciliation state before apply
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          INSPECT_DIR="$(mktemp -d)"
          trap 'rm -rf "$INSPECT_DIR"' EXIT
          STATE_ADDRESSES="$(terraform state list | sort)"
          STATE_COUNT="$(printf '%s\n' "$STATE_ADDRESSES" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          [[ "$STATE_COUNT" == "80" ]]
          ! grep -Fqx 'google_sql_database_instance.staging' <<< "$STATE_ADDRESSES"
          ! grep -Fqx 'google_monitoring_alert_policy.database_cpu' <<< "$STATE_ADDRESSES"

          gcloud sql instances list --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/sql-instances.json"
          jq -e '[.[] | select(.name == "lead-agent-staging-postgres17")] | length == 0' \
            "$INSPECT_DIR/sql-instances.json" > /dev/null

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://monitoring.googleapis.com/v3/projects/$PROJECT_ID/alertPolicies?pageSize=100" \
            > "$INSPECT_DIR/alerts.json"
          unset ACCESS_TOKEN
          jq -e '[.alertPolicies[]? | select(.displayName == "Lead Agent staging Cloud SQL CPU saturation")] | length == 0' \
            "$INSPECT_DIR/alerts.json" > /dev/null
          echo "Authoritative reconciliation state is unchanged at $STATE_COUNT entries."

      - name: Record Phase A apply start
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'apply'
        shell: bash
        run: |
          echo "S22_PHASE_A_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "S22_PHASE_A_STARTED_EPOCH=$(date -u +'%s')" >> "$GITHUB_ENV"

      - name: Verify exact foundation plan approval boundary
        if: env.S22_PHASE == 'foundation' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        env:
          APPROVED_PLAN_SHA256: ${{ env.S22_APPROVED_PLAN_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          PLAN=s22.tfplan
          PLAN_JSON=s22.tfplan.json
          RECORDED_SHA256="$(awk '{print $1}' s22.tfplan.sha256)"
          ACTUAL_SHA256="$(sha256sum "$PLAN" | awk '{print $1}')"
          [[ "$ACTUAL_SHA256" == "$RECORDED_SHA256" ]]
          [[ "$ACTUAL_SHA256" == "$APPROVED_PLAN_SHA256" ]]

          terraform show -json "$PLAN" > "$PLAN_JSON"
          jq -e --arg project "$TF_VAR_project_id" '.variables.project_id.value == $project' "$PLAN_JSON"
          jq -e --arg region "$TF_VAR_region" '.variables.region.value == $region' "$PLAN_JSON"
          jq -e '
            [.resource_changes[] | select(.change.actions != ["no-op"])] as $changes
            | ($changes | length) == 81
              and ([$changes[] | select(.change.actions != ["create"])] | length) == 0
          ' "$PLAN_JSON"

          ACTUAL_TYPE_COUNTS="$(
            jq -c '
              [.resource_changes[]
               | select(.change.actions != ["no-op"])
               | .type]
              | sort
              | group_by(.)
              | map({(.[0]): length})
              | add
            ' "$PLAN_JSON"
          )"
          EXPECTED_TYPE_COUNTS='{"google_artifact_registry_repository":1,"google_billing_budget":2,"google_compute_global_address":1,"google_compute_network":1,"google_compute_subnetwork":1,"google_monitoring_alert_policy":2,"google_project_iam_member":11,"google_secret_manager_secret":19,"google_secret_manager_secret_iam_member":33,"google_service_account":4,"google_service_account_iam_member":4,"google_service_networking_connection":1,"google_sql_database_instance":1}'
          [[ "$ACTUAL_TYPE_COUNTS" == "$EXPECTED_TYPE_COUNTS" ]]

          jq -e '
            [.resource_changes[]
             | select(.type == "google_sql_database_instance")
             | .change.after]
            | length == 1
              and .[0].name == "lead-agent-staging-postgres17"
              and .[0].database_version == "POSTGRES_17"
              and .[0].deletion_protection == true
              and .[0].settings[0].edition == "ENTERPRISE"
              and .[0].settings[0].tier == "db-f1-micro"
              and .[0].settings[0].availability_type == "ZONAL"
              and .[0].settings[0].disk_type == "PD_SSD"
              and .[0].settings[0].disk_size == 10
              and .[0].settings[0].disk_autoresize_limit == 20
              and .[0].settings[0].activation_policy == "NEVER"
              and .[0].settings[0].ip_configuration[0].ipv4_enabled == false
              and .[0].settings[0].ip_configuration[0].ssl_mode == "ENCRYPTED_ONLY"
              and .[0].settings[0].backup_configuration[0].enabled == true
              and .[0].settings[0].backup_configuration[0].point_in_time_recovery_enabled == true
              and .[0].settings[0].backup_configuration[0].transaction_log_retention_days == 7
          ' "$PLAN_JSON"
          jq -e '
            [.resource_changes[]
             | select(.type == "google_sql_database_instance")
             | .change.after_unknown.settings[0].ip_configuration[0].private_network]
            | length == 1 and .[0] == true
          ' "$PLAN_JSON"
          jq -e '
            [.resource_changes[]
             | select(.type == "google_project_iam_member")
             | select(.change.after.role == "roles/iam.serviceAccountUser")]
            | length == 0
          ' "$PLAN_JSON"
          jq -e '
            [.resource_changes[]
             | select(.type == "google_service_account_iam_member")
             | select(.change.after.role == "roles/iam.serviceAccountUser")]
            | length == 4
          ' "$PLAN_JSON"
          rm -f "$PLAN_JSON"

      - name: Apply exact reviewed plan
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_PHASE != 'bootstrap-log-viewer' && env.S22_PHASE != 'cloud-sql-phase-b' && env.S22_PHASE != 'migration-resume' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        run: terraform apply -lock-timeout=5m -auto-approve s22.tfplan

      - name: Verify migrator image update live state and convergence
        if: env.S22_PHASE == 'migrator-image-update' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          LIVE_JOB="$(mktemp)"
          trap 'rm -f "$LIVE_JOB"' EXIT
          gcloud run jobs describe lead-agent-staging-migrator \
            --project="$PROJECT_ID" \
            --region=me-central1 \
            --format=json > "$LIVE_JOB"
          jq -e \
            --arg commit "$S22_COMMIT_SHA" \
            --arg image "$TF_VAR_migrator_image" \
            --arg timestamp "$TF_VAR_migrator_deployment_timestamp" '
            .template.template.serviceAccount == "lead-agent-staging-migrator@lead-agent-stg-739284.iam.gserviceaccount.com"
              and .template.template.containers[0].image == $image
              and .template.template.containers[0].command == ["node"]
              and .template.template.containers[0].args == ["dist/index.js"]
              and (.template.template.vpcAccess.networkInterfaces[0].network | endswith("/networks/lead-agent-staging-vpc"))
              and (.template.template.vpcAccess.networkInterfaces[0].subnetwork | endswith("/subnetworks/lead-agent-staging-cloud-run"))
              and .template.template.vpcAccess.egress == "PRIVATE_RANGES_ONLY"
              and any(.template.template.containers[0].env[]; .name == "DEPLOYMENT_GIT_SHA" and .value == $commit)
              and any(.template.template.containers[0].env[]; .name == "DEPLOYMENT_TIMESTAMP" and .value == $timestamp)
              and any(.template.template.containers[0].env[]; .name == "DEPLOYMENT_IMAGE_DIGEST" and .value == $image)
              and ([.template.template.containers[0].env[] | select(.valueSource.secretKeyRef != null)] | length) == 5
              and all(.template.template.containers[0].env[] | select(.valueSource.secretKeyRef != null); .valueSource.secretKeyRef.version == "latest")
          ' "$LIVE_JOB" > /dev/null

          STATE_COUNT="$(terraform state list | wc -l | tr -d '[:space:]')"
          [[ "$STATE_COUNT" == "88" ]]
          set +e
          terraform plan -detailed-exitcode -lock-timeout=5m > /dev/null
          PLAN_EXIT_CODE=$?
          set -e
          [[ "$PLAN_EXIT_CODE" == "0" ]]

          {
            echo "migrator_image_update_commit=$S22_COMMIT_SHA"
            echo "migrator_image_update_digest=${TF_VAR_migrator_image##*@}"
            echo "migrator_image_update_live_state=PASS"
            echo "migrator_image_update_network_unchanged=PASS"
            echo "migrator_image_update_secret_references_unchanged=PASS"
            echo "migrator_image_update_state_count=$STATE_COUNT"
            echo "migrator_image_update_convergence_exit_code=$PLAN_EXIT_CODE"
          } | tee s22-migrator-image-apply-evidence.txt

      - name: Upload migrator image update evidence
        if: always() && env.S22_PHASE == 'migrator-image-update' && env.S22_ACTION == 'apply'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-migrator-image-apply-evidence-${{ github.run_id }}
          path: infra/deploy/gcp/staging/s22-migrator-image-apply-evidence.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Cloud SQL start live state and empty database secrets
        if: env.S22_PHASE == 'cloud-sql-start' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        env:
          PROJECT_ID: lead-agent-stg-739284
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          EVIDENCE=s22-cloud-sql-start-apply-evidence.txt
          SQL_INSTANCE=lead-agent-staging-postgres17

          for attempt in $(seq 1 60); do
            gcloud sql instances describe "$SQL_INSTANCE" \
              --project="$PROJECT_ID" --format=json > "$VERIFY_DIR/sql.json"
            [[ "$(jq -r '.state // "missing"' "$VERIFY_DIR/sql.json")" == "RUNNABLE" ]] && break
            sleep 10
          done

          jq -e '
            .name == "lead-agent-staging-postgres17"
              and .state == "RUNNABLE"
              and .databaseVersion == "POSTGRES_17"
              and .settings.edition == "ENTERPRISE"
              and .settings.tier == "db-f1-micro"
              and .settings.availabilityType == "ZONAL"
              and .settings.activationPolicy == "ALWAYS"
              and .settings.dataDiskType == "PD_SSD"
              and (.settings.dataDiskSizeGb | tonumber) == 10
              and .settings.storageAutoResize == true
              and (.settings.storageAutoResizeLimit | tonumber) == 20
              and .settings.ipConfiguration.ipv4Enabled == false
              and .settings.ipConfiguration.sslMode == "ENCRYPTED_ONLY"
              and (.settings.ipConfiguration.privateNetwork | endswith("/global/networks/lead-agent-staging-vpc"))
              and ([.ipAddresses[]? | select(.type == "PRIVATE" and (.ipAddress | length) > 0)] | length) == 1
              and ([.ipAddresses[]? | select(.type != "PRIVATE")] | length) == 0
              and .settings.backupConfiguration.enabled == true
              and .settings.backupConfiguration.startTime == "01:00"
              and .settings.backupConfiguration.pointInTimeRecoveryEnabled == true
              and .settings.backupConfiguration.transactionLogRetentionDays == 7
              and (.settings.backupConfiguration.backupRetentionSettings.retainedBackups | tonumber) == 7
              and ((.settings.deletionProtectionEnabled // .deletionProtectionEnabled) == true)
          ' "$VERIFY_DIR/sql.json" > /dev/null

          DATABASE_SECRETS=(
            lead-agent-staging-migration-database-url
            lead-agent-staging-runtime-database-url
            lead-agent-staging-auth-database-url
            lead-agent-staging-ingress-database-url
            lead-agent-staging-queue-database-url
          )
          for secret in "${DATABASE_SECRETS[@]}"; do
            gcloud secrets describe "$secret" --project="$PROJECT_ID" --format='value(name)' > /dev/null
            ENABLED_COUNT="$(
              gcloud secrets versions list "$secret" \
                --project="$PROJECT_ID" --filter='state=ENABLED' --format='value(name)' \
                | sed '/^$/d' | wc -l | tr -d '[:space:]'
            )"
            [[ "$ENABLED_COUNT" == "0" ]]
          done

          {
            echo "cloud_sql_start_apply_run_id=$GITHUB_RUN_ID"
            echo "cloud_sql_start_instance=$SQL_INSTANCE"
            echo "cloud_sql_start_state=RUNNABLE"
            echo "cloud_sql_start_activation_policy=ALWAYS"
            echo "cloud_sql_start_database_version=POSTGRES_17"
            echo "cloud_sql_start_tier=db-f1-micro"
            echo "cloud_sql_start_private_ip_only=true"
            echo "cloud_sql_start_backups_and_pitr_unchanged=true"
            echo "cloud_sql_start_deletion_protection_unchanged=true"
            echo "cloud_sql_start_database_secret_containers=5"
            echo "cloud_sql_start_enabled_database_secret_versions=0"
            echo "cloud_sql_start_unrelated_infrastructure_changes=NONE"
          } | tee -a "$EVIDENCE"

      - name: Verify Cloud SQL start Terraform convergence
        if: env.S22_PHASE == 'cloud-sql-start' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set +e
          terraform plan -lock-timeout=5m -detailed-exitcode
          PLAN_EXIT_CODE=$?
          set -e
          echo "cloud_sql_start_convergence_exit_code=$PLAN_EXIT_CODE" | tee -a s22-cloud-sql-start-apply-evidence.txt
          [[ "$PLAN_EXIT_CODE" == "0" ]]

      - name: Upload Cloud SQL start apply evidence
        if: always() && env.S22_PHASE == 'cloud-sql-start' && env.S22_ACTION == 'apply'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-cloud-sql-start-apply-evidence-${{ github.run_id }}
          path: infra/deploy/gcp/staging/s22-cloud-sql-start-apply-evidence.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Verify health-only runtime live state
        if: env.S22_PHASE == 'bootstrap' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        env:
          API_IMAGE: me-central1-docker.pkg.dev/lead-agent-stg-739284/lead-agent/api@sha256:a19da09bda3b113f00d92ef2e245e8622505b340592b72c2dbb465dc05aafdcf
          PROJECT_ID: lead-agent-stg-739284
          REGION: me-central1
          WEB_IMAGE: me-central1-docker.pkg.dev/lead-agent-stg-739284/lead-agent/web@sha256:79560082659204911e1c306ca41ce72e83b1f6a4b9975e91a84d89a477a4f93d
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          EVIDENCE=s22-health-only-apply-evidence.txt
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          RUN_BASE="https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/$REGION"
          SQL_URL="https://sqladmin.googleapis.com/sql/v1beta4/projects/$PROJECT_ID/instances/lead-agent-staging-postgres17"
          FAILURES=0

          report() {
            local name="$1"
            local expected="$2"
            local observed="$3"
            local result=FAIL
            if [[ "$observed" == "$expected" ]]; then
              result=PASS
            else
              FAILURES=$((FAILURES + 1))
            fi
            printf 'ASSERTION|%s|%s|expected=%s|observed=%s\n' \
              "$name" "$result" "$expected" "$observed" | tee -a "$EVIDENCE"
          }

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "$RUN_BASE/services/lead-agent-staging-api" > "$VERIFY_DIR/api.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "$RUN_BASE/services/lead-agent-staging-web" > "$VERIFY_DIR/web.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "$RUN_BASE/services" > "$VERIFY_DIR/services.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "$RUN_BASE/jobs" > "$VERIFY_DIR/jobs.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "$RUN_BASE/workerPools" > "$VERIFY_DIR/worker-pools.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "$SQL_URL" > "$VERIFY_DIR/sql.json"

          report "health.services.count" "2" "$(jq '(.services // []) | length' "$VERIFY_DIR/services.json")"
          report "health.jobs.count" "0" "$(jq '(.jobs // []) | length' "$VERIFY_DIR/jobs.json")"
          report "health.worker_pools.count" "0" "$(jq '(.workerPools // []) | length' "$VERIFY_DIR/worker-pools.json")"

          verify_service() {
            local file="$1"
            local prefix="$2"
            local name="$3"
            local image="$4"
            local identity="$5"
            local concurrency="$6"
            local tag="$7"

            report "$prefix.name" "projects/$PROJECT_ID/locations/$REGION/services/$name" "$(jq -r '.name // "missing"' "$file")"
            report "$prefix.image" "$image" "$(jq -r '.template.containers[0].image // "missing"' "$file")"
            report "$prefix.identity" "$identity" "$(jq -r '.template.serviceAccount // "missing"' "$file")"
            report "$prefix.min_instances" "0" "$(jq -r '.template.scaling.minInstanceCount // 0' "$file")"
            report "$prefix.max_instances" "1" "$(jq -r '.template.scaling.maxInstanceCount // "missing"' "$file")"
            report "$prefix.concurrency" "$concurrency" "$(jq -r '.template.maxInstanceRequestConcurrency // "missing"' "$file")"
            report "$prefix.cpu" "1" "$(jq -r '.template.containers[0].resources.limits.cpu // "missing"' "$file")"
            report "$prefix.memory" "512Mi" "$(jq -r '.template.containers[0].resources.limits.memory // "missing"' "$file")"
            report "$prefix.timeout" "60s" "$(jq -r '.template.timeout // "missing"' "$file")"
            report "$prefix.ingress" "INGRESS_TRAFFIC_ALL" "$(jq -r '.ingress // "missing"' "$file")"
            report "$prefix.vpc_egress" "PRIVATE_RANGES_ONLY" "$(jq -r '.template.vpcAccess.egress // "missing"' "$file")"
            report "$prefix.vpc_network" "projects/$PROJECT_ID/global/networks/lead-agent-staging-vpc" "$(jq -r '.template.vpcAccess.networkInterfaces[0].network // "missing"' "$file")"
            report "$prefix.vpc_subnet" "projects/$PROJECT_ID/regions/$REGION/subnetworks/lead-agent-staging-cloud-run" "$(jq -r '.template.vpcAccess.networkInterfaces[0].subnetwork // "missing"' "$file")"
            report "$prefix.vpc_tag" "$tag" "$(jq -r '.template.vpcAccess.networkInterfaces[0].tags[0] // "missing"' "$file")"
            report "$prefix.secret_env_count" "0" "$(jq '(.template.containers[0].env // []) | length' "$file")"
            report "$prefix.command" "node" "$(jq -r '.template.containers[0].command[0] // "missing"' "$file")"
            report "$prefix.uri_present" "true" "$(jq -r '(.uri // "") | startswith("https://")' "$file")"
          }

          verify_service "$VERIFY_DIR/api.json" health.api lead-agent-staging-api "$API_IMAGE" \
            "lead-agent-staging-api@$PROJECT_ID.iam.gserviceaccount.com" 40 lead-agent-api
          verify_service "$VERIFY_DIR/web.json" health.web lead-agent-staging-web "$WEB_IMAGE" \
            "lead-agent-staging-web@$PROJECT_ID.iam.gserviceaccount.com" 80 lead-agent-web

          for service in api web; do
            gcloud run services get-iam-policy "lead-agent-staging-$service" \
              --project="$PROJECT_ID" --region="$REGION" --format=json \
              > "$VERIFY_DIR/$service-iam.json"
            report "health.$service.public_invoker" "1" \
              "$(jq '[.bindings[]? | select(.role == "roles/run.invoker") | .members[]? | select(. == "allUsers")] | length' "$VERIFY_DIR/$service-iam.json")"
          done

          API_URL="$(jq -r '.uri' "$VERIFY_DIR/api.json")"
          WEB_URL="$(jq -r '.uri' "$VERIFY_DIR/web.json")"
          API_RESPONSE="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$API_URL/")"
          WEB_RESPONSE="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 "$WEB_URL/")"
          report "health.api.response" "ok" "$API_RESPONSE"
          report "health.web.response" "ok" "$WEB_RESPONSE"
          report "health.cloud_sql.activation_policy" "NEVER" "$(jq -r '.settings.activationPolicy // "missing"' "$VERIFY_DIR/sql.json")"

          SECRET_VERSION_COUNT=0
          while IFS= read -r secret_name; do
            count="$(gcloud secrets versions list "$secret_name" \
              --project="$PROJECT_ID" --filter='state:ENABLED OR state:DISABLED OR state:DESTROYED' \
              --format='value(name)' | wc -l | tr -d ' ')"
            SECRET_VERSION_COUNT=$((SECRET_VERSION_COUNT + count))
          done < <(gcloud secrets list --project="$PROJECT_ID" \
            --filter='labels.environment=staging' --format='value(name)')
          report "health.secret_versions" "0" "$SECRET_VERSION_COUNT"

          STATE_COUNT="$(terraform state list | wc -l | tr -d ' ')"
          report "health.terraform_state_count" "86" "$STATE_COUNT"
          report "health.worker_state_count" "0" "$(terraform state list | grep -c '^google_cloud_run_v2_worker_pool.worker' || true)"
          report "health.migrator_state_count" "0" "$(terraform state list | grep -c '^google_cloud_run_v2_job.migrator' || true)"

          {
            echo "health_only_apply_run_id=$GITHUB_RUN_ID"
            echo "health_only_applied_plan_sha256=$S22_APPROVED_PLAN_SHA256"
            echo "health_only_apply_creates=4"
            echo "health_only_apply_changes=0"
            echo "health_only_apply_destroys=0"
            echo "health_only_apply_replacements=0"
            echo "health_only_api_url=$API_URL"
            echo "health_only_web_url=$WEB_URL"
            echo "health_only_cloud_sql_policy=NEVER"
            echo "health_only_secret_versions=$SECRET_VERSION_COUNT"
            echo "health_only_named_assertion_failures=$FAILURES"
          } | tee -a "$EVIDENCE"

          [[ "$FAILURES" == "0" ]]

      - name: Verify health-only runtime Terraform convergence
        if: env.S22_PHASE == 'bootstrap' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set +e
          terraform plan -lock-timeout=5m -detailed-exitcode
          PLAN_EXIT_CODE=$?
          set -e
          echo "health_only_convergence_exit_code=$PLAN_EXIT_CODE" | tee -a s22-health-only-apply-evidence.txt
          [[ "$PLAN_EXIT_CODE" == "0" ]]

      - name: Upload health-only runtime apply evidence
        if: always() && env.S22_PHASE == 'bootstrap' && env.S22_ACTION == 'apply'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-health-only-apply-evidence-${{ github.run_id }}
          path: infra/deploy/gcp/staging/s22-health-only-apply-evidence.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Apply exact owner-approved Cloud SQL Phase B plan
        if: env.S22_PHASE == 'cloud-sql-phase-b' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        run: >-
          terraform apply -lock-timeout=5m -auto-approve
          s22-cloud-sql-phase-b.tfplan

      - name: Verify Cloud SQL Phase B dormant state
