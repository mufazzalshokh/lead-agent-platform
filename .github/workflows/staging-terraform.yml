          echo "api_image_plan_sha256=$(awk '{print $1}' infra/deploy/gcp/staging/s22.tfplan.sha256)" \
            | tee -a infra/deploy/gcp/staging/s22-api-image-plan-evidence.txt

      - name: Verify Cloud SQL start-only plan safety
        if: env.S22_PHASE == 'cloud-sql-start' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          PLAN_JSON=s22-cloud-sql-start.tfplan.json
          trap 'rm -f "$PLAN_JSON"' EXIT
          terraform show -json s22.tfplan > "$PLAN_JSON"

          jq -e --arg project "$TF_VAR_project_id" '.variables.project_id.value == $project' "$PLAN_JSON" > /dev/null
          jq -e --arg region "$TF_VAR_region" '.variables.region.value == $region' "$PLAN_JSON" > /dev/null
          jq -e '.variables.git_commit_sha.value == "2396fdf797eb4b19252a34c8b45e93945a8f53a3"' "$PLAN_JSON" > /dev/null
          jq -e '
            .variables.deploy_runtime.value == "true"
              and .variables.bootstrap_runtime.value == "true"
              and .variables.prepare_migration.value == "false"
              and .variables.cloud_sql_activation_policy.value == "ALWAYS"
              and .variables.cloud_sql_tier.value == "db-f1-micro"
              and .variables.api_max_instance_count.value == "1"
              and .variables.web_max_instance_count.value == "1"
              and .variables.worker_instance_count.value == "0"
          ' "$PLAN_JSON" > /dev/null

          jq -e '
            [.resource_changes[]
             | select(.mode == "managed" and .change.actions != ["no-op"])] as $changes
            | ($changes | length) == 1
              and $changes[0].address == "google_sql_database_instance.staging"
              and $changes[0].change.actions == ["update"]
              and $changes[0].change.before.settings[0].activation_policy == "NEVER"
              and $changes[0].change.after.settings[0].activation_policy == "ALWAYS"
              and $changes[0].change.after
                  == ($changes[0].change.before | .settings[0].activation_policy = "ALWAYS")
          ' "$PLAN_JSON" > /dev/null || {
            echo "::error::Cloud SQL start plan contains an action other than the approved NEVER-to-ALWAYS update."
            jq -c '[.resource_changes[] | select(.mode == "managed" and .change.actions != ["no-op"]) | {address, actions: .change.actions}]' "$PLAN_JSON"
            exit 1
          }
          jq -e '
            [.resource_changes[]
             | select(.mode == "data" and .change.actions != ["no-op"])]
            | all(.[];
                .address == "data.google_project.staging"
                  and .change.actions == ["read"])
          ' "$PLAN_JSON" > /dev/null

          CREATE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["create"])] | length' "$PLAN_JSON")"
          CHANGE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["update"])] | length' "$PLAN_JSON")"
          DESTROY_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["delete"])] | length' "$PLAN_JSON")"
          REPLACE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["delete", "create"] or .change.actions == ["create", "delete"])] | length' "$PLAN_JSON")"
          [[ "$CREATE_COUNT" == "0" ]]
          [[ "$CHANGE_COUNT" == "1" ]]
          [[ "$DESTROY_COUNT" == "0" ]]
          [[ "$REPLACE_COUNT" == "0" ]]

          {
            echo "cloud_sql_start_source_commit=$S22_COMMIT_SHA"
            echo "cloud_sql_start_workflow_run_id=$GITHUB_RUN_ID"
            echo "cloud_sql_start_plan_sha256=$(awk '{print $1}' s22.tfplan.sha256)"
            echo "cloud_sql_start_plan_creates=$CREATE_COUNT"
            echo "cloud_sql_start_plan_changes=$CHANGE_COUNT"
            echo "cloud_sql_start_plan_destroys=$DESTROY_COUNT"
            echo "cloud_sql_start_plan_replacements=$REPLACE_COUNT"
            echo "cloud_sql_start_plan_action=update:google_sql_database_instance.staging"
            echo "cloud_sql_start_only_change=activation_policy_NEVER_to_ALWAYS"
            echo "cloud_sql_start_unrelated_actions=NONE"
          } | tee s22-cloud-sql-start-plan-evidence.txt

      - name: Verify health-only bootstrap plan safety
        if: env.S22_PHASE == 'bootstrap' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          PLAN_JSON=s22-health-only.tfplan.json
          terraform show -json s22.tfplan > "$PLAN_JSON"
          jq -e --arg project "$TF_VAR_project_id" '.variables.project_id.value == $project' "$PLAN_JSON" > /dev/null || {
            echo "::error::Health-only plan project does not match the approved project."
            jq -c '{ project_id: .variables.project_id.value }' "$PLAN_JSON"
            exit 1
          }
          jq -e --arg region "$TF_VAR_region" '.variables.region.value == $region' "$PLAN_JSON" > /dev/null || {
            echo "::error::Health-only plan region does not match the approved region."
            jq -c '{ region: .variables.region.value }' "$PLAN_JSON"
            exit 1
          }
          jq -e '
            .variables.deploy_runtime.value == "true"
              and .variables.bootstrap_runtime.value == "true"
              and .variables.prepare_migration.value == "false"
              and .variables.cloud_sql_activation_policy.value == "NEVER"
              and .variables.api_max_instance_count.value == "1"
              and .variables.web_max_instance_count.value == "1"
              and .variables.worker_instance_count.value == "0"
          ' "$PLAN_JSON" > /dev/null || {
            echo "::error::Health-only plan lifecycle variables differ from the approved boundary."
            jq -c '{
              deploy_runtime: .variables.deploy_runtime.value,
              bootstrap_runtime: .variables.bootstrap_runtime.value,
              prepare_migration: .variables.prepare_migration.value,
              cloud_sql_activation_policy: .variables.cloud_sql_activation_policy.value,
              api_max_instance_count: .variables.api_max_instance_count.value,
              web_max_instance_count: .variables.web_max_instance_count.value,
              worker_instance_count: .variables.worker_instance_count.value
            }' "$PLAN_JSON"
            exit 1
          }

          EXPECTED_ADDRESSES='[
            "google_cloud_run_v2_service.api[0]",
            "google_cloud_run_v2_service.web[0]",
            "google_cloud_run_v2_service_iam_member.api_public[0]",
            "google_cloud_run_v2_service_iam_member.web_public[0]"
          ]'
          jq -e --argjson expected "$EXPECTED_ADDRESSES" '
            [.resource_changes[]
             | select(.mode == "managed" and .change.actions != ["no-op"])
             | { address, actions: .change.actions }] as $actual
            | ($actual | length) == 4
              and all($actual[]; .actions == ["create"])
              and ([$actual[].address] | sort) == ($expected | sort)
          ' "$PLAN_JSON" > /dev/null || {
            echo "::error::Health-only plan resource-action set is not the approved four-create set."
            jq -c '[.resource_changes[] | select(.mode == "managed" and .change.actions != ["no-op"]) | { address, actions: .change.actions }]' "$PLAN_JSON"
            exit 1
          }
          jq -e '
            [.resource_changes[]
             | select(.mode == "data" and .change.actions != ["no-op"])]
            | all(.[];
                .address == "data.google_project.staging"
                  and .change.actions == ["read"])
          ' "$PLAN_JSON" > /dev/null || {
            echo "::error::Health-only plan contains an unexpected data-source action."
            jq -c '[.resource_changes[] | select(.mode == "data" and .change.actions != ["no-op"]) | { address, actions: .change.actions }]' "$PLAN_JSON"
            exit 1
          }

          ACTUAL_ACTIONS="$(
            jq -c '
              [.resource_changes[]
               | select(.mode == "managed" and .change.actions != ["no-op"])
               | ((.change.actions | join(",")) + ":" + .address)]
              | sort
            ' "$PLAN_JSON"
          )"

          jq -e --arg api_image "$TF_VAR_api_image" '
            [.resource_changes[]
             | select(.address == "google_cloud_run_v2_service.api[0]")
             | .change.after] as $api
            | ($api | length) == 1
              and $api[0].name == "lead-agent-staging-api"
              and $api[0].location == "me-central1"
              and $api[0].ingress == "INGRESS_TRAFFIC_ALL"
              and $api[0].deletion_protection == true
              and $api[0].template[0].service_account == "lead-agent-staging-api@lead-agent-stg-739284.iam.gserviceaccount.com"
              and $api[0].template[0].timeout == "60s"
              and $api[0].template[0].max_instance_request_concurrency == 40
              and $api[0].template[0].scaling[0].min_instance_count == 0
              and $api[0].template[0].scaling[0].max_instance_count == 1
              and $api[0].template[0].containers[0].image == $api_image
              and $api[0].template[0].containers[0].command == ["node"]
              and $api[0].template[0].vpc_access[0].egress == "PRIVATE_RANGES_ONLY"
          ' "$PLAN_JSON" > /dev/null || {
            echo "::error::Health-only API service shape differs from the approved boundary."
            jq -c '[.resource_changes[] | select(.address == "google_cloud_run_v2_service.api[0]") | .change.after]' "$PLAN_JSON"
            exit 1
          }
          jq -e --arg web_image "$TF_VAR_web_image" '
            [.resource_changes[]
             | select(.address == "google_cloud_run_v2_service.web[0]")
             | .change.after] as $web
            | ($web | length) == 1
              and $web[0].name == "lead-agent-staging-web"
              and $web[0].location == "me-central1"
              and $web[0].ingress == "INGRESS_TRAFFIC_ALL"
              and $web[0].deletion_protection == true
              and $web[0].template[0].service_account == "lead-agent-staging-web@lead-agent-stg-739284.iam.gserviceaccount.com"
              and $web[0].template[0].timeout == "60s"
              and $web[0].template[0].max_instance_request_concurrency == 80
              and $web[0].template[0].scaling[0].min_instance_count == 0
              and $web[0].template[0].scaling[0].max_instance_count == 1
              and $web[0].template[0].containers[0].image == $web_image
              and $web[0].template[0].containers[0].command == ["node"]
              and $web[0].template[0].vpc_access[0].egress == "PRIVATE_RANGES_ONLY"
          ' "$PLAN_JSON" > /dev/null || {
            echo "::error::Health-only Web service shape differs from the approved boundary."
            jq -c '[.resource_changes[] | select(.address == "google_cloud_run_v2_service.web[0]") | .change.after]' "$PLAN_JSON"
            exit 1
          }
          jq -e '
            [.resource_changes[]
             | select(.address == "google_cloud_run_v2_service_iam_member.api_public[0]"
                      or .address == "google_cloud_run_v2_service_iam_member.web_public[0]")
             | .change.after
             | select(.role == "roles/run.invoker" and .member == "allUsers")] as $bindings
            | ($bindings | length) == 2
          ' "$PLAN_JSON" > /dev/null || {
            echo "::error::Health-only public invoker bindings differ from the approved boundary."
            jq -c '[.resource_changes[] | select(.address == "google_cloud_run_v2_service_iam_member.api_public[0]" or .address == "google_cloud_run_v2_service_iam_member.web_public[0]") | .change.after]' "$PLAN_JSON"
            exit 1
          }

          CREATE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["create"])] | length' "$PLAN_JSON")"
          CHANGE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["update"])] | length' "$PLAN_JSON")"
          DESTROY_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["delete"])] | length' "$PLAN_JSON")"
          REPLACE_COUNT="$(
            jq '[.resource_changes[]
                 | select(.change.actions == ["delete", "create"]
                          or .change.actions == ["create", "delete"])] | length' "$PLAN_JSON"
          )"
          if [[ "$CREATE_COUNT" != "4" || "$CHANGE_COUNT" != "0" || "$DESTROY_COUNT" != "0" || "$REPLACE_COUNT" != "0" ]]; then
            echo "::error::Health-only plan aggregate counts differ from 4 creates, 0 changes, 0 destroys, 0 replacements."
            printf 'creates=%s changes=%s destroys=%s replacements=%s\n' "$CREATE_COUNT" "$CHANGE_COUNT" "$DESTROY_COUNT" "$REPLACE_COUNT"
            exit 1
          fi

          {
            echo "health_only_source_commit=$S22_COMMIT_SHA"
            echo "health_only_workflow_run_id=$GITHUB_RUN_ID"
            echo "health_only_plan_sha256=$(awk '{print $1}' s22.tfplan.sha256)"
            echo "health_only_plan_creates=$CREATE_COUNT"
            echo "health_only_plan_changes=$CHANGE_COUNT"
            echo "health_only_plan_destroys=$DESTROY_COUNT"
            echo "health_only_plan_replacements=$REPLACE_COUNT"
            echo "health_only_plan_actions=$ACTUAL_ACTIONS"
            echo "health_only_api_min_instances=0"
            echo "health_only_api_max_instances=1"
            echo "health_only_web_min_instances=0"
            echo "health_only_web_max_instances=1"
            echo "health_only_scale_to_zero=true"
            echo "health_only_vpc_egress=PRIVATE_RANGES_ONLY"
            echo "health_only_cloud_sql_policy=NEVER"
            echo "health_only_worker_planned=false"
            echo "health_only_migrator_planned=false"
            echo "health_only_secret_values_required=false"
          } | tee s22-health-only-plan-evidence.txt
          rm -f "$PLAN_JSON"

      - name: Verify foundation reconciliation plan safety
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          PLAN_JSON="$(mktemp)"
          trap 'rm -f "$PLAN_JSON"' EXIT
          terraform show -json s22.tfplan > "$PLAN_JSON"

          jq -e --arg project "$TF_VAR_project_id" '.variables.project_id.value == $project' "$PLAN_JSON" > /dev/null
          jq -e --arg region "$TF_VAR_region" '.variables.region.value == $region' "$PLAN_JSON" > /dev/null
          jq -e '.variables.cloud_sql_activation_policy.value == "ALWAYS"' "$PLAN_JSON" > /dev/null
          jq -e '
            [.resource_changes[] | select(.change.actions != ["no-op"])] as $changes
            | ([$changes[] | select(.change.actions != ["create"])] | length) == 0
              and ([$changes[]
                    | select(.address != "google_sql_database_instance.staging"
                             and .address != "google_monitoring_alert_policy.database_cpu")]
                   | length) == 0
              and ([$changes[] | select(.address == "google_sql_database_instance.staging")]
                   | length) == 1
          ' "$PLAN_JSON" > /dev/null

          jq -e '
            [.resource_changes[]
             | select(.address == "google_sql_database_instance.staging")
             | .change.after]
            | length == 1
              and .[0].name == "lead-agent-staging-postgres17"
              and .[0].database_version == "POSTGRES_17"
              and .[0].deletion_protection == true
              and .[0].settings[0].edition == "ENTERPRISE"
              and .[0].settings[0].tier == "db-f1-micro"
              and .[0].settings[0].availability_type == "ZONAL"
              and .[0].settings[0].activation_policy == "ALWAYS"
              and .[0].settings[0].disk_type == "PD_SSD"
              and .[0].settings[0].disk_size == 10
              and .[0].settings[0].disk_autoresize == true
              and .[0].settings[0].disk_autoresize_limit == 20
              and .[0].settings[0].deletion_protection_enabled == true
              and .[0].settings[0].backup_configuration[0].enabled == true
              and .[0].settings[0].backup_configuration[0].start_time == "01:00"
              and .[0].settings[0].backup_configuration[0].point_in_time_recovery_enabled == true
              and .[0].settings[0].backup_configuration[0].transaction_log_retention_days == 7
              and .[0].settings[0].backup_configuration[0].backup_retention_settings[0].retained_backups == 7
              and .[0].settings[0].ip_configuration[0].ipv4_enabled == false
              and .[0].settings[0].ip_configuration[0].enable_private_path_for_google_cloud_services == true
              and .[0].settings[0].ip_configuration[0].ssl_mode == "ENCRYPTED_ONLY"
              and (.[0].settings[0].ip_configuration[0].private_network
                   | endswith("/global/networks/lead-agent-staging-vpc"))
          ' "$PLAN_JSON" > /dev/null

          CREATE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["create"])] | length' "$PLAN_JSON")"
          CHANGE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["update"])] | length' "$PLAN_JSON")"
          DESTROY_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["delete"])] | length' "$PLAN_JSON")"
          REPLACE_COUNT="$(
            jq '[.resource_changes[]
                 | select(.change.actions == ["delete", "create"]
                          or .change.actions == ["create", "delete"])] | length' "$PLAN_JSON"
          )"
          {
            echo "reconciliation_plan_sha256=$(awk '{print $1}' s22.tfplan.sha256)"
            echo "reconciliation_plan_creates=$CREATE_COUNT"
            echo "reconciliation_plan_changes=$CHANGE_COUNT"
            echo "reconciliation_plan_destroys=$DESTROY_COUNT"
            echo "reconciliation_plan_replacements=$REPLACE_COUNT"
            echo "reconciliation_plan_actions:"
            jq -r '.resource_changes[]
                   | select(.change.actions != ["no-op"])
                   | "\(.change.actions | join(",")):\(.address)"' "$PLAN_JSON"
          } | tee -a s22-foundation-reconciliation-evidence.txt

          [[ "$CHANGE_COUNT" == "0" ]]
          [[ "$DESTROY_COUNT" == "0" ]]
          [[ "$REPLACE_COUNT" == "0" ]]

      - name: Upload exact reviewed plan
        if: always() && env.S22_PHASE != 'bootstrap-iam' && env.S22_PHASE != 'bootstrap-log-viewer' && env.S22_PHASE != 'bootstrap-log-viewer-remove' && env.S22_PHASE != 'foundation-reconcile' && env.S22_PHASE != 'foundation-reconcile-verify' && env.S22_PHASE != 'bootstrap' && env.S22_PHASE != 'migration-diagnose' && env.S22_PHASE != 'migration-wiring-diagnose' && env.S22_PHASE != 'migration-error-read' && env.S22_PHASE != 'migration-validate' && env.S22_PHASE != 'api-image-verify' && env.S22_PHASE != 'migrator-image-verify' && env.S22_PHASE != 'runtime-preflight' && env.S22_PHASE != 'runtime-diagnose' && env.S22_PHASE != 'auth-callback-diagnose' && env.S22_PHASE != 'instagram-verify-access' && env.S22_PHASE != 'instagram-verify' && env.S22_PHASE != 'instagram-verify-access-remove' && env.S22_PHASE != 'telegram-verify-access' && env.S22_PHASE != 'telegram-verify' && env.S22_PHASE != 'telegram-verify-access-remove' && env.S22_PHASE != 'owner-workspace-verify' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-terraform-plan-${{ env.S22_PHASE }}-${{ env.S22_COMMIT_SHA }}
          path: |
            infra/deploy/gcp/staging/s22.tfplan
            infra/deploy/gcp/staging/s22.tfplan.sha256
            infra/deploy/gcp/staging/s22-full-runtime-plan-evidence.txt
            infra/deploy/gcp/staging/s22-api-image-plan-evidence.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload exact health-only bootstrap plan
        if: always() && env.S22_PHASE == 'bootstrap' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-health-only-plan-${{ env.S22_COMMIT_SHA }}-${{ github.run_id }}
          path: |
