name: Staging Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: Plan is always safe; apply requires the explicit owner approval token
        required: true
        type: choice
        options:
          - plan
          - apply
      phase:
        description: Reviewed lifecycle/cost profile
        required: true
        type: choice
        options:
          - bootstrap-iam
          - foundation
          - foundation-reconcile
          - foundation-reconcile-verify
          - cloud-sql-phase-b
          - bootstrap
          - migration
          - full
          - load
          - dormant
      commit_sha:
        description: Exact 40-character commit preserved on the dispatched approved branch
        required: true
        type: string
      deployment_timestamp:
        description: UTC RFC3339 deployment timestamp for runtime phases
        required: false
        type: string
      api_image:
        description: Immutable API image reference by digest
        required: false
        type: string
      web_image:
        description: Immutable Web image reference by digest
        required: false
        type: string
      worker_image:
        description: Immutable worker image reference by digest (full phase)
        required: false
        type: string
      migrator_image:
        description: Immutable migrator image reference by digest (migration and later phases)
        required: false
        type: string
      owner_approval_token:
        description: Leave empty for plan; apply requires S22-APPLY-APPROVED
        required: false
        type: string
      plan_run_id:
        description: GitHub run ID containing the exact reviewed plan; required only for apply
        required: false
        type: string
      approved_plan_sha256:
        description: Exact owner-approved saved-plan SHA256; required only for apply
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: staging-terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} / ${{ inputs.phase }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      S22_ACTION: ${{ inputs.action }}
      S22_APPROVAL_TOKEN: ${{ inputs.owner_approval_token }}
      S22_APPROVED_PLAN_SHA256: ${{ inputs.approved_plan_sha256 }}
      S22_COMMIT_SHA: ${{ inputs.commit_sha }}
      S22_PHASE: ${{ inputs.phase }}
      S22_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: me-central1
      TF_VAR_git_commit_sha: ${{ inputs.commit_sha }}
      TF_VAR_deployment_timestamp: ${{ inputs.deployment_timestamp }}
      TF_VAR_api_image: ${{ inputs.api_image }}
      TF_VAR_web_image: ${{ inputs.web_image }}
      TF_VAR_worker_image: ${{ inputs.worker_image }}
      TF_VAR_migrator_image: ${{ inputs.migrator_image }}
      TF_VAR_api_public_origin: ${{ vars.STAGING_API_ORIGIN }}
      TF_VAR_web_public_origin: ${{ vars.STAGING_WEB_ORIGIN }}
      TF_VAR_auth0_issuer: ${{ vars.STAGING_AUTH0_ISSUER }}
      TF_VAR_auth0_client_id: ${{ vars.STAGING_AUTH0_CLIENT_ID }}
      TF_VAR_telegram_bot_username: ${{ vars.STAGING_TELEGRAM_BOT_USERNAME }}
      TF_VAR_instagram_app_id: ${{ vars.STAGING_INSTAGRAM_APP_ID }}
      TF_VAR_instagram_graph_api_version: ${{ vars.STAGING_INSTAGRAM_GRAPH_API_VERSION }}
      TF_VAR_billing_account_id: ${{ vars.GCP_BILLING_ACCOUNT_ID }}
      TF_VAR_deployer_service_account_email: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_monitoring_notification_channel_ids: ${{ vars.STAGING_MONITORING_NOTIFICATION_CHANNEL_IDS_JSON }}
      TF_VAR_state_bucket_name: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
    steps:
      - name: Validate request boundary
        env:
          ACTION: ${{ env.S22_ACTION }}
          APPROVED_PLAN_SHA256: ${{ env.S22_APPROVED_PLAN_SHA256 }}
          APPROVAL_TOKEN: ${{ env.S22_APPROVAL_TOKEN }}
          DISPATCH_REF: ${{ github.ref }}
          PHASE: ${{ env.S22_PHASE }}
          PLAN_RUN_ID: ${{ env.S22_PLAN_RUN_ID }}
          REQUESTED_SHA: ${{ env.S22_COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DISPATCH_REF" in
            refs/heads/main|refs/heads/verify/s22-staging-recovery-capacity) ;;
            *) echo "Staging Terraform may run only from main or the S22 verification branch." >&2; exit 1 ;;
          esac
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$ACTION" == "apply" && "$APPROVAL_TOKEN" != "S22-APPLY-APPROVED" ]]; then
            echo "Apply requires the exact owner approval token." >&2
            exit 1
          fi
          if [[ "$ACTION" == "apply" && ! "$PLAN_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Apply requires the exact reviewed plan run ID." >&2
            exit 1
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" == "foundation-reconcile" ]]; then
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "2396fdf797eb4b19252a34c8b45e93945a8f53a3" ]]
            [[ "$PLAN_RUN_ID" == "36226804148" ]]
            [[ "$APPROVED_PLAN_SHA256" == "ddcf63f2b087c14a4dc7c52aee46e8530f97d7fc05b8ab0c8467eb8526c285f0" ]]
          fi
          if [[ "$PHASE" == "foundation-reconcile-verify" ]]; then
            [[ "$ACTION" == "plan" ]]
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "2396fdf797eb4b19252a34c8b45e93945a8f53a3" ]]
            [[ "$PLAN_RUN_ID" == "36226804148" ]]
            [[ "$APPROVED_PLAN_SHA256" == "ddcf63f2b087c14a4dc7c52aee46e8530f97d7fc05b8ab0c8467eb8526c285f0" ]]
          fi
          if [[ "$PHASE" == "cloud-sql-phase-b" ]]; then
            [[ "$ACTION" == "apply" ]]
            [[ "$APPROVAL_TOKEN" == "S22-APPLY-APPROVED" ]]
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "2396fdf797eb4b19252a34c8b45e93945a8f53a3" ]]
            [[ "$PLAN_RUN_ID" == "36230182001" ]]
            [[ "$APPROVED_PLAN_SHA256" == "2e89253d05281e38af1157e6cf3f1a09740db5572f699f36228606fbbd8a987e" ]]
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" == "bootstrap-iam" ]]; then
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$REQUESTED_SHA" == "87216fcd8d2047e292c398a459e49e40c4ff2b9a" ]]
            [[ "$PLAN_RUN_ID" == "36179081896" ]]
            [[ "$APPROVED_PLAN_SHA256" == "1408052e615385b4a01651a8b64605d13746ddde10a6950f7ba4d380a18c60e0" ]]
          fi
          if [[ "$ACTION" == "apply" && "$PHASE" == "foundation" ]]; then
            [[ "$TF_VAR_project_id" == "lead-agent-stg-739284" ]]
            [[ "$TF_VAR_region" == "me-central1" ]]
            [[ "$REQUESTED_SHA" == "c4134d2980c7c31653cc6e52dd21173a58297aab" ]]
            [[ "$PLAN_RUN_ID" == "36176635223" ]]
            [[ "$APPROVED_PLAN_SHA256" == "43ebe6df02eb4b693fdc17dfd2dbedf191668e3a1b61ccc4c97fe94d8cf5ad7c" ]]
          fi
          DEPLOY_RUNTIME=false
          BOOTSTRAP_RUNTIME=false
          PREPARE_MIGRATION=false
          SQL_POLICY=NEVER
          SQL_TIER=db-f1-micro
          API_MAX=1
          WEB_MAX=1
          WORKER_COUNT=0
          WORKER_MEMORY=512Mi

          case "$PHASE" in
            bootstrap-iam) ;;
            foundation) ;;
            foundation-reconcile)
              SQL_POLICY=ALWAYS
              ;;
            foundation-reconcile-verify)
              SQL_POLICY=ALWAYS
              ;;
            cloud-sql-phase-b) ;;
            bootstrap)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              ;;
            migration)
              DEPLOY_RUNTIME=true
              BOOTSTRAP_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              ;;
            full)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              WORKER_COUNT=1
              ;;
            load)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              SQL_POLICY=ALWAYS
              SQL_TIER=db-custom-1-3840
              API_MAX=3
              WEB_MAX=2
              WORKER_COUNT=1
              WORKER_MEMORY=1Gi
              ;;
            dormant)
              DEPLOY_RUNTIME=true
              PREPARE_MIGRATION=true
              ;;
          esac

          {
            echo "TF_VAR_deploy_runtime=$DEPLOY_RUNTIME"
            echo "TF_VAR_bootstrap_runtime=$BOOTSTRAP_RUNTIME"
            echo "TF_VAR_prepare_migration=$PREPARE_MIGRATION"
            echo "TF_VAR_cloud_sql_activation_policy=$SQL_POLICY"
            echo "TF_VAR_cloud_sql_tier=$SQL_TIER"
            echo "TF_VAR_api_max_instance_count=$API_MAX"
            echo "TF_VAR_web_max_instance_count=$WEB_MAX"
            echo "TF_VAR_worker_instance_count=$WORKER_COUNT"
            echo "TF_VAR_worker_memory=$WORKER_MEMORY"
          } >> "$GITHUB_ENV"

      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.S22_COMMIT_SHA }}

      - name: Prove commit is preserved on the dispatched branch
        env:
          DISPATCH_BRANCH: ${{ github.ref_name }}
          REQUESTED_SHA: ${{ env.S22_COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          git fetch --no-tags origin "$DISPATCH_BRANCH"
          git merge-base --is-ancestor "$REQUESTED_SHA" "origin/$DISPATCH_BRANCH"

      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.7

      - name: Initialize bootstrap Terraform
        if: env.S22_PHASE == 'bootstrap-iam'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: terraform init -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}"

      - name: Validate bootstrap Terraform
        if: env.S22_PHASE == 'bootstrap-iam'
        working-directory: infra/deploy/gcp/bootstrap
        run: terraform validate

      - name: Verify authoritative bootstrap state
        if: env.S22_PHASE == 'bootstrap-iam'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          BOOTSTRAP_STATE_COUNT="$(terraform state list | wc -l | tr -d '[:space:]')"
          [[ "$BOOTSTRAP_STATE_COUNT" == "34" ]]
          echo "Authoritative bootstrap state resources: $BOOTSTRAP_STATE_COUNT"

      - name: Create reviewed bootstrap IAM plan
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          terraform plan \
            -lock-timeout=5m \
            -target=google_project_iam_member.deployer \
            -out=s22-bootstrap-iam.tfplan
          sha256sum s22-bootstrap-iam.tfplan > s22-bootstrap-iam.tfplan.sha256

      - name: Upload exact reviewed bootstrap IAM plan
        if: env.S22_PHASE == 'bootstrap-iam' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-bootstrap-iam-plan-${{ env.S22_COMMIT_SHA }}
          path: |
            infra/deploy/gcp/bootstrap/s22-bootstrap-iam.tfplan
            infra/deploy/gcp/bootstrap/s22-bootstrap-iam.tfplan.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Initialize staging Terraform
        if: env.S22_PHASE != 'bootstrap-iam'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: terraform init -backend-config="bucket=${{ vars.GCP_TERRAFORM_STATE_BUCKET }}"

      - name: Validate staging Terraform
        if: env.S22_PHASE != 'bootstrap-iam'
        working-directory: infra/deploy/gcp/staging
        run: terraform validate

      - name: Set up Google Cloud CLI for reconciliation inspection
        if: env.S22_PHASE == 'foundation-reconcile' || env.S22_PHASE == 'foundation-reconcile-verify' || env.S22_PHASE == 'cloud-sql-phase-b'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Inspect partial foundation state and Google Cloud resources
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: me-central1
        shell: bash
        run: |
          set -euo pipefail
          INSPECT_DIR="$(mktemp -d)"
          trap 'rm -rf "$INSPECT_DIR"' EXIT
          EVIDENCE=s22-foundation-reconciliation-evidence.txt
          SQL_INSTANCE=lead-agent-staging-postgres17

          STATE_ADDRESSES="$(terraform state list | sort)"
          STATE_COUNT="$(printf '%s\n' "$STATE_ADDRESSES" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          STATE_HAS_SQL=false
          STATE_HAS_DATABASE_ALERT=false
          grep -Fqx 'google_sql_database_instance.staging' <<< "$STATE_ADDRESSES" && STATE_HAS_SQL=true
          grep -Fqx 'google_monitoring_alert_policy.database_cpu' <<< "$STATE_ADDRESSES" && STATE_HAS_DATABASE_ALERT=true

          gcloud sql instances list --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/sql-instances.json"
          gh run view 36224692606 --repo "$GITHUB_REPOSITORY" --log > "$INSPECT_DIR/failed-apply.log"
          grep -Fq 'This operation is not valid for this instance.' "$INSPECT_DIR/failed-apply.log"
          grep -Fq 'invalidOperation' "$INSPECT_DIR/failed-apply.log"
          gcloud sql tiers list --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/sql-tiers.json"
          gcloud sql flags list --database-version=POSTGRES_17 --format=json > "$INSPECT_DIR/postgres17-flags.json"

          SQL_INSTANCE_COUNT="$(
            jq --arg instance "$SQL_INSTANCE" '[.[] | select(.name == $instance)] | length' \
              "$INSPECT_DIR/sql-instances.json"
          )"
          jq -e --arg region "$REGION" '
            [.[] | select(.tier == "db-f1-micro")] as $tiers
            | ($tiers | length) > 0
              and ([$tiers[] | (.region // .regions // [])[]? | select(. == $region)] | length) > 0
          ' "$INSPECT_DIR/sql-tiers.json" > /dev/null
          jq -e 'length > 0' "$INSPECT_DIR/postgres17-flags.json" > /dev/null

          gcloud compute networks describe lead-agent-staging-vpc \
            --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/network.json"
          gcloud compute addresses describe lead-agent-staging-private-services \
            --global --project="$PROJECT_ID" --format=json > "$INSPECT_DIR/private-range.json"
          gcloud services vpc-peerings list \
            --project="$PROJECT_ID" \
            --network=lead-agent-staging-vpc \
            --service=servicenetworking.googleapis.com \
            --format=json > "$INSPECT_DIR/peerings.json"
          jq -e '.autoCreateSubnetworks == false' "$INSPECT_DIR/network.json" > /dev/null
          jq -e '.addressType == "INTERNAL" and .purpose == "VPC_PEERING"' \
            "$INSPECT_DIR/private-range.json" > /dev/null
          jq -e 'length >= 1' "$INSPECT_DIR/peerings.json" > /dev/null

          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://monitoring.googleapis.com/v3/projects/$PROJECT_ID/alertPolicies?pageSize=100" \
            > "$INSPECT_DIR/alerts.json"
          DATABASE_ALERT_COUNT="$(
            jq '[.alertPolicies[]? | select(.displayName == "Lead Agent staging Cloud SQL CPU saturation")] | length' \
              "$INSPECT_DIR/alerts.json"
          )"
          unset ACCESS_TOKEN

          {
            echo "project=$PROJECT_ID"
            echo "region=$REGION"
            echo "terraform_backend=gcs"
            echo "terraform_state_prefix=lead-agent-platform/staging"
            echo "terraform_managed_resource_count=$STATE_COUNT"
            echo "terraform_state_has_cloud_sql=$STATE_HAS_SQL"
            echo "terraform_state_has_database_cpu_alert=$STATE_HAS_DATABASE_ALERT"
            echo "gcp_cloud_sql_instance_count=$SQL_INSTANCE_COUNT"
            echo "gcp_database_cpu_alert_count=$DATABASE_ALERT_COUNT"
            echo "cloud_sql_failed_operation_source=github_run_36224692606"
            echo "cloud_sql_failed_operation_status=terminal_error"
            echo "cloud_sql_failed_operation_code=invalidOperation"
            echo "cloud_sql_pending_operation_observation=none; terminal failure recorded and no instance exists"
            echo "cloud_sql_tier_region_supported=true"
            echo "postgresql_17_api_supported=true"
            echo "private_service_access_present=true"
            echo "terraform_state_addresses:"
            printf '%s\n' "$STATE_ADDRESSES"
          } | tee "$EVIDENCE"

          if [[ "$STATE_HAS_SQL" != "false" || "$SQL_INSTANCE_COUNT" != "0" ]]; then
            echo "Cloud SQL exists in state or GCP; automatic import/reconciliation is not authorized." >&2
            exit 1
          fi
          if [[ "$STATE_HAS_DATABASE_ALERT" != "false" || "$DATABASE_ALERT_COUNT" != "0" ]]; then
            echo "The dependent CPU alert exists outside the expected partial state; automatic import is not authorized." >&2
            exit 1
          fi

      - name: Verify authoritative foundation state before apply
        if: env.S22_PHASE == 'foundation' && env.S22_ACTION == 'apply'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          FOUNDATION_STATE_COUNT="$(terraform state list | wc -l | tr -d '[:space:]')"
          [[ "$FOUNDATION_STATE_COUNT" == "0" ]]
          echo "Authoritative foundation state resources before apply: $FOUNDATION_STATE_COUNT"

      - name: Create reviewed plan
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_PHASE != 'foundation-reconcile-verify' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          terraform plan -lock-timeout=5m -out=s22.tfplan
          sha256sum s22.tfplan > s22.tfplan.sha256

      - name: Verify health-only bootstrap plan safety
        if: env.S22_PHASE == 'bootstrap' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          PLAN_JSON=s22-health-only.tfplan.json
          terraform show -json s22.tfplan > "$PLAN_JSON"
          jq -e --arg project "$TF_VAR_project_id" '.variables.project_id.value == $project' "$PLAN_JSON" > /dev/null
          jq -e --arg region "$TF_VAR_region" '.variables.region.value == $region' "$PLAN_JSON" > /dev/null
          jq -e '
            .variables.deploy_runtime.value == true
              and .variables.bootstrap_runtime.value == true
              and .variables.prepare_migration.value == false
              and .variables.cloud_sql_activation_policy.value == "NEVER"
              and .variables.api_max_instance_count.value == 1
              and .variables.web_max_instance_count.value == 1
              and .variables.worker_instance_count.value == 0
          ' "$PLAN_JSON" > /dev/null

          ACTUAL_ACTIONS="$(
            jq -c '
              [.resource_changes[]
               | select(.change.actions != ["no-op"])
               | ((.change.actions | join(",")) + ":" + .address)]
              | sort
            ' "$PLAN_JSON"
          )"
          EXPECTED_ACTIONS='["create:google_cloud_run_v2_service.api[0]","create:google_cloud_run_v2_service.web[0]","create:google_cloud_run_v2_service_iam_member.api_public[0]","create:google_cloud_run_v2_service_iam_member.web_public[0]"]'
          [[ "$ACTUAL_ACTIONS" == "$EXPECTED_ACTIONS" ]]

          jq -e --arg api_image "$TF_VAR_api_image" '
            [.resource_changes[]
             | select(.address == "google_cloud_run_v2_service.api[0]")
             | .change.after]
            | length == 1
              and .[0].name == "lead-agent-staging-api"
              and .[0].location == "me-central1"
              and .[0].ingress == "INGRESS_TRAFFIC_ALL"
              and .[0].deletion_protection == true
              and .[0].template[0].service_account == "lead-agent-staging-api@lead-agent-stg-739284.iam.gserviceaccount.com"
              and .[0].template[0].timeout == "60s"
              and .[0].template[0].max_instance_request_concurrency == 40
              and .[0].template[0].scaling[0].min_instance_count == 0
              and .[0].template[0].scaling[0].max_instance_count == 1
              and .[0].template[0].containers[0].image == $api_image
              and .[0].template[0].containers[0].command == ["node"]
              and .[0].template[0].vpc_access[0].egress == "PRIVATE_RANGES_ONLY"
          ' "$PLAN_JSON" > /dev/null
          jq -e --arg web_image "$TF_VAR_web_image" '
            [.resource_changes[]
             | select(.address == "google_cloud_run_v2_service.web[0]")
             | .change.after]
            | length == 1
              and .[0].name == "lead-agent-staging-web"
              and .[0].location == "me-central1"
              and .[0].ingress == "INGRESS_TRAFFIC_ALL"
              and .[0].deletion_protection == true
              and .[0].template[0].service_account == "lead-agent-staging-web@lead-agent-stg-739284.iam.gserviceaccount.com"
              and .[0].template[0].timeout == "60s"
              and .[0].template[0].max_instance_request_concurrency == 80
              and .[0].template[0].scaling[0].min_instance_count == 0
              and .[0].template[0].scaling[0].max_instance_count == 1
              and .[0].template[0].containers[0].image == $web_image
              and .[0].template[0].containers[0].command == ["node"]
              and .[0].template[0].vpc_access[0].egress == "PRIVATE_RANGES_ONLY"
          ' "$PLAN_JSON" > /dev/null
          jq -e '
            [.resource_changes[]
             | select(.address == "google_cloud_run_v2_service_iam_member.api_public[0]"
                      or .address == "google_cloud_run_v2_service_iam_member.web_public[0]")
             | .change.after
             | select(.role == "roles/run.invoker" and .member == "allUsers")]
            | length == 2
          ' "$PLAN_JSON" > /dev/null

          CREATE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["create"])] | length' "$PLAN_JSON")"
          CHANGE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["update"])] | length' "$PLAN_JSON")"
          DESTROY_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["delete"])] | length' "$PLAN_JSON")"
          REPLACE_COUNT="$(
            jq '[.resource_changes[]
                 | select(.change.actions == ["delete", "create"]
                          or .change.actions == ["create", "delete"])] | length' "$PLAN_JSON"
          )"
          [[ "$CREATE_COUNT" == "4" ]]
          [[ "$CHANGE_COUNT" == "0" ]]
          [[ "$DESTROY_COUNT" == "0" ]]
          [[ "$REPLACE_COUNT" == "0" ]]

          {
            echo "health_only_source_commit=$S22_COMMIT_SHA"
            echo "health_only_workflow_run_id=$GITHUB_RUN_ID"
            echo "health_only_plan_sha256=$(awk '{print $1}' s22.tfplan.sha256)"
            echo "health_only_plan_creates=$CREATE_COUNT"
            echo "health_only_plan_changes=$CHANGE_COUNT"
            echo "health_only_plan_destroys=$DESTROY_COUNT"
            echo "health_only_plan_replacements=$REPLACE_COUNT"
            echo "health_only_plan_actions=$ACTUAL_ACTIONS"
            echo "health_only_api_min_instances=0"
            echo "health_only_api_max_instances=1"
            echo "health_only_web_min_instances=0"
            echo "health_only_web_max_instances=1"
            echo "health_only_scale_to_zero=true"
            echo "health_only_vpc_egress=PRIVATE_RANGES_ONLY"
            echo "health_only_cloud_sql_policy=NEVER"
            echo "health_only_worker_planned=false"
            echo "health_only_migrator_planned=false"
            echo "health_only_secret_values_required=false"
          } | tee s22-health-only-plan-evidence.txt
          rm -f "$PLAN_JSON"

      - name: Verify foundation reconciliation plan safety
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          PLAN_JSON="$(mktemp)"
          trap 'rm -f "$PLAN_JSON"' EXIT
          terraform show -json s22.tfplan > "$PLAN_JSON"

          jq -e --arg project "$TF_VAR_project_id" '.variables.project_id.value == $project' "$PLAN_JSON" > /dev/null
          jq -e --arg region "$TF_VAR_region" '.variables.region.value == $region' "$PLAN_JSON" > /dev/null
          jq -e '.variables.cloud_sql_activation_policy.value == "ALWAYS"' "$PLAN_JSON" > /dev/null
          jq -e '
            [.resource_changes[] | select(.change.actions != ["no-op"])] as $changes
            | ([$changes[] | select(.change.actions != ["create"])] | length) == 0
              and ([$changes[]
                    | select(.address != "google_sql_database_instance.staging"
                             and .address != "google_monitoring_alert_policy.database_cpu")]
                   | length) == 0
              and ([$changes[] | select(.address == "google_sql_database_instance.staging")]
                   | length) == 1
          ' "$PLAN_JSON" > /dev/null

          jq -e '
            [.resource_changes[]
             | select(.address == "google_sql_database_instance.staging")
             | .change.after]
            | length == 1
              and .[0].name == "lead-agent-staging-postgres17"
              and .[0].database_version == "POSTGRES_17"
              and .[0].deletion_protection == true
              and .[0].settings[0].edition == "ENTERPRISE"
              and .[0].settings[0].tier == "db-f1-micro"
              and .[0].settings[0].availability_type == "ZONAL"
              and .[0].settings[0].activation_policy == "ALWAYS"
              and .[0].settings[0].disk_type == "PD_SSD"
              and .[0].settings[0].disk_size == 10
              and .[0].settings[0].disk_autoresize == true
              and .[0].settings[0].disk_autoresize_limit == 20
              and .[0].settings[0].deletion_protection_enabled == true
              and .[0].settings[0].backup_configuration[0].enabled == true
              and .[0].settings[0].backup_configuration[0].start_time == "01:00"
              and .[0].settings[0].backup_configuration[0].point_in_time_recovery_enabled == true
              and .[0].settings[0].backup_configuration[0].transaction_log_retention_days == 7
              and .[0].settings[0].backup_configuration[0].backup_retention_settings[0].retained_backups == 7
              and .[0].settings[0].ip_configuration[0].ipv4_enabled == false
              and .[0].settings[0].ip_configuration[0].enable_private_path_for_google_cloud_services == true
              and .[0].settings[0].ip_configuration[0].ssl_mode == "ENCRYPTED_ONLY"
              and (.[0].settings[0].ip_configuration[0].private_network
                   | endswith("/global/networks/lead-agent-staging-vpc"))
          ' "$PLAN_JSON" > /dev/null

          CREATE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["create"])] | length' "$PLAN_JSON")"
          CHANGE_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["update"])] | length' "$PLAN_JSON")"
          DESTROY_COUNT="$(jq '[.resource_changes[] | select(.change.actions == ["delete"])] | length' "$PLAN_JSON")"
          REPLACE_COUNT="$(
            jq '[.resource_changes[]
                 | select(.change.actions == ["delete", "create"]
                          or .change.actions == ["create", "delete"])] | length' "$PLAN_JSON"
          )"
          {
            echo "reconciliation_plan_sha256=$(awk '{print $1}' s22.tfplan.sha256)"
            echo "reconciliation_plan_creates=$CREATE_COUNT"
            echo "reconciliation_plan_changes=$CHANGE_COUNT"
            echo "reconciliation_plan_destroys=$DESTROY_COUNT"
            echo "reconciliation_plan_replacements=$REPLACE_COUNT"
            echo "reconciliation_plan_actions:"
            jq -r '.resource_changes[]
                   | select(.change.actions != ["no-op"])
                   | "\(.change.actions | join(",")):\(.address)"' "$PLAN_JSON"
          } | tee -a s22-foundation-reconciliation-evidence.txt

          [[ "$CHANGE_COUNT" == "0" ]]
          [[ "$DESTROY_COUNT" == "0" ]]
          [[ "$REPLACE_COUNT" == "0" ]]

      - name: Upload exact reviewed plan
        if: env.S22_PHASE != 'bootstrap-iam' && env.S22_PHASE != 'foundation-reconcile' && env.S22_PHASE != 'foundation-reconcile-verify' && env.S22_PHASE != 'bootstrap' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-terraform-plan-${{ env.S22_PHASE }}-${{ env.S22_COMMIT_SHA }}
          path: |
            infra/deploy/gcp/staging/s22.tfplan
            infra/deploy/gcp/staging/s22.tfplan.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload exact health-only bootstrap plan
        if: env.S22_PHASE == 'bootstrap' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-health-only-plan-${{ env.S22_COMMIT_SHA }}-${{ github.run_id }}
          path: |
            infra/deploy/gcp/staging/s22.tfplan
            infra/deploy/gcp/staging/s22.tfplan.sha256
            infra/deploy/gcp/staging/s22-health-only-plan-evidence.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload exact foundation reconciliation plan
        if: env.S22_PHASE == 'foundation-reconcile' && env.S22_ACTION == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s22-terraform-plan-${{ env.S22_PHASE }}-${{ env.S22_COMMIT_SHA }}
          path: |
            infra/deploy/gcp/staging/s22.tfplan
            infra/deploy/gcp/staging/s22.tfplan.sha256
            infra/deploy/gcp/staging/s22-foundation-reconciliation-evidence.txt
          if-no-files-found: error
          retention-days: 7

      - name: Verify Phase A live state with named read-only assertions
        if: env.S22_PHASE == 'foundation-reconcile-verify' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        env:
          EXPECTED_CHANNELS_JSON: ${{ vars.STAGING_MONITORING_NOTIFICATION_CHANNEL_IDS_JSON }}
          PHASE_A_APPLIED_PLAN_SHA256: ddcf63f2b087c14a4dc7c52aee46e8530f97d7fc05b8ab0c8467eb8526c285f0
          PHASE_A_CREATION_COMPLETE_AT: 2026-09-26T08:19:05Z
          PHASE_A_EXECUTION_RUN: "36228563835"
          PHASE_A_SOURCE_PLAN_RUN: "36226804148"
          PROJECT_ID: lead-agent-stg-739284
          REGION: me-central1
        shell: bash
        run: |
          set -uo pipefail
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          EVIDENCE=s22-phase-a-verification-evidence.txt
          SQL_INSTANCE=lead-agent-staging-postgres17
          FAILURES=0

          report() {
            local name="$1"
            local expected="$2"
            local observed="$3"
            local result=FAIL
            if [[ "$observed" == "$expected" ]]; then
              result=PASS
            else
              FAILURES=$((FAILURES + 1))
            fi
            printf 'ASSERTION|%s|%s|expected=%s|observed=%s\n' \
              "$name" "$result" "$expected" "$observed" | tee -a "$EVIDENCE"
          }

          report_true() {
            report "$1" true "$2"
          }

          report "pin.project" "lead-agent-stg-739284" "$PROJECT_ID"
          report "pin.region" "me-central1" "$REGION"
          report "pin.phase_a_execution_run" "36228563835" "$PHASE_A_EXECUTION_RUN"
          report "pin.phase_a_source_plan_run" "36226804148" "$PHASE_A_SOURCE_PLAN_RUN"
          report "pin.phase_a_applied_plan_sha256" \
            "ddcf63f2b087c14a4dc7c52aee46e8530f97d7fc05b8ab0c8467eb8526c285f0" \
            "$PHASE_A_APPLIED_PLAN_SHA256"

          SQL_DESCRIBE_OK=false
          if gcloud sql instances describe "$SQL_INSTANCE" \
            --project="$PROJECT_ID" --format=json > "$VERIFY_DIR/sql-instance.json"; then
            SQL_DESCRIBE_OK=true
          else
            printf '{}\n' > "$VERIFY_DIR/sql-instance.json"
          fi
          report_true "cloud_sql.describe_succeeded" "$SQL_DESCRIBE_OK"

          if gcloud sql instances list --project="$PROJECT_ID" --format=json \
            > "$VERIFY_DIR/sql-instances.json"; then
            SQL_LIST_OK=true
          else
            SQL_LIST_OK=false
            printf '[]\n' > "$VERIFY_DIR/sql-instances.json"
          fi
          report_true "cloud_sql.list_succeeded" "$SQL_LIST_OK"

          SQL_NAME="$(jq -r '.name // "missing"' "$VERIFY_DIR/sql-instance.json")"
          SQL_MATCHING_COUNT="$(
            jq --arg name "$SQL_INSTANCE" '[.[]? | select(.name == $name)] | length' \
              "$VERIFY_DIR/sql-instances.json"
          )"
          report "cloud_sql.instance_exists_once" "1" "$SQL_MATCHING_COUNT"
          report "cloud_sql.name" "$SQL_INSTANCE" "$SQL_NAME"
          report "cloud_sql.state" "RUNNABLE" \
            "$(jq -r '.state // "missing"' "$VERIFY_DIR/sql-instance.json")"
          report "cloud_sql.database_version" "POSTGRES_17" \
            "$(jq -r '.databaseVersion // "missing"' "$VERIFY_DIR/sql-instance.json")"
          report "cloud_sql.edition" "ENTERPRISE" \
            "$(jq -r '.settings.edition // "missing"' "$VERIFY_DIR/sql-instance.json")"
          report "cloud_sql.tier" "db-f1-micro" \
            "$(jq -r '.settings.tier // "missing"' "$VERIFY_DIR/sql-instance.json")"
          report "cloud_sql.region" "$REGION" \
            "$(jq -r '.region // "missing"' "$VERIFY_DIR/sql-instance.json")"
          report "cloud_sql.availability" "ZONAL" \
            "$(jq -r '.settings.availabilityType // "missing"' "$VERIFY_DIR/sql-instance.json")"
          report "cloud_sql.activation_policy" "ALWAYS" \
            "$(jq -r '.settings.activationPolicy // "missing"' "$VERIFY_DIR/sql-instance.json")"

          DISK_SIZE="$(jq -r '.settings.dataDiskSizeGb // "missing"' "$VERIFY_DIR/sql-instance.json")"
          DISK_AT_LEAST_10=false
          if [[ "$DISK_SIZE" =~ ^[0-9]+$ ]] && (( DISK_SIZE >= 10 )); then
            DISK_AT_LEAST_10=true
          fi
          report_true "cloud_sql.disk_size_at_least_10_gib" "$DISK_AT_LEAST_10"
          printf 'OBSERVED|cloud_sql.disk_size_gib|%s\n' "$DISK_SIZE" | tee -a "$EVIDENCE"
          report "cloud_sql.disk_type" "PD_SSD" \
            "$(jq -r '.settings.dataDiskType // "missing"' "$VERIFY_DIR/sql-instance.json")"
          report "cloud_sql.autoresize" "true" \
            "$(jq -r '.settings.storageAutoResize // false' "$VERIFY_DIR/sql-instance.json")"
          report "cloud_sql.autoresize_max_gib" "20" \
            "$(jq -r '.settings.storageAutoResizeLimit // "missing"' "$VERIFY_DIR/sql-instance.json")"

          report "cloud_sql.public_ipv4_enabled" "false" \
            "$(jq -r '.settings.ipConfiguration.ipv4Enabled // false' "$VERIFY_DIR/sql-instance.json")"
          PRIVATE_IP_COUNT="$(
            jq '[.ipAddresses[]? | select(.type == "PRIVATE" and (.ipAddress | length) > 0)] | length' \
              "$VERIFY_DIR/sql-instance.json"
          )"
          report "cloud_sql.private_ip_count" "1" "$PRIVATE_IP_COUNT"
          PRIVATE_NETWORK_OK="$(
            jq -r '(.settings.ipConfiguration.privateNetwork // "")
                   | endswith("/global/networks/lead-agent-staging-vpc")' \
              "$VERIFY_DIR/sql-instance.json"
          )"
          report_true "cloud_sql.private_network" "$PRIVATE_NETWORK_OK"
          report "cloud_sql.encrypted_transport" "ENCRYPTED_ONLY" \
            "$(jq -r '.settings.ipConfiguration.sslMode // "missing"' "$VERIFY_DIR/sql-instance.json")"

          if gcloud services vpc-peerings list \
            --project="$PROJECT_ID" \
            --network=lead-agent-staging-vpc \
            --service=servicenetworking.googleapis.com \
            --format=json > "$VERIFY_DIR/peerings.json"; then
            PEERING_LIST_OK=true
          else
            PEERING_LIST_OK=false
            printf '[]\n' > "$VERIFY_DIR/peerings.json"
          fi
          report_true "network.private_service_access_query" "$PEERING_LIST_OK"
          PEERING_COUNT="$(jq 'length' "$VERIFY_DIR/peerings.json")"
          PEERING_PRESENT=false
          if [[ "$PEERING_COUNT" =~ ^[0-9]+$ ]] && (( PEERING_COUNT >= 1 )); then
            PEERING_PRESENT=true
          fi
          report_true "network.private_service_access_connected" "$PEERING_PRESENT"
          printf 'OBSERVED|network.private_service_access_count|%s\n' "$PEERING_COUNT" | tee -a "$EVIDENCE"

          report "cloud_sql.backups_enabled" "true" \
            "$(jq -r '.settings.backupConfiguration.enabled // false' "$VERIFY_DIR/sql-instance.json")"
          report "cloud_sql.backup_start_time" "01:00" \
            "$(jq -r '.settings.backupConfiguration.startTime // "missing"' "$VERIFY_DIR/sql-instance.json")"
          report "cloud_sql.retained_backups" "7" \
            "$(jq -r '.settings.backupConfiguration.backupRetentionSettings.retainedBackups // "missing"' "$VERIFY_DIR/sql-instance.json")"
          report "cloud_sql.pitr_enabled" "true" \
            "$(jq -r '.settings.backupConfiguration.pointInTimeRecoveryEnabled // false' "$VERIFY_DIR/sql-instance.json")"
          report "cloud_sql.transaction_log_retention_days" "7" \
            "$(jq -r '.settings.backupConfiguration.transactionLogRetentionDays // "missing"' "$VERIFY_DIR/sql-instance.json")"
          report "cloud_sql.deletion_protection" "true" \
            "$(jq -r '(.settings.deletionProtectionEnabled // .deletionProtectionEnabled // false)' "$VERIFY_DIR/sql-instance.json")"

          STATE_ADDRESSES="$(terraform state list 2> "$VERIFY_DIR/state-error.txt")"
          STATE_LIST_EXIT=$?
          report "terraform_state.list_exit_code" "0" "$STATE_LIST_EXIT"
          STATE_COUNT="$(printf '%s\n' "$STATE_ADDRESSES" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          report "terraform_state.managed_resource_count" "82" "$STATE_COUNT"
          SQL_STATE_COUNT="$(grep -Fxc 'google_sql_database_instance.staging' <<< "$STATE_ADDRESSES" || true)"
          ALERT_STATE_COUNT="$(grep -Fxc 'google_monitoring_alert_policy.database_cpu' <<< "$STATE_ADDRESSES" || true)"
          report "terraform_state.cloud_sql_entry_count" "1" "$SQL_STATE_COUNT"
          report "terraform_state.database_cpu_alert_entry_count" "1" "$ALERT_STATE_COUNT"
          report "terraform_state.no_duplicate_or_ghost_sql_entry" "1" "$SQL_STATE_COUNT"
          report_true "terraform_state.backend_is_gcs" \
            "$(grep -Fq 'backend "gcs"' versions.tf && echo true || echo false)"
          report_true "terraform_state.prefix_is_staging" \
            "$(grep -Fq 'prefix = "lead-agent-platform/staging"' versions.tf && echo true || echo false)"
          printf 'OBSERVED|terraform_state.backend|gcs\n' | tee -a "$EVIDENCE"
          printf 'OBSERVED|terraform_state.prefix|lead-agent-platform/staging\n' | tee -a "$EVIDENCE"

          ACCESS_TOKEN="$(gcloud auth print-access-token 2> "$VERIFY_DIR/token-error.txt")"
          TOKEN_EXIT=$?
          if [[ "$TOKEN_EXIT" == "0" ]] && curl --fail --silent --show-error \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://monitoring.googleapis.com/v3/projects/$PROJECT_ID/alertPolicies?pageSize=100" \
            > "$VERIFY_DIR/alerts.json"; then
            ALERT_QUERY_OK=true
          else
            ALERT_QUERY_OK=false
            printf '{"alertPolicies":[]}\n' > "$VERIFY_DIR/alerts.json"
          fi
          unset ACCESS_TOKEN
          report_true "monitoring.alert_query_succeeded" "$ALERT_QUERY_OK"

          ALERT_COUNT="$(
            jq '[.alertPolicies[]?
                 | select(.displayName == "Lead Agent staging Cloud SQL CPU saturation")]
                | length' "$VERIFY_DIR/alerts.json"
          )"
          report "monitoring.database_cpu_alert_count" "1" "$ALERT_COUNT"
          ALERT_RESOURCE_MATCH="$(
            jq -r --arg instance "$PROJECT_ID:$SQL_INSTANCE" '
              [.alertPolicies[]?
               | select(.displayName == "Lead Agent staging Cloud SQL CPU saturation")
               | .conditions[]?
               | .conditionThreshold.filter
               | select(contains("resource.type = \"cloudsql_database\"")
                        and contains("resource.label.database_id = \"" + $instance + "\"")
                        and contains("metric.type = \"cloudsql.googleapis.com/database/cpu/utilization\""))]
              | length == 1
            ' "$VERIFY_DIR/alerts.json"
          )"
          report_true "monitoring.database_cpu_target" "$ALERT_RESOURCE_MATCH"
          ALERT_THRESHOLD="$(
            jq -r '[.alertPolicies[]?
                    | select(.displayName == "Lead Agent staging Cloud SQL CPU saturation")
                    | .conditions[]?.conditionThreshold.thresholdValue][0] // "missing"' \
              "$VERIFY_DIR/alerts.json"
          )"
          ALERT_DURATION="$(
            jq -r '[.alertPolicies[]?
                    | select(.displayName == "Lead Agent staging Cloud SQL CPU saturation")
                    | .conditions[]?.conditionThreshold.duration][0] // "missing"' \
              "$VERIFY_DIR/alerts.json"
          )"
          report "monitoring.database_cpu_threshold" "0.8" "$ALERT_THRESHOLD"
          report "monitoring.database_cpu_duration" "600s" "$ALERT_DURATION"

          CHANNEL_JSON_VALID="$(jq -e 'type == "array" and length > 0' <<< "$EXPECTED_CHANNELS_JSON" > /dev/null 2>&1 && echo true || echo false)"
          report_true "monitoring.expected_channels_configured" "$CHANNEL_JSON_VALID"
          ATTACHED_CHANNELS="$(
            jq -c '[.alertPolicies[]?
                    | select(.displayName == "Lead Agent staging Cloud SQL CPU saturation")
                    | .notificationChannels[]?] | sort' "$VERIFY_DIR/alerts.json"
          )"
          EXPECTED_CHANNELS_SORTED="$(jq -c 'sort' <<< "$EXPECTED_CHANNELS_JSON" 2> /dev/null || printf '[]')"
          CHANNELS_MATCH=false
          [[ "$ATTACHED_CHANNELS" == "$EXPECTED_CHANNELS_SORTED" ]] && CHANNELS_MATCH=true
          report_true "monitoring.notification_channels_attached" "$CHANNELS_MATCH"
          printf 'OBSERVED|monitoring.attached_channel_count|%s\n' \
            "$(jq 'length' <<< "$ATTACHED_CHANNELS")" | tee -a "$EVIDENCE"

          CHANNELS_RESOLVABLE=true
          while IFS= read -r channel; do
            [[ -z "$channel" ]] && continue
            RESOLVE_TOKEN="$(gcloud auth print-access-token 2> /dev/null)" || {
              CHANNELS_RESOLVABLE=false
              continue
            }
            if ! curl --fail --silent --show-error \
              --header "Authorization: Bearer $RESOLVE_TOKEN" \
              "https://monitoring.googleapis.com/v3/$channel" > /dev/null; then
              CHANNELS_RESOLVABLE=false
            fi
            unset RESOLVE_TOKEN
          done < <(jq -r '.[]?' <<< "$EXPECTED_CHANNELS_JSON" 2> /dev/null)
          report_true "monitoring.notification_channels_resolvable" "$CHANNELS_RESOLVABLE"

          VERIFIED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          VERIFIED_EPOCH="$(date -u +'%s')"
          CREATION_EPOCH="$(date -u -d "$PHASE_A_CREATION_COMPLETE_AT" +'%s')"
          ELAPSED_SECONDS="$((VERIFIED_EPOCH - CREATION_EPOCH))"
          ELAPSED_HOURS="$(awk -v seconds="$ELAPSED_SECONDS" 'BEGIN { printf "%.3f", seconds / 3600 }')"
          ACCRUED_COST="$(awk -v seconds="$ELAPSED_SECONDS" 'BEGIN { printf "%.6f", (seconds / 3600) * 0.01282877 }')"
          {
            echo "OBSERVED|cost.creation_complete_at|$PHASE_A_CREATION_COMPLETE_AT"
            echo "OBSERVED|cost.verification_at|$VERIFIED_AT"
            echo "OBSERVED|cost.elapsed_runnable_seconds|$ELAPSED_SECONDS"
            echo "OBSERVED|cost.elapsed_runnable_hours|$ELAPSED_HOURS"
            echo "OBSERVED|cost.estimated_accrued_list_price_usd|$ACCRUED_COST"
            echo "OBSERVED|cost.projected_additional_1h_usd|0.012829"
            echo "OBSERVED|cost.projected_additional_4h_usd|0.051315"
            echo "OBSERVED|cost.promotional_credit|excluded_not_relied_upon"
            echo "SUMMARY|named_assertion_failures|$FAILURES"
          } | tee -a "$EVIDENCE"

          if (( FAILURES > 0 )); then
            echo "Read-only Phase A verification reported $FAILURES named assertion failure(s)." >&2
            exit 1
          fi

      - name: Verify Phase A Terraform convergence read-only
        if: env.S22_PHASE == 'foundation-reconcile-verify' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -uo pipefail
          PLAN=s22-phase-a-convergence.tfplan
          PLAN_JSON=s22-phase-a-convergence.tfplan.json
          set +e
          terraform plan -detailed-exitcode -lock-timeout=5m -out="$PLAN"
          PLAN_EXIT_CODE=$?
          set -e
          echo "ASSERTION|phase_a_convergence.detailed_exit_code|$([[ "$PLAN_EXIT_CODE" == "0" ]] && echo PASS || echo FAIL)|expected=0|observed=$PLAN_EXIT_CODE" \
            | tee -a s22-phase-a-verification-evidence.txt
          if [[ "$PLAN_EXIT_CODE" == "2" ]]; then
            terraform show -json "$PLAN" > "$PLAN_JSON"
            echo "PROPOSED_ACTIONS_BEGIN" | tee -a s22-phase-a-verification-evidence.txt
            jq -r '.resource_changes[]?
                   | select(.change.actions != ["no-op"])
                   | "ACTION|\(.address)|\(.change.actions | join(","))"' "$PLAN_JSON" \
              | tee -a s22-phase-a-verification-evidence.txt
            echo "PROPOSED_ACTIONS_END" | tee -a s22-phase-a-verification-evidence.txt
            exit 1
          fi
          if [[ "$PLAN_EXIT_CODE" == "1" ]]; then
            echo "Phase A convergence planning failed; Phase B planning is not trustworthy." >&2
            exit 1
          fi
          echo "ASSERTION|terraform_state.no_unexpected_resource|PASS|expected=none|observed=none" \
            | tee -a s22-phase-a-verification-evidence.txt
          rm -f "$PLAN" "$PLAN_JSON"

      - name: Create and verify read-only Cloud SQL Phase B dormant plan
        if: env.S22_PHASE == 'foundation-reconcile-verify' && env.S22_ACTION == 'plan'
        working-directory: infra/deploy/gcp/staging
        shell: bash
        run: |
          set -euo pipefail
          PHASE_B_PLAN=s22-cloud-sql-phase-b.tfplan
          PHASE_B_JSON=s22-cloud-sql-phase-b.tfplan.json
