name: S22 Widget selector PostgreSQL proof

on:
  push:
    branches:
      - verify/s22-staging-recovery-capacity
    paths:
      - .github/scripts/s22-widget-session-select-postgres.test.mjs
      - .github/scripts/s22-widget-session-select-readonly.mjs
      - .github/workflows/s22-widget-session-select.yml

permissions:
  contents: read

jobs:
  selector-postgres:
    name: Selector SQL on isolated PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Disposable localhost fixture only: no environment, cloud identity, provider, or staging DB.
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: lead_agent_s22_widget_selector_test
          POSTGRES_USER: lead_agent_selector_admin
          POSTGRES_PASSWORD: disposable-widget-selector-admin-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lead_agent_selector_admin -d lead_agent_s22_widget_selector_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: true
      S22_WIDGET_SELECTOR_TEST_DATABASE_URL: postgres://lead_agent_selector_admin:disposable-widget-selector-admin-only@localhost:5432/lead_agent_s22_widget_selector_test
    steps:
      - name: Check out exact pushed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Run only the Widget selector PostgreSQL proof
        run: node --test .github/scripts/s22-widget-session-select-postgres.test.mjs
