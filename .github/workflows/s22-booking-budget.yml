name: S22 focused booking budget proof

on:
  push:
    branches:
      - verify/s22-staging-recovery-capacity
    paths:
      - .github/workflows/s22-booking-budget.yml
      - packages/config/src/ai-journey.ts
      - packages/database/src/repositories/ai-journey-budget.ts
      - tests/database/ai-orchestration.test-suite.ts

permissions:
  contents: read

jobs:
  budget-postgres:
    name: Seven S22 budget cases on isolated PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No staging environment, GCP identity, provider key, or production DB access.
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: lead_agent_s22_test
          POSTGRES_USER: lead_agent_test
          POSTGRES_PASSWORD: disposable-s22-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lead_agent_test -d lead_agent_s22_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: true
      TEST_DATABASE_URL: postgres://lead_agent_test:disposable-s22-test-only@localhost:5432/lead_agent_s22_test
    steps:
      - name: Check out exact pushed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked repository dependencies
        run: pnpm install --frozen-lockfile
      - name: Run only the new durable budget PostgreSQL group
        run: pnpm exec vitest run tests/database/s4a-schema.test.ts --testNamePattern "S22 durable synthetic booking budget" --maxWorkers=1
